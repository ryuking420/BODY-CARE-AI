<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BODY CARE AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 30px;
      font-size: 28px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      margin-top: 16px;
    }

    label:first-child {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    .record {
      border-top: 1px solid #ddd;
      padding: 15px 0;
    }

    .record:first-child {
      border-top: none;
    }

    .exercise {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .details {
      color: #555;
      font-size: 16px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 20px 0;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>BODY CARE AI</h1>

    <div class="card">

      <label for="exercise">種目</label>
      <input
        type="text"
        id="exercise"
        placeholder="例：ベンチプレス"
      >

      <label for="weight">重量（kg）</label>
      <input
        type="number"
        id="weight"
        placeholder="例：70"
        inputmode="decimal"
      >

      <label for="reps">回数</label>
      <input
        type="number"
        id="reps"
        placeholder="例：8"
        inputmode="numeric"
      >

      <button onclick="addRecord()">
        記録する
      </button>

    </div>


    <div class="card">

      <h2>トレーニング記録</h2>

      <div id="records">
        <div class="empty">
          まだ記録がありません
        </div>
      </div>

    </div>

  </div>


  <script>

    function addRecord() {

      const exercise =
        document.getElementById("exercise").value.trim();

      const weight =
        document.getElementById("weight").value;

      const reps =
        document.getElementById("reps").value;


      if (!exercise || !weight || !reps) {
        alert("種目・重量・回数をすべて入力してください");
        return;
      }


      const records =
        document.getElementById("records");


      const empty =
        records.querySelector(".empty");

      if (empty) {
        empty.remove();
      }


      const record =
        document.createElement("div");

      record.className = "record";


      record.innerHTML = `
        <div class="exercise">
          ${exercise}
        </div>

        <div class="details">
          ${weight} kg × ${reps} 回
        </div>
      `;


      records.prepend(record);


      document.getElementById("exercise").value = "";
      document.getElementById("weight").value = "";
      document.getElementById("reps").value = "";
    }

  </script>

</body>
</html>
