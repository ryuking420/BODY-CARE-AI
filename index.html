<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BODY CARE AI</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;

      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 30px;
      font-size: 30px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 8px;
    }

    label:first-child {
      margin-top: 0;
    }

    select,
    input {
      width: 100%;
      padding: 14px;

      font-size: 18px;

      border: 1px solid #ccc;
      border-radius: 10px;

      background: white;
    }

    button {
      width: 100%;

      margin-top: 15px;

      padding: 15px;

      border: none;
      border-radius: 10px;

      background: #111;
      color: white;

      font-size: 18px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary-button {
      background: #555;
    }

    .danger-button {
      background: #c62828;
    }

    .set-list {
      margin-top: 20px;
    }

    .set-item {
      display: flex;
      justify-content: space-between;

      border-top: 1px solid #ddd;

      padding: 14px 0;

      font-size: 18px;
    }

    .set-number {
      font-weight: bold;
    }

    .draft-exercise {
      margin-top: 25px;

      padding-top: 20px;

      border-top: 2px solid #222;
    }

    .draft-exercise-title {
      font-size: 22px;
      font-weight: bold;

      margin-bottom: 10px;
    }

    .draft-set {
      font-size: 16px;
      color: #555;

      line-height: 1.8;
    }

    .draft-total {
      margin-top: 8px;

      font-weight: bold;
    }

    .summary {
      background: #111;
      color: white;

      border-radius: 16px;

      padding: 20px;

      margin-bottom: 20px;

      text-align: center;
    }

    .summary-title {
      font-size: 15px;
      opacity: 0.8;
    }

    .summary-number {
      font-size: 30px;
      font-weight: bold;

      margin-top: 5px;
    }

    .summary-unit {
      font-size: 15px;
    }

    .record {
      border-top: 1px solid #ddd;

      padding: 20px 0;
    }

    .record:first-child {
      border-top: none;
    }

    .record-date {
      font-size: 14px;
      color: #777;

      margin-bottom: 8px;
    }

    .record-title {
      font-size: 23px;
      font-weight: bold;

      margin-bottom: 15px;
    }

    .record-exercise {
      font-size: 20px;
      font-weight: bold;

      margin-top: 15px;
      margin-bottom: 5px;
    }

    .record-set {
      font-size: 16px;
      color: #555;

      line-height: 1.8;
    }

    .record-total {
      margin-top: 12px;

      font-weight: bold;
      font-size: 17px;
    }

    .empty {
      text-align: center;
      color: #888;

      padding: 20px 0;
    }

    .small-note {
      color: #777;

      font-size: 14px;

      margin-top: 10px;

      line-height: 1.5;
    }

  </style>
</head>


<body>

<div class="container">

  <h1>BODY CARE AI</h1>


  <!-- ================================= -->
  <!-- トレーニング入力 -->
  <!-- ================================= -->

  <div class="card">

    <label for="exercise">
      種目
    </label>

    <select id="exercise">

      <option value="">
        種目を選択してください
      </option>

      <option value="ベンチプレス">
        ベンチプレス
      </option>

      <option value="スクワット">
        スクワット
      </option>

      <option value="デッドリフト">
        デッドリフト
      </option>

      <option value="RDL">
        RDL
      </option>

      <option value="ラットプルダウン">
        ラットプルダウン
      </option>

      <option value="懸垂">
        懸垂
      </option>

      <option value="レッグプレス">
        レッグプレス
      </option>

      <option value="ショルダープレス">
        ショルダープレス
      </option>

      <option value="サイドレイズ">
        サイドレイズ
      </option>

      <option value="ペックフライ">
        ペックフライ
      </option>

      <option value="フェイスプル">
        フェイスプル
      </option>

    </select>


    <label for="weight">
      重量（kg）
    </label>

    <input
      type="number"
      id="weight"
      placeholder="例：70"
      inputmode="decimal"
      step="0.5"
    >


    <label for="reps">
      回数
    </label>

    <input
      type="number"
      id="reps"
      placeholder="例：8"
      inputmode="numeric"
      step="1"
    >


    <button
      type="button"
      onclick="addSet()">

      セットを追加

    </button>


    <!-- 現在の種目のセット -->

    <div
      class="set-list"
      id="currentSets">
    </div>


    <!-- 現在の種目を確定 -->

    <button
      type="button"
      class="secondary-button"
      onclick="finishExercise()">

      この種目を完了

    </button>


    <!-- 今日のトレーニング保存 -->

    <button
      type="button"
      onclick="saveWorkout()">

      今日のトレーニングを保存

    </button>


    <div class="small-note">

      ①セットを追加<br>
      ②種目を完了<br>
      ③次の種目を選択<br>
      ④最後に「今日のトレーニングを保存」

    </div>


    <!-- 今日作成中のトレーニング -->

    <div
      id="draftWorkout">
    </div>

  </div>


  <!-- ================================= -->
  <!-- 今日の総負荷 -->
  <!-- ================================= -->

  <div class="summary">

    <div class="summary-title">
      今日の総負荷
    </div>

    <div class="summary-number">

      <span id="todayTotal">
        0
      </span>

      <span class="summary-unit">
        kg
      </span>

    </div>

  </div>


  <!-- ================================= -->
  <!-- トレーニング履歴 -->
  <!-- ================================= -->

  <div class="card">

    <h2>
      トレーニング履歴
    </h2>

    <div id="records">

      <div class="empty">
        まだ記録がありません
      </div>

    </div>

  </div>

</div>


<script>


/* ==========================================
   現在入力中のセット
========================================== */

let currentSets = [];


/* ==========================================
   今日作成中の種目
========================================== */

let draftExercises = [];


/* ==========================================
   保存データ取得
========================================== */

function getRecords() {

  const saved =
    localStorage.getItem(
      "trainingRecords"
    );

  if (!saved) {
    return [];
  }

  try {

    return JSON.parse(saved);

  } catch {

    return [];

  }

}


/* ==========================================
   保存
========================================== */

function saveRecords(records) {

  localStorage.setItem(
    "trainingRecords",
    JSON.stringify(records)
  );

}


/* ==========================================
   セット追加
========================================== */

function addSet() {

  const exercise =
    document.getElementById(
      "exercise"
    ).value;

  const weight =
    document.getElementById(
      "weight"
    ).value;

  const reps =
    document.getElementById(
      "reps"
    ).value;


  if (
    !exercise ||
    !weight ||
    !reps
  ) {

    alert(
      "種目・重量・回数をすべて入力してください"
    );

    return;

  }


  currentSets.push({

    weight:
      Number(weight),

    reps:
      Number(reps)

  });


  renderCurrentSets();


  document.getElementById(
    "weight"
  ).value = "";

  document.getElementById(
    "reps"
  ).value = "";

}


/* ==========================================
   現在のセット表示
========================================== */

function renderCurrentSets() {

  const area =
    document.getElementById(
      "currentSets"
    );


  area.innerHTML = "";


  currentSets.forEach(
    (set, index) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "set-item";


      item.innerHTML = `

        <span class="set-number">
          セット ${index + 1}
        </span>

        <span>
          ${set.weight} kg ×
          ${set.reps} 回
        </span>

      `;


      area.appendChild(item);

    }
  );

}


/* ==========================================
   現在の種目を完了
========================================== */

function finishExercise() {

  const exercise =
    document.getElementById(
      "exercise"
    ).value;


  if (!exercise) {

    alert(
      "種目を選択してください"
    );

    return;

  }


  if (
    currentSets.length === 0
  ) {

    alert(
      "まずセットを追加してください"
    );

    return;

  }


  draftExercises.push({

    exercise:
      exercise,

    sets:
      [...currentSets]

  });


  currentSets = [];


  renderCurrentSets();


  document.getElementById(
    "exercise"
  ).value = "";


  document.getElementById(
    "weight"
  ).value = "";

  document.getElementById(
    "reps"
  ).value = "";


  renderDraftWorkout();

}


/* ==========================================
   作成中トレーニング表示
========================================== */

function renderDraftWorkout() {

  const area =
    document.getElementById(
      "draftWorkout"
    );


  area.innerHTML = "";


  draftExercises.forEach(
    (exercise, index) => {

      const block =
        document.createElement(
          "div"
        );


      block.className =
        "draft-exercise";


      let text = "";


      exercise.sets.forEach(
        (set, setIndex) => {

          text += `

            <div class="draft-set">

              セット ${setIndex + 1}：
              ${set.weight} kg ×
              ${set.reps} 回

            </div>

          `;

        }
      );


      const total =
        calculateExerciseTotal(
          exercise
        );


      block.innerHTML = `

        <div class="draft-exercise-title">

          ${exercise.exercise}

        </div>

        ${text}

        <div class="draft-total">

          種目総負荷：
          ${total.toLocaleString()} kg

        </div>

      `;


      area.appendChild(block);

    }
  );


  updateTodayTotal();

}


/* ==========================================
   種目総負荷
========================================== */

function calculateExerciseTotal(
  exercise
) {

  return exercise.sets.reduce(
    (total, set) => {

      return total +
        Number(set.weight) *
        Number(set.reps);

    },
    0
  );

}


/* ==========================================
   今日の総負荷
========================================== */

function calculateDraftTotal() {

  return draftExercises.reduce(
    (total, exercise) => {

      return total +
        calculateExerciseTotal(
          exercise
        );

    },
    0
  );

}


/* ==========================================
   今日の総負荷表示
========================================== */

function updateTodayTotal() {

  document.getElementById(
    "todayTotal"
  ).textContent =
    calculateDraftTotal()
      .toLocaleString();

}


/* ==========================================
   今日のトレーニング保存
========================================== */

function saveWorkout() {

  /* 現在入力中のセットが残っている場合 */

  if (
    currentSets.length > 0
  ) {

    alert(
      "現在の種目を「この種目を完了」で確定してください"
    );

    return;

  }


  if (
    draftExercises.length === 0
  ) {

    alert(
      "トレーニングを追加してください"
    );

    return;

  }


  const records =
    getRecords();


  const workout = {

    type:
      "dailyWorkout",

    id:
      Date.now(),

    date:
      new Date().toISOString(),

    exercises:
      draftExercises.map(
        exercise => ({

          exercise:
            exercise.exercise,

          sets:
            exercise.sets.map(
              set => ({

                weight:
                  set.weight,

                reps:
                  set.reps

              })
            )

        })
      )

  };


  records.unshift(
    workout
  );


  saveRecords(
    records
  );


  /* 作成中データをリセット */

  currentSets = [];

  draftExercises = [];


  renderCurrentSets();

  renderDraftWorkout();

  renderRecords();


  document.getElementById(
    "exercise"
  ).value = "";


  alert(
    "トレーニングを保存しました！"
  );

}


/* ==========================================
   日付表示
========================================== */

function formatDate(
  dateString
) {

  const date =
    new Date(
      dateString
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  return (

    date.getFullYear() +
    "年" +
    (date.getMonth() + 1) +
    "月" +
    date.getDate() +
    "日"

  );

}


/* ==========================================
   旧データの総負荷
========================================== */

function calculateOldRecordTotal(
  record
) {

  if (
    record.weight !== undefined &&
    record.reps !== undefined
  ) {

    return (
      Number(record.weight) *
      Number(record.reps)
    );

  }


  return 0;

}


/* ==========================================
   新しい1日記録の総負荷
========================================== */

function calculateWorkoutTotal(
  record
) {

  if (
    record.type !==
    "dailyWorkout"
  ) {

    return calculateOldRecordTotal(
      record
    );

  }


  return record.exercises.reduce(
    (total, exercise) => {

      return total +
        calculateExerciseTotal(
          exercise
        );

    },
    0
  );

}


/* ==========================================
   履歴表示
========================================== */

function renderRecords() {

  const records =
    getRecords();


  const area =
    document.getElementById(
      "records"
    );


  area.innerHTML = "";


  if (
    records.length === 0
  ) {

    area.innerHTML = `

      <div class="empty">

        まだ記録がありません

      </div>

    `;

    return;

  }


  records.forEach(
    (record, index) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "record";


      /* ==========================
         新形式
      ========================== */

      if (
        record.type ===
        "dailyWorkout"
      ) {

        let exercisesText = "";


        record.exercises.forEach(
          exercise => {

            let setsText = "";


            exercise.sets.forEach(
              (set, setIndex) => {

                setsText += `

                  <div class="record-set">

                    セット ${setIndex + 1}：
                    ${set.weight} kg ×
                    ${set.reps} 回

                  </div>

                `;

              }
            );


            const exerciseTotal =
              calculateExerciseTotal(
                exercise
              );


            exercisesText += `

              <div class="record-exercise">

                ${exercise.exercise}

              </div>

              ${setsText}

              <div class="record-set">

                種目総負荷：
                ${exerciseTotal.toLocaleString()} kg

              </div>

            `;

          }
        );


        const total =
          calculateWorkoutTotal(
            record
          );


        item.innerHTML = `

          <div class="record-date">

            ${formatDate(record.date)}

          </div>


          <div class="record-title">

            トレーニング

          </div>


          ${exercisesText}


          <div class="record-total">

            1日の総負荷：
            ${total.toLocaleString()} kg

          </div>


          <button
            type="button"
            class="danger-button"
            onclick="deleteRecord(${index})">

            この記録を削除

          </button>

        `;

      }


      /* ==========================
         旧形式
      ========================== */

      else {

        const total =
          calculateOldRecordTotal(
            record
          );


        item.innerHTML = `

          <div class="record-date">

            ${formatDate(record.date)}

          </div>


          <div class="record-exercise">

            ${record.exercise}

          </div>


          <div class="record-set">

            ${record.weight} kg ×
            ${record.reps} 回

          </div>


          <div class="record-total">

            総負荷：
            ${total.toLocaleString()} kg

          </div>


          <button
            type="button"
            class="danger-button"
            onclick="deleteRecord(${index})">

            この記録を削除

          </button>

        `;

      }


      area.appendChild(
        item
      );

    }
  );

}


/* ==========================================
   記録削除
========================================== */

function deleteRecord(
  index
) {

  const records =
    getRecords();


  if (
    !records[index]
  ) {

    return;

  }


  const answer =
    confirm(
      "このトレーニング記録を削除しますか？"
    );


  if (!answer) {

    return;

  }


  records.splice(
    index,
    1
  );


  saveRecords(
    records
  );


  renderRecords();

}


/* ==========================================
   起動
========================================== */

renderRecords();

renderCurrentSets();

renderDraftWorkout();


</script>

</body>
</html>
