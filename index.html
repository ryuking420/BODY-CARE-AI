<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BODY CARE AI</title>

<style>

:root{
  --bg:#080b0e;
  --card:#12171c;
  --card2:#171d23;
  --input:#0c1014;
  --line:#293139;

  --text:#f4f6f8;
  --sub:#929ba5;
  --muted:#626b75;

  --green:#32d47f;
  --green-dark:#20b568;

  --red:#ff5555;

  --nav:#11161b;

  --radius:18px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  background:var(--bg);
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -10%,
      #1b2831 0,
      #080b0e 42%
    );

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}


/* =========================================================
   CONTAINER
========================================================= */

.container{
  width:100%;
  max-width:620px;
  margin:auto;

  padding:
    calc(16px + env(safe-area-inset-top))
    13px
    calc(105px + env(safe-area-inset-bottom));
}


/* =========================================================
   HEADER
========================================================= */

.header{
  padding:9px 5px 25px;
}

.logo{
  color:var(--green);
  font-size:13px;
  font-weight:900;
  letter-spacing:3px;
}

.app-title{
  margin:7px 0 0;

  font-size:32px;
  font-weight:900;
  letter-spacing:-1.2px;
}

.app-subtitle{
  margin-top:7px;

  color:var(--sub);

  font-size:14px;
}


/* =========================================================
   SECTION
========================================================= */

.app-section{
  scroll-margin-top:20px;
}

.card{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  border:
    1px solid rgba(255,255,255,.07);

  border-radius:var(--radius);

  padding:19px;

  margin-bottom:15px;

  box-shadow:
    0 14px 35px rgba(0,0,0,.28);

  backdrop-filter:blur(10px);
}

.section-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:18px;
}

.section-title{
  margin:0;

  font-size:19px;
  font-weight:900;
}

.section-label{
  color:#68727c;

  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
}


/* =========================================================
   INPUT
========================================================= */

label{
  display:block;

  margin:17px 0 8px;

  color:var(--sub);

  font-size:13px;
  font-weight:800;
}

label:first-child{
  margin-top:0;
}

select,
input{
  width:100%;
  height:54px;

  padding:0 14px;

  border:
    1px solid var(--line);

  border-radius:13px;

  background:var(--input);

  color:var(--text);

  font-size:17px;
  font-weight:600;

  outline:none;
}

input::placeholder{
  color:#505963;
}

select:focus,
input:focus{
  border-color:var(--green);

  box-shadow:
    0 0 0 3px
    rgba(50,212,127,.11);
}

select{
  appearance:none;

  background-image:
    linear-gradient(
      45deg,
      transparent 50%,
      #87919b 50%
    ),
    linear-gradient(
      135deg,
      #87919b 50%,
      transparent 50%
    );

  background-position:
    calc(100% - 20px) 23px,
    calc(100% - 14px) 23px;

  background-size:
    6px 6px,
    6px 6px;

  background-repeat:no-repeat;
}


/* =========================================================
   FAST INPUT
========================================================= */

.input-row{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:10px;
}

.input-group label{
  margin-top:17px;
}

.input-unit{
  position:relative;
}

.input-unit input{
  padding-right:45px;
}

.input-unit span{
  position:absolute;

  right:14px;
  top:50%;

  transform:translateY(-50%);

  color:#626c76;

  font-size:13px;
  font-weight:800;

  pointer-events:none;
}


/* =========================================================
   BUTTONS
========================================================= */

button{
  width:100%;
  min-height:53px;

  margin-top:14px;

  border:0;
  border-radius:13px;

  color:#fff;

  background:#252c33;

  font-size:16px;
  font-weight:800;

  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.38;
}

#addSetButton{
  background:
    linear-gradient(
      135deg,
      var(--green),
      var(--green-dark)
    );

  color:#04140b;

  box-shadow:
    0 8px 20px
    rgba(50,212,127,.14);
}

.complete-button{
  margin-top:18px;

  background:#252b31;

  border:
    1px solid #343d46;
}

.save-button{
  background:#222930;

  border:
    1px solid #343d46;
}


/* =========================================================
   PREVIOUS
========================================================= */

.previous-card{
  margin-top:16px;

  padding:16px;

  border-radius:14px;

  background:#0d1216;

  border:
    1px solid #252d35;
}

.previous-title{
  color:var(--green);

  font-size:14px;
  font-weight:900;

  margin-bottom:6px;
}

.previous-date{
  color:var(--sub);

  font-size:13px;

  margin-bottom:12px;
}

.previous-set{
  color:#dce1e5;

  font-size:15px;
  line-height:1.7;
}

.previous-total{
  margin-top:11px;
  padding-top:11px;

  border-top:
    1px solid var(--line);

  color:#fff;

  font-size:14px;
  font-weight:800;
}

.one-rm{
  color:#69737d;

  font-size:12px;
  line-height:1.6;
}

.one-rm-best{
  margin-top:9px;
  padding-top:9px;

  border-top:
    1px solid var(--line);

  color:var(--green);

  font-size:14px;
  font-weight:900;
}


/* =========================================================
   CURRENT SETS
========================================================= */

.set-list{
  margin-top:19px;
}

.set-list-title{
  color:#737d87;

  font-size:12px;
  font-weight:800;

  margin-bottom:7px;
}

.set-item{
  display:grid;

  grid-template-columns:
    64px
    1fr
    72px;

  align-items:center;

  gap:8px;

  min-height:55px;

  border-top:
    1px solid var(--line);
}

.set-number{
  color:var(--green);

  font-size:13px;
  font-weight:900;
}

.set-value{
  color:#edf0f2;

  font-size:16px;
  font-weight:700;
}

.set-delete{
  width:72px !important;
  min-width:72px !important;

  height:39px !important;
  min-height:39px !important;

  margin:0 !important;
  padding:0 !important;

  border-radius:9px !important;

  background:
    rgba(255,85,85,.11) !important;

  border:
    1px solid rgba(255,85,85,.3) !important;

  color:#ff6767 !important;

  font-size:12px !important;
}

.empty-sets{
  padding:9px 0;

  color:var(--muted);

  font-size:13px;
}


/* =========================================================
   TODAY DASHBOARD
========================================================= */

.today-card{
  position:relative;
  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      #171e24,
      #101419
    );

  border:
    1px solid #303942;

  border-radius:21px;

  padding:20px;

  margin-bottom:15px;

  box-shadow:
    0 17px 42px rgba(0,0,0,.35);
}

.today-card::before{
  content:"";

  position:absolute;

  left:0;
  top:20px;

  width:3px;
  height:42px;

  background:var(--green);

  border-radius:
    0 4px 4px 0;
}

.today-header{
  display:flex;

  justify-content:space-between;
  align-items:flex-end;

  margin-bottom:21px;
}

.today-heading{
  font-size:21px;
  font-weight:900;
}

.today-date{
  color:#69737d;

  font-size:11px;
  font-weight:800;
}

.today-empty{
  color:var(--muted);

  font-size:14px;

  padding:10px 0;
}


/* =========================================================
   EXERCISE PANEL
========================================================= */

.today-exercise{
  padding:18px 0;

  border-top:
    1px solid var(--line);
}

.today-exercise:first-child{
  padding-top:0;

  border-top:0;
}

.exercise-top{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:13px;
}

.today-exercise-name{
  font-size:20px;
  font-weight:900;

  letter-spacing:-.4px;
}

.today-exercise-summary{
  color:var(--green);

  font-size:11px;
  font-weight:900;
}


/* =========================================================
   SET STRIP
========================================================= */

.set-strip{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:6px;

  margin-bottom:14px;
}

.set-chip{
  min-width:0;

  padding:9px 5px;

  border-radius:9px;

  background:#0c1115;

  border:
    1px solid #242c33;

  text-align:center;
}

.set-chip-label{
  color:#626d77;

  font-size:9px;
  font-weight:800;

  margin-bottom:3px;
}

.set-chip-value{
  color:#dfe4e8;

  font-size:12px;
  font-weight:800;

  white-space:nowrap;
}


/* =========================================================
   STATS
========================================================= */

.exercise-stats{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:8px;
}

.stat-box{
  padding:12px;

  border-radius:11px;

  background:#0d1216;

  border:
    1px solid #252d35;
}

.stat-label{
  color:#68727c;

  font-size:10px;
  font-weight:800;

  letter-spacing:.4px;
}

.stat-value{
  margin-top:3px;

  color:#fff;

  font-size:18px;
  font-weight:900;
}

.stat-value.green{
  color:var(--green);
}


/* =========================================================
   COMPARISON
========================================================= */

.comparison-box{
  margin-top:10px;

  padding:12px;

  border-radius:11px;

  background:#0b1014;

  border:
    1px solid #242c33;
}

.comparison-title{
  margin-bottom:5px;

  color:#e7eaed;

  font-size:11px;
  font-weight:900;
}

.comparison-line{
  color:#7f8993;

  font-size:12px;
  line-height:1.7;
}

.comparison-up{
  color:var(--green) !important;

  font-weight:900;
}

.comparison-down{
  color:#ff6666 !important;

  font-weight:900;
}

.comparison-same{
  color:#c4cbd1 !important;

  font-weight:800;
}


/* =========================================================
   TOTAL
========================================================= */

.total-card{
  position:relative;
  overflow:hidden;

  padding:21px;

  margin-bottom:15px;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      #14241b,
      #0d1511
    );

  border:
    1px solid
    rgba(50,212,127,.24);

  text-align:center;

  box-shadow:
    0 15px 40px rgba(0,0,0,.3);
}

.total-label{
  color:#71877a;

  font-size:10px;
  font-weight:900;

  letter-spacing:1.5px;
}

.total-number{
  margin-top:4px;

  color:#fff;

  font-size:40px;
  font-weight:900;

  letter-spacing:-1.5px;
}

.total-unit{
  color:#799084;

  font-size:15px;
  font-weight:700;
}


/* =========================================================
   HISTORY
========================================================= */

.record{
  padding:21px 0;

  border-top:
    1px solid var(--line);
}

.record:first-child{
  border-top:0;
}

.history-date{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:4px;
}

.date-title{
  font-size:20px;
  font-weight:900;
}

.history-label{
  color:#69737d;

  font-size:10px;
  font-weight:900;

  letter-spacing:1px;
}

.workout-title{
  color:#626d77;

  font-size:11px;
  font-weight:800;

  margin-bottom:15px;
}

.history-exercise{
  padding:15px 0;

  border-top:
    1px solid #242c33;
}

.history-exercise:first-child{
  border-top:0;
}

.history-exercise-name{
  font-size:17px;
  font-weight:900;

  margin-bottom:10px;
}

.history-set-row{
  color:#aeb6be;

  font-size:13px;

  line-height:1.8;
}

.history-stats{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:7px;

  margin-top:10px;
}

.history-stat{
  padding:10px;

  border-radius:9px;

  background:#0d1216;

  border:
    1px solid #222a31;
}

.history-stat-label{
  color:#65707a;

  font-size:9px;
  font-weight:800;
}

.history-stat-value{
  margin-top:3px;

  color:#fff;

  font-size:14px;
  font-weight:900;
}

.history-stat-value.green{
  color:var(--green);
}

.day-total{
  margin-top:18px;
  padding-top:15px;

  border-top:
    1px solid var(--line);

  display:flex;

  justify-content:space-between;
  align-items:center;
}

.day-total-label{
  color:#737d86;

  font-size:11px;
  font-weight:800;
}

.day-total-value{
  color:var(--green);

  font-size:17px;
  font-weight:900;
}

.delete-button{
  margin-top:14px;

  min-height:43px;

  background:
    rgba(255,85,85,.08);

  border:
    1px solid rgba(255,85,85,.25);

  color:#ff6666;

  font-size:12px;
}


/* =========================================================
   ANALYSIS
========================================================= */

.analysis-card{
  background:
    linear-gradient(
      145deg,
      #151c22,
      #101419
    );

  border:
    1px solid #2c353e;

  border-radius:20px;

  padding:22px;

  margin-bottom:15px;
}

.analysis-icon{
  width:48px;
  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:14px;

  background:
    rgba(50,212,127,.1);

  color:var(--green);

  font-size:22px;
  font-weight:900;

  margin-bottom:14px;
}

.analysis-title{
  font-size:21px;
  font-weight:900;

  margin-bottom:7px;
}

.analysis-text{
  color:#7f8993;

  font-size:14px;
  line-height:1.8;
}

.analysis-roadmap{
  margin-top:17px;

  padding-top:15px;

  border-top:
    1px solid var(--line);

  color:#adb5bd;

  font-size:13px;

  line-height:2;
}

.analysis-roadmap span{
  color:var(--green);

  font-weight:800;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:1000;

  padding:
    8px
    12px
    calc(8px + env(safe-area-inset-bottom));

  background:
    rgba(8,11,14,.88);

  border-top:
    1px solid rgba(255,255,255,.08);

  backdrop-filter:
    blur(20px);
}

.bottom-nav-inner{
  max-width:620px;
  margin:auto;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:5px;

  padding:5px;

  border-radius:16px;

  background:
    rgba(18,23,28,.95);

  border:
    1px solid #242c33;
}

.nav-button{
  min-height:55px;

  margin:0;

  padding:5px 2px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:3px;

  border-radius:12px;

  background:transparent;

  color:#68727c;

  font-size:10px;
  font-weight:800;
}

.nav-icon{
  font-size:18px;

  line-height:1;
}

.nav-button.active{
  color:var(--green);

  background:
    rgba(50,212,127,.09);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:420px){

  .container{
    padding-left:12px;
    padding-right:12px;
  }

  .card,
  .today-card,
  .analysis-card{
    padding:17px;
  }

  .app-title{
    font-size:29px;
  }

  .set-item{
    grid-template-columns:
      60px
      1fr
      70px;
  }

  .set-delete{
    width:70px !important;
    min-width:70px !important;
  }

  .set-chip-value{
    font-size:11px;
  }

}

</style>
</head>


<body>


<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="logo">
    BODY CARE AI
  </div>

  <h1 class="app-title">
    Training Log
  </h1>

  <div class="app-subtitle">
    今日の身体を、未来の能力へ。
  </div>

</header>


<!-- =====================================================
     RECORD
===================================================== -->

<section
  id="recordSection"
  class="app-section"
>

<div class="card">

  <div class="section-heading">

    <h2 class="section-title">
      トレーニング記録
    </h2>

    <div class="section-label">
      WORKOUT
    </div>

  </div>


  <label for="trainingDate">
    トレーニング日
  </label>

  <input
    type="date"
    id="trainingDate"
  >


  <label for="exercise">
    種目
  </label>

  <select id="exercise">

    <option value="">
      種目を選択してください
    </option>

    <option value="ベンチプレス">
      ベンチプレス
    </option>

    <option value="スクワット">
      スクワット
    </option>

    <option value="デッドリフト">
      デッドリフト
    </option>

    <option value="RDL">
      RDL
    </option>

    <option value="ラットプルダウン">
      ラットプルダウン
    </option>

    <option value="懸垂">
      懸垂
    </option>

    <option value="レッグプレス">
      レッグプレス
    </option>

    <option value="ショルダープレス">
      ショルダープレス
    </option>

    <option value="サイドレイズ">
      サイドレイズ
    </option>

    <option value="ペックフライ">
      ペックフライ
    </option>

    <option value="フェイスプル">
      フェイスプル
    </option>

  </select>


  <div
    id="previousRecord"
    class="previous-card"
    style="display:none"
  ></div>


  <!-- 高速入力 -->

  <div class="input-row">

    <div class="input-group">

      <label for="weight">
        重量
      </label>

      <div class="input-unit">

        <input
          type="number"
          id="weight"
          placeholder="70"
          inputmode="decimal"
          step="0.5"
        >

        <span>kg</span>

      </div>

    </div>


    <div class="input-group">

      <label for="reps">
        回数
      </label>

      <div class="input-unit">

        <input
          type="number"
          id="reps"
          placeholder="10"
          inputmode="numeric"
        >

        <span>回</span>

      </div>

    </div>

  </div>


  <button
    type="button"
    id="addSetButton"
  >
    ＋ セットを追加
  </button>


  <div
    class="set-list"
    id="currentSets"
  ></div>


  <button
    type="button"
    class="complete-button"
    id="completeExerciseButton"
  >
    この種目を完了
  </button>

</div>

</section>


<!-- =====================================================
     TODAY
===================================================== -->

<section
  id="todaySection"
  class="app-section"
>

<div class="today-card">

  <div class="today-header">

    <div class="today-heading">
      今日のトレーニング
    </div>

    <div
      class="today-date"
      id="todayDateLabel"
    ></div>

  </div>


  <div id="todayExercises">

    <div class="today-empty">
      まだ完了した種目はありません
    </div>

  </div>


  <button
    type="button"
    class="save-button"
    id="saveTodayButton"
  >
    この日のトレーニングを保存
  </button>

</div>


<div class="total-card">

  <div class="total-label">
    TODAY'S TOTAL LOAD
  </div>

  <div class="total-number">

    <span id="todayTotalLoad">
      0
    </span>

    <span class="total-unit">
      kg
    </span>

  </div>

</div>

</section>


<!-- =====================================================
     HISTORY
===================================================== -->

<section
  id="historySection"
  class="app-section"
>

<div class="card">

  <div class="section-heading">

    <h2 class="section-title">
      トレーニング履歴
    </h2>

    <div class="section-label">
      HISTORY
    </div>

  </div>


  <div id="history">

    <div class="empty">
      まだ記録がありません
    </div>

  </div>

</div>

</section>


<!-- =====================================================
     ANALYSIS
===================================================== -->

<section
  id="analysisSection"
  class="app-section"
>

<div class="analysis-card">

  <div class="analysis-icon">
    AI
  </div>

  <div class="analysis-title">
    BODY CARE AI
  </div>

  <div class="analysis-text">
    あなたの身体とトレーニングを理解し、
    未来の能力から逆算した提案を行う。
  </div>

<script>

/* =========================================================
   DATA
========================================================= */

let currentSets = [];
let currentExercises = [];


/* =========================================================
   DATE
========================================================= */

function getToday(){

  const now = new Date();

  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;

}


function formatDate(dateString){

  const parts =
    dateString.split("-");

  if(parts.length !== 3){
    return dateString;
  }

  return `${parts[0]}年${Number(parts[1])}月${Number(parts[2])}日`;

}


/* =========================================================
   STORAGE
========================================================= */

function getHistory(){

  const saved =
    localStorage.getItem(
      "trainingHistory"
    );

  if(!saved){
    return [];
  }

  try{

    const data =
      JSON.parse(saved);

    return Array.isArray(data)
      ? data
      : [];

  }catch(error){

    return [];

  }

}


function saveHistory(history){

  localStorage.setItem(
    "trainingHistory",
    JSON.stringify(history)
  );

}


/* =========================================================
   LOAD
========================================================= */

function calculateExerciseLoad(sets){

  return (sets || []).reduce(
    (total,set) =>
      total +
      Number(set.weight || 0) *
      Number(set.reps || 0),
    0
  );

}


/* =========================================================
   1RM
========================================================= */

function calculateEstimated1RM(
  weight,
  reps
){

  weight =
    Number(weight || 0);

  reps =
    Number(reps || 0);

  if(
    weight <= 0 ||
    reps <= 0
  ){
    return 0;
  }

  return weight *
    (1 + reps / 30);

}


function getBestEstimated1RM(sets){

  if(
    !sets ||
    sets.length === 0
  ){
    return 0;
  }

  return Math.max(
    ...sets.map(
      set =>
        calculateEstimated1RM(
          set.weight,
          set.reps
        )
    )
  );

}


/* =========================================================
   PREVIOUS RECORD
========================================================= */

function findPreviousRecord(
  exerciseName,
  selectedDate
){

  const history =
    getHistory();


  const previousDays =
    history
      .filter(
        record =>
          record.date < selectedDate
      )
      .sort(
        (a,b) =>
          b.date.localeCompare(a.date)
      );


  for(
    const day of previousDays
  ){

    const exercise =
      (day.exercises || [])
        .find(
          item =>
            item.exercise ===
            exerciseName
        );


    if(exercise){

      return {
        date:day.date,
        exercise:exercise
      };

    }

  }


  return null;

}


/* =========================================================
   COMPARISON
========================================================= */

function getComparison(
  exerciseName,
  currentSetsForExercise,
  selectedDate
){

  const previous =
    findPreviousRecord(
      exerciseName,
      selectedDate
    );


  if(!previous){
    return null;
  }


  const currentLoad =
    calculateExerciseLoad(
      currentSetsForExercise
    );


  const previousLoad =
    calculateExerciseLoad(
      previous.exercise.sets || []
    );


  const difference =
    currentLoad -
    previousLoad;


  const percent =
    previousLoad > 0
      ? difference /
        previousLoad *
        100
      : 0;


  const currentMax =
    Math.max(
      ...(currentSetsForExercise || [])
        .map(
          set =>
            Number(
              set.weight || 0
            )
        ),
      0
    );


  const previousMax =
    Math.max(
      ...(previous.exercise.sets || [])
        .map(
          set =>
            Number(
              set.weight || 0
            )
        ),
      0
    );


  const current1RM =
    getBestEstimated1RM(
      currentSetsForExercise
    );


  const previous1RM =
    getBestEstimated1RM(
      previous.exercise.sets || []
    );


  return {

    previous,

    currentLoad,

    previousLoad,

    difference,

    percent,

    currentMax,

    previousMax,

    current1RM,

    previous1RM,

    oneRMDifference:
      current1RM -
      previous1RM

  };

}


/* =========================================================
   PREVIOUS UI
========================================================= */

function updatePreviousRecord(){

  const exerciseName =
    document.getElementById(
      "exercise"
    ).value;


  const selectedDate =
    document.getElementById(
      "trainingDate"
    ).value;


  const area =
    document.getElementById(
      "previousRecord"
    );


  area.innerHTML = "";


  if(
    !exerciseName ||
    !selectedDate
  ){

    area.style.display =
      "none";

    return;

  }


  const previous =
    findPreviousRecord(
      exerciseName,
      selectedDate
    );


  area.style.display =
    "block";


  if(!previous){

    area.innerHTML = `

      <div class="previous-title">
        前回の記録
      </div>

      <div class="previous-date">
        ${exerciseName}
        の前回の記録はありません
      </div>

    `;

    return;

  }


  let setsHTML = "";


  (
    previous.exercise.sets ||
    []
  )
    .forEach(
      (set,index) => {

        setsHTML += `

          <div class="previous-set">
            セット ${index + 1}：
            ${set.weight} kg ×
            ${set.reps} 回
          </div>

          <div class="one-rm">
            推定1RM：約
            ${calculateEstimated1RM(
              set.weight,
              set.reps
            ).toFixed(1)}
            kg
          </div>

        `;

      }
    );


  const previousLoad =
    calculateExerciseLoad(
      previous.exercise.sets || []
    );


  area.innerHTML = `

    <div class="previous-title">
      前回の記録
    </div>

    <div class="previous-date">
      ${formatDate(
        previous.date
      )}
    </div>

    ${setsHTML}

    <div class="previous-total">
      前回総負荷：
      ${previousLoad.toLocaleString()}
      kg
    </div>

    <div class="one-rm-best">
      前回の推定1RM：
      ${getBestEstimated1RM(
        previous.exercise.sets || []
      ).toFixed(1)}
      kg
    </div>

  `;

}


/* =========================================================
   ADD SET
========================================================= */

function addSet(){

  const exercise =
    document.getElementById(
      "exercise"
    ).value;


  const weight =
    document.getElementById(
      "weight"
    ).value;


  const reps =
    document.getElementById(
      "reps"
    ).value;


  if(
    !exercise ||
    weight === "" ||
    reps === ""
  ){

    alert(
      "種目・重量・回数をすべて入力してください"
    );

    return;

  }


  if(
    currentSets.length > 0 &&
    currentSets[0].exercise !==
      exercise
  ){

    alert(
      "先に「この種目を完了」を押してください"
    );

    return;

  }


  const weightNumber =
    Number(weight);


  const repsNumber =
    Number(reps);


  if(
    !Number.isFinite(
      weightNumber
    ) ||
    !Number.isFinite(
      repsNumber
    ) ||
    weightNumber < 0 ||
    repsNumber <= 0
  ){

    alert(
      "重量と回数を正しく入力してください"
    );

    return;

  }


  currentSets.push({

    exercise:exercise,

    weight:weightNumber,

    reps:repsNumber

  });


  renderCurrentSets();

  updateTodayTotal();


  document.getElementById(
    "weight"
  ).value = "";


  document.getElementById(
    "reps"
  ).value = "";


  /*
    セット追加後は重量欄に戻る
  */

  document.getElementById(
    "weight"
  ).focus();

}


/* =========================================================
   DELETE CURRENT SET
========================================================= */

function deleteCurrentSet(index){

  if(
    index < 0 ||
    index >= currentSets.length
  ){

    return;

  }


  currentSets.splice(
    index,
    1
  );


  renderCurrentSets();

  updateTodayTotal();

}


/* =========================================================
   CURRENT SET UI
========================================================= */

function renderCurrentSets(){

  const area =
    document.getElementById(
      "currentSets"
    );


  area.innerHTML = "";


  if(
    currentSets.length === 0
  ){

    area.innerHTML = `

      <div class="empty-sets">
        まだセットがありません
      </div>

    `;

  }

  else{

    const title =
      document.createElement(
        "div"
      );


    title.className =
      "set-list-title";


    title.textContent =
      "入力中のセット";


    area.appendChild(
      title
    );


    currentSets.forEach(
      (set,index) => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "set-item";


        const number =
          document.createElement(
            "span"
          );


        number.className =
          "set-number";


        number.textContent =
          `セット ${index + 1}`;


        const value =
          document.createElement(
            "span"
          );


        value.className =
          "set-value";


        value.textContent =
          `${set.weight} kg × ${set.reps} 回`;


        const deleteButton =
          document.createElement(
            "button"
          );


        deleteButton.type =
          "button";


        deleteButton.className =
          "set-delete";


        deleteButton.textContent =
          "削除";


        deleteButton.addEventListener(
          "click",
          () =>
            deleteCurrentSet(
              index
            )
        );


        item.appendChild(
          number
        );

        item.appendChild(
          value
        );

        item.appendChild(
          deleteButton
        );


        area.appendChild(
          item
        );

      }
    );

  }


  document.getElementById(
    "exercise"
  ).disabled =
    currentSets.length > 0;

}


/* =========================================================
   TODAY DATA
========================================================= */

function getTodayExercises(){

  const date =
    document.getElementById(
      "trainingDate"
    ).value;


  const history =
    getHistory();


  const savedRecord =
    history.find(
      record =>
        record.date === date
    );


  const savedExercises =
    savedRecord
      ? savedRecord.exercises || []
      : [];


  return [

    ...savedExercises,

    ...currentExercises

  ];

}


/* =========================================================
   TODAY UI
========================================================= */

function renderTodayExercises(){

  const area =
    document.getElementById(
      "todayExercises"
    );


  const exercises =
    getTodayExercises();


  const selectedDate =
    document.getElementById(
      "trainingDate"
    ).value;


  document.getElementById(
    "todayDateLabel"
  ).textContent =
    selectedDate
      ? formatDate(
          selectedDate
        )
      : "";


  if(
    exercises.length === 0
  ){

    area.innerHTML = `

      <div class="today-empty">
        まだ完了した種目はありません
      </div>

    `;

    return;

  }


  let html = "";


  exercises.forEach(
    exercise => {

      const sets =
        exercise.sets || [];


      const load =
        calculateExerciseLoad(
          sets
        );


      const best1RM =
        getBestEstimated1RM(
          sets
        );


      const comparison =
        getComparison(
          exercise.exercise,
          sets,
          selectedDate
        );


      let setChips = "";


      sets.forEach(
        (set,index) => {

          setChips += `

            <div class="set-chip">

              <div class="set-chip-label">
                SET ${index + 1}
              </div>

              <div class="set-chip-value">
                ${set.weight} ×
                ${set.reps}
              </div>

            </div>

          `;

        }
      );


      let comparisonHTML = "";


      if(comparison){

        let changeClass =
          "comparison-same";


        if(
          comparison.difference > 0
        ){

          changeClass =
            "comparison-up";

        }

        else if(
          comparison.difference < 0
        ){

          changeClass =
            "comparison-down";

        }


        const differenceText =
          comparison.difference > 0
            ? `+${comparison.difference.toLocaleString()} kg`
            : comparison.difference < 0
              ? `${comparison.difference.toLocaleString()} kg`
              : "±0 kg";


        comparisonHTML = `

          <div class="comparison-box">

            <div class="comparison-title">
              前回との比較
            </div>

            <div class="comparison-line">
              ${comparison.previousLoad.toLocaleString()}
              kg
              →
              ${comparison.currentLoad.toLocaleString()}
              kg
            </div>

            <div class="comparison-line ${changeClass}">
              ${differenceText}
              ${
                comparison.previousLoad > 0
                  ? `（${
                      comparison.percent >= 0
                        ? "+"
                        : ""
                    }${comparison.percent.toFixed(1)}%）`
                  : ""
              }
            </div>

          </div>

        `;

      }


      html += `

        <div class="today-exercise">

          <div class="exercise-top">

            <div class="today-exercise-name">
              ${exercise.exercise}
            </div>

            <div class="today-exercise-summary">
              ${sets.length} SET
            </div>

          </div>


          <div class="set-strip">

            ${setChips}

          </div>


          <div class="exercise-stats">

            <div class="stat-box">

              <div class="stat-label">
                TOTAL LOAD
              </div>

              <div class="stat-value">
                ${load.toLocaleString()} kg
              </div>

            </div>


            <div class="stat-box">

              <div class="stat-label">
                EST. 1RM
              </div>

              <div class="stat-value green">
                ${best1RM.toFixed(1)} kg
              </div>

            </div>

          </div>


          ${comparisonHTML}

        </div>

      `;

    }
  );


  area.innerHTML =
    html;

}


/* =========================================================
   COMPLETE EXERCISE
========================================================= */

function completeExercise(){

  if(
    currentSets.length === 0
  ){

    alert(
      "まずセットを追加してください"
    );

    return;

  }


  const exercise =
    currentSets[0].exercise;


  const sets =
    currentSets.map(
      set => ({
        weight:set.weight,
        reps:set.reps
      })
    );


  currentExercises.push({

    exercise:exercise,

    sets:sets,

    totalLoad:
      calculateExerciseLoad(
        sets
      )

  });


  currentSets = [];


  renderCurrentSets();


  document.getElementById(
    "exercise"
  ).disabled = false;


  document.getElementById(
    "exercise"
  ).value = "";


  renderTodayExercises();

  updateTodayTotal();


  /*
    次の種目選択へ
  */

  document.getElementById(
    "exercise"
  ).focus();

}


/* =========================================================
   TODAY TOTAL
========================================================= */

function updateTodayTotal(){

  const exercises =
    getTodayExercises();


  let total = 0;


  exercises.forEach(
    exercise => {

      total +=
        calculateExerciseLoad(
          exercise.sets || []
        );

    }
  );


  if(
    currentSets.length > 0
  ){

    total +=
      calculateExerciseLoad(
        currentSets
      );

  }


  document.getElementById(
    "todayTotalLoad"
  ).textContent =
    total.toLocaleString();

}


/* =========================================================
   SAVE TODAY
========================================================= */

function saveTodayWorkout(){

  const date =
    document.getElementById(
      "trainingDate"
    ).value;


  if(!date){

    alert(
      "トレーニング日を選択してください"
    );

    return;

  }


  if(
    currentSets.length > 0
  ){

    completeExercise();

  }


  if(
    currentExercises.length === 0
  ){

    const history =
      getHistory();


    const savedRecord =
      history.find(
        record =>
          record.date === date
      );


    if(
      !savedRecord ||
      !savedRecord.exercises ||
      savedRecord.exercises.length === 0
    ){

      alert(
        "まずトレーニングを入力してください"
      );

      return;

    }


    renderTodayExercises();

    updateTodayTotal();

    renderHistory();

    return;

  }


  const history =
    getHistory();


  let dayRecord =
    history.find(
      record =>
        record.date === date
    );


  if(dayRecord){

    dayRecord.exercises.push(
      ...currentExercises
    );

  }

  else{

    dayRecord = {

      date:date,

      exercises:[
        ...currentExercises
      ]

    };


    history.unshift(
      dayRecord
    );

  }


  saveHistory(
    history
  );


  currentExercises = [];

  currentSets = [];


  renderCurrentSets();


  document.getElementById(
    "exercise"
  ).disabled = false;


  document.getElementById(
    "exercise"
  ).value = "";


  renderTodayExercises();

  updateTodayTotal();

  renderHistory();

  updatePreviousRecord();


  alert(
    "トレーニングを保存しました"
  );

}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){

  const area =
    document.getElementById(
      "history"
    );


  area.innerHTML = "";


  const history =
    getHistory();


  if(
    history.length === 0
  ){

    area.innerHTML = `

      <div class="empty">
        まだ記録がありません
      </div>

    `;

    return;

  }


  history
    .sort(
      (a,b) =>
        b.date.localeCompare(
          a.date
        )
    )
    .forEach(
      record => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "record";


        let exercisesHTML = "";

        let dayTotal = 0;


        (
          record.exercises || []
        )
          .forEach(
            exercise => {

              const sets =
                exercise.sets || [];


              const exerciseLoad =
                calculateExerciseLoad(
                  sets
                );


              const best1RM =
                getBestEstimated1RM(
                  sets
                );


              dayTotal +=
                exerciseLoad;


              let rows = "";


              sets.forEach(
                (set,index) => {

                  rows += `

                    <div class="history-set-row">

                      SET ${index + 1}
                      &nbsp;
                      ${set.weight} kg
                      ×
                      ${set.reps} 回

                    </div>

                  `;

                }
              );


              exercisesHTML += `

                <div class="history-exercise">

                  <div class="history-exercise-name">
                    ${exercise.exercise}
                  </div>

                  ${rows}


                  <div class="history-stats">

                    <div class="history-stat">

                      <div class="history-stat-label">
                        TOTAL LOAD
                      </div>

                      <div class="history-stat-value">
                        ${exerciseLoad.toLocaleString()}
                        kg
                      </div>

                    </div>


                    <div class="history-stat">

                      <div class="history-stat-label">
                        EST. 1RM
                      </div>

                      <div class="history-stat-value green">
                        ${best1RM.toFixed(1)}
                        kg
                      </div>

                    </div>

                  </div>

                </div>

              `;

            }
          );


        item.innerHTML = `

          <div class="history-date">

            <div class="date-title">
              ${formatDate(
                record.date
              )}
            </div>

            <div class="history-label">
              SESSION
            </div>

          </div>


          <div class="workout-title">
            TRAINING SESSION
          </div>


          ${exercisesHTML}


          <div class="day-total">

            <div class="day-total-label">
              DAY TOTAL LOAD
            </div>

            <div class="day-total-value">
              ${dayTotal.toLocaleString()}
              kg
            </div>

          </div>


          <button
            type="button"
            class="delete-button"
          >
            この記録を削除
          </button>

        `;


        const deleteButton =
          item.querySelector(
            ".delete-button"
          );


        deleteButton.addEventListener(
          "click",
          () =>
            deleteWorkout(
              record.date
            )
        );


        area.appendChild(
          item
        );

      }
    );

}


/* =========================================================
   DELETE HISTORY
========================================================= */

function deleteWorkout(date){

  const ok =
    confirm(
      `${formatDate(date)}のトレーニング記録を削除しますか？`
    );


  if(!ok){
    return;
  }


  let history =
    getHistory();


  history =
    history.filter(
      record =>
        record.date !== date
    );


  saveHistory(
    history
  );


  renderHistory();

  renderTodayExercises();

  updateTodayTotal();

  updatePreviousRecord();

}


/* =========================================================
   BOTTOM NAV
========================================================= */

const navButtons =
  document.querySelectorAll(
    ".nav-button"
  );


navButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      function(){

        const targetId =
          this.dataset.target;


        const target =
          document.getElementById(
            targetId
          );


        if(!target){
          return;
        }


        target.scrollIntoView({
          behavior:"smooth",
          block:"start"
        });


        navButtons.forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );


        this.classList.add(
          "active"
        );

      }
    );

  }
);


/* =========================================================
   NAV ACTIVE BY SCROLL
========================================================= */

const sections = [

  {
    id:"recordSection",
    nav:0
  },

  {
    id:"todaySection",
    nav:1
  },

  {
    id:"historySection",
    nav:2
  },

  {
    id:"analysisSection",
    nav:3
  }

];


window.addEventListener(
  "scroll",
  function(){

    let current =
      0;


    const scrollPosition =
      window.scrollY +
      window.innerHeight * .35;


    sections.forEach(
      (section,index) => {

        const element =
          document.getElementById(
            section.id
          );


        if(
          element &&
          scrollPosition >=
            element.offsetTop
        ){

          current =
            index;

        }

      }
    );


    navButtons.forEach(
      (button,index) => {

        button.classList.toggle(
          "active",
          index === current
        );

      }
    );

  }
);


/* =========================================================
   EVENTS
========================================================= */

document
  .getElementById(
    "addSetButton"
  )
  .addEventListener(
    "click",
    addSet
  );


document
  .getElementById(
    "completeExerciseButton"
  )
  .addEventListener(
    "click",
    completeExercise
  );


document
  .getElementById(
    "saveTodayButton"
  )
  .addEventListener(
    "click",
    saveTodayWorkout
  );


document
  .getElementById(
    "exercise"
  )
  .addEventListener(
    "change",
    function(){

      updatePreviousRecord();

      renderTodayExercises();

    }
  );


document
  .getElementById(
    "trainingDate"
  )
  .addEventListener(
    "change",
    function(){

      currentSets = [];

      currentExercises = [];


      renderCurrentSets();


      document.getElementById(
        "exercise"
      ).disabled = false;


      document.getElementById(
        "exercise"
      ).value = "";


      renderTodayExercises();

      updateTodayTotal();

      updatePreviousRecord();

    }
  );


/* =========================================================
   ENTER KEY
========================================================= */

document
  .getElementById(
    "reps"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        addSet();

      }

    }
  );


/* =========================================================
   INIT
========================================================= */

document.getElementById(
  "trainingDate"
).value =
  getToday();


renderHistory();

renderTodayExercises();

updateTodayTotal();

renderCurrentSets();

</script>

</body>
</html>
