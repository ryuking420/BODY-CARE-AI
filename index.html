<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BODY CARE AI</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:#f5f5f5;
  color:#222
}

.container{
  max-width:600px;
  margin:0 auto;
  padding:20px
}

h1{
  text-align:center;
  margin:10px 0 30px;
  font-size:28px
}

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.08)
}

label{
  display:block;
  font-weight:bold;
  margin:16px 0 8px
}

label:first-child{
  margin-top:0
}

select,
input{
  width:100%;
  padding:14px;
  font-size:18px;
  border:1px solid #ccc;
  border-radius:10px;
  background:#fff
}

button{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-size:18px;
  font-weight:bold
}

button:active{
  transform:scale(.98)
}

.complete-button{
  background:#666;
  margin-top:25px
}

.save-button{
  background:#111;
  margin-top:20px
}

.set-list{
  margin-top:20px
}

.set-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid #ddd;
  padding:14px 0;
  font-size:18px
}

.set-number{
  font-weight:bold
}


/* =========================
   前回記録
========================= */

.previous-card{
  background:#f0f0f0;
  border-radius:12px;
  padding:16px;
  margin-top:20px
}

.previous-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px
}

.previous-date{
  color:#666;
  font-size:15px;
  margin-bottom:10px
}

.previous-set{
  font-size:17px;
  line-height:1.8
}

.previous-total{
  font-weight:bold;
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid #ccc
}


/* =========================
   推定1RM
========================= */

.one-rm{
  font-size:15px;
  color:#444;
  line-height:1.7
}

.one-rm-best{
  font-weight:bold;
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid #eee
}

.rm-box{
  background:#f7f7f7;
  border-radius:10px;
  padding:10px;
  margin-top:10px
}

.rm-best{
  font-weight:bold;
  margin-top:5px
}


/* =========================
   前回比較
========================= */

.comparison-box{
  background:#f3f3f3;
  border-radius:12px;
  padding:13px;
  margin-top:12px
}

.comparison-title{
  font-weight:bold;
  margin-bottom:6px
}

.comparison-line{
  font-size:15px;
  line-height:1.7
}

.comparison-up{
  font-weight:bold
}

.comparison-down{
  font-weight:bold
}

.comparison-same{
  font-weight:bold
}


/* =========================
   今日のトレーニング
========================= */

.today-card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-top:20px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  border:2px solid #111
}

.today-title{
  font-size:24px;
  font-weight:bold;
  margin-bottom:18px
}

.today-empty{
  color:#888;
  font-size:16px
}

.today-exercise{
  border-top:1px solid #ddd;
  padding:18px 0
}

.today-exercise:first-child{
  border-top:none;
  padding-top:0
}

.today-exercise-name{
  font-size:22px;
  font-weight:bold;
  margin-bottom:8px
}

.today-exercise-summary{
  font-size:16px;
  font-weight:bold;
  color:#555;
  margin-bottom:8px
}

.today-set{
  font-size:16px;
  color:#555;
  line-height:1.8
}

.today-exercise-total{
  font-size:17px;
  font-weight:bold;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #eee
}


/* =========================
   総負荷
========================= */

.total-card{
  background:#111;
  color:#fff;
  border-radius:16px;
  padding:22px;
  margin-bottom:20px;
  text-align:center
}

.total-label{
  font-size:16px;
  color:#ccc
}

.total-number{
  font-size:36px;
  font-weight:bold;
  margin-top:5px
}

.total-unit{
  font-size:18px;
  font-weight:normal
}


/* =========================
   履歴
========================= */

.record{
  border-top:1px solid #ddd;
  padding:20px 0
}

.record:first-child{
  border-top:none
}

.date-title{
  font-size:24px;
  font-weight:bold;
  margin-bottom:20px
}

.workout-title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:20px
}

.exercise{
  font-size:21px;
  font-weight:bold;
  margin-top:20px;
  margin-bottom:8px
}

.details{
  color:#555;
  font-size:17px;
  line-height:1.8
}

.exercise-total{
  font-weight:bold;
  margin-top:5px;
  color:#222
}

.day-total{
  font-size:20px;
  font-weight:bold;
  margin-top:20px;
  padding-top:15px;
  border-top:1px solid #ddd
}

.delete-button{
  background:#d62828;
  margin-top:20px
}

.empty{
  text-align:center;
  color:#888;
  padding:20px 0
}
</style>
</head>

<body>

<div class="container">

<h1>BODY CARE AI</h1>


<!-- =========================
     トレーニング入力
========================= -->

<div class="card">

<label for="trainingDate">
  トレーニング日
</label>

<input
  type="date"
  id="trainingDate"
>


<label for="exercise">
  種目
</label>

<select id="exercise">

<option value="">
  種目を選択してください
</option>

<option value="ベンチプレス">
  ベンチプレス
</option>

<option value="スクワット">
  スクワット
</option>

<option value="デッドリフト">
  デッドリフト
</option>

<option value="RDL">
  RDL
</option>

<option value="ラットプルダウン">
  ラットプルダウン
</option>

<option value="懸垂">
  懸垂
</option>

<option value="レッグプレス">
  レッグプレス
</option>

<option value="ショルダープレス">
  ショルダープレス
</option>

<option value="サイドレイズ">
  サイドレイズ
</option>

<option value="ペックフライ">
  ペックフライ
</option>

<option value="フェイスプル">
  フェイスプル
</option>

</select>


<div
  id="previousRecord"
  class="previous-card"
  style="display:none">
</div>


<label for="weight">
  重量（kg）
</label>

<input
  type="number"
  id="weight"
  placeholder="例：70"
  inputmode="decimal"
  step="0.5"
>


<label for="reps">
  回数
</label>

<input
  type="number"
  id="reps"
  placeholder="例：8"
  inputmode="numeric"
>


<button
  type="button"
  onclick="addSet()">

  セットを追加

</button>


<div
  class="set-list"
  id="currentSets">
</div>


<button
  type="button"
  class="complete-button"
  onclick="completeExercise()">

  この種目を完了

</button>

</div>


<!-- =========================
     今日のトレーニング
========================= -->

<div class="today-card">

<div
  class="today-title"
  id="todayTitle">

  今日のトレーニング

</div>


<div id="todayExercises">

  <div class="today-empty">

    まだ完了した種目はありません

  </div>

</div>


<button
  type="button"
  class="save-button"
  onclick="saveTodayWorkout()">

  この日のトレーニングを保存

</button>

</div>


<!-- =========================
     今日の総負荷
========================= -->

<div class="total-card">

<div class="total-label">
  今日の総負荷
</div>

<div class="total-number">

<span id="todayTotalLoad">
  0
</span>

<span class="total-unit">
  kg
</span>

</div>

</div>


<!-- =========================
     過去の履歴
========================= -->

<div class="card">

<h2>
  過去のトレーニング履歴
</h2>

<div id="history">

<div class="empty">
  まだ記録がありません
</div>

</div>

</div>

</div>


<script>

let currentSets = [];

let currentExercises = [];


/* =========================
   今日の日付
========================= */

function getToday(){

  const now = new Date();

  return `${now.getFullYear()}-${String(
    now.getMonth()+1
  ).padStart(2,"0")}-${String(
    now.getDate()
  ).padStart(2,"0")}`;

}


/* =========================
   日付表示
========================= */

function formatDate(dateString){

  const parts =
    dateString.split("-");

  if(parts.length !== 3){
    return dateString;
  }

  return `${parts[0]}年${Number(parts[1])}月${Number(parts[2])}日`;

}


/* =========================
   履歴取得
========================= */

function getHistory(){

  const saved =
    localStorage.getItem(
      "trainingHistory"
    );

  if(!saved){
    return [];
  }

  try{

    const data =
      JSON.parse(saved);

    return Array.isArray(data)
      ? data
      : [];

  }catch(error){

    return [];

  }

}


/* =========================
   履歴保存
========================= */

function saveHistory(history){

  localStorage.setItem(
    "trainingHistory",
    JSON.stringify(history)
  );

}


/* =========================
   総負荷
========================= */

function calculateExerciseLoad(sets){

  return (sets || []).reduce(
    (total,set)=>{

      return total +
        Number(set.weight || 0) *
        Number(set.reps || 0);

    },
    0
  );

}


/* =========================
   推定1RM
   Epley式
========================= */

function calculateEstimated1RM(
  weight,
  reps
){

  weight =
    Number(weight || 0);

  reps =
    Number(reps || 0);

  if(
    weight <= 0 ||
    reps <= 0
  ){

    return 0;

  }

  return weight *
    (1 + reps / 30);

}


/* =========================
   種目内の最高推定1RM
========================= */

function getBestEstimated1RM(
  sets
){

  return Math.max(
    ...(sets || []).map(
      set =>
        calculateEstimated1RM(
          set.weight,
          set.reps
        )
    ),
    0
  );

}


/* =========================
   前回記録検索
========================= */

function findPreviousRecord(
  exerciseName,
  selectedDate
){

  const history =
    getHistory();


  const previousDays =
    history
      .filter(
        record =>
          record.date < selectedDate
      )
      .sort(
        (a,b)=>
          b.date.localeCompare(
            a.date
          )
      );


  for(
    const day of previousDays
  ){

    const exercise =
      (day.exercises || []).find(
        item =>
          item.exercise ===
          exerciseName
      );


    if(exercise){

      return {
        date: day.date,
        exercise: exercise
      };

    }

  }


  return null;

}


/* =========================
   前回比較
========================= */

function getComparison(
  exerciseName,
  currentSetsForExercise,
  selectedDate
){

  const previous =
    findPreviousRecord(
      exerciseName,
      selectedDate
    );


  if(!previous){

    return null;

  }


  const currentLoad =
    calculateExerciseLoad(
      currentSetsForExercise
    );


  const previousLoad =
    calculateExerciseLoad(
      previous.exercise.sets || []
    );


  const difference =
    currentLoad -
    previousLoad;


  const percent =
    previousLoad > 0
      ? (difference / previousLoad) * 100
      : 0;


  const currentMax =
    Math.max(
      ...(currentSetsForExercise || [])
        .map(
          set =>
            Number(set.weight || 0)
        ),
      0
    );


  const previousMax =
    Math.max(
      ...(previous.exercise.sets || [])
        .map(
          set =>
            Number(set.weight || 0)
        ),
      0
    );


  const maxDifference =
    currentMax -
    previousMax;


  const current1RM =
    getBestEstimated1RM(
      currentSetsForExercise
    );


  const previous1RM =
    getBestEstimated1RM(
      previous.exercise.sets || []
    );


  const oneRMDifference =
    current1RM -
    previous1RM;


  return {

    previous,

    currentLoad,

    previousLoad,

    difference,

    percent,

    currentMax,

    previousMax,

    maxDifference,

    current1RM,

    previous1RM,

    oneRMDifference

  };

}


/* =========================
   前回比較表示
========================= */

function comparisonText(
  comparison
){

  if(!comparison){

    return "";

  }


  let resultClass =
    "comparison-same";


  let resultText =
    "前回と同じ総負荷";


  if(
    comparison.difference > 0
  ){

    resultClass =
      "comparison-up";


    resultText =
      `前回比：+${comparison.difference.toLocaleString()} kg（+${comparison.percent.toFixed(1)}%）`;

  }


  else if(
    comparison.difference < 0
  ){

    resultClass =
      "comparison-down";


    resultText =
      `前回比：${comparison.difference.toLocaleString()} kg（${comparison.percent.toFixed(1)}%）`;

  }


  return `

    <div class="comparison-box">

      <div class="comparison-title">
        前回との比較
      </div>

      <div class="comparison-line">

        前回：
        ${formatDate(
          comparison.previous.date
        )}

      </div>

      <div class="comparison-line">

        前回総負荷：
        ${comparison.previousLoad.toLocaleString()}
        kg

      </div>

      <div class="comparison-line">

        今回総負荷：
        ${comparison.currentLoad.toLocaleString()}
        kg

      </div>

      <div class="comparison-line ${resultClass}">

        ${resultText}

      </div>

      <div class="comparison-line">

        最大重量：
        前回 ${comparison.previousMax} kg
        →
        今回 ${comparison.currentMax} kg

        （${comparison.maxDifference >= 0 ? "+" : ""}
        ${comparison.maxDifference} kg）

      </div>

      <div class="comparison-line">

        推定1RM：
        前回 ${comparison.previous1RM.toFixed(1)} kg
        →
        今回 ${comparison.current1RM.toFixed(1)} kg

        （${comparison.oneRMDifference >= 0 ? "+" : ""}
        ${comparison.oneRMDifference.toFixed(1)} kg）

      </div>

    </div>

  `;

}


/* =========================
   前回記録表示
========================= */

function updatePreviousRecord(){

  const exerciseName =
    document.getElementById(
      "exercise"
    ).value;


  const selectedDate =
    document.getElementById(
      "trainingDate"
    ).value;


  const area =
    document.getElementById(
      "previousRecord"
    );


  area.innerHTML = "";


  if(
    !exerciseName ||
    !selectedDate
  ){

    area.style.display =
      "none";

    return;

  }


  const previous =
    findPreviousRecord(
      exerciseName,
      selectedDate
    );


  area.style.display =
    "block";


  if(!previous){

    area.innerHTML = `

      <div class="previous-title">
        前回の記録
      </div>

      <div class="previous-date">

        ${exerciseName}の
        前回の記録はありません

      </div>

    `;

    return;

  }


  let setsHTML = "";


  (
    previous.exercise.sets || []
  ).forEach(
    (set,index)=>{

      const estimated1RM =
        calculateEstimated1RM(
          set.weight,
          set.reps
        );


      setsHTML += `

        <div class="previous-set">

          セット ${index + 1}：
          ${set.weight} kg ×
          ${set.reps} 回

        </div>

        <div class="one-rm">

          推定1RM：
          ${estimated1RM.toFixed(1)}
          kg

        </div>

      `;

    }
  );


  const previousLoad =
    calculateExerciseLoad(
      previous.exercise.sets || []
    );


  const previousBest1RM =
    getBestEstimated1RM(
      previous.exercise.sets || []
    );


  area.innerHTML = `

    <div class="previous-title">

      前回の記録

    </div>

    <div class="previous-date">

      ${formatDate(
        previous.date
      )}

    </div>

    ${setsHTML}

    <div class="previous-total">

      前回総負荷：
      ${previousLoad.toLocaleString()}
      kg

    </div>

    <div class="one-rm-best">

      前回の推定1RM：
      ${previousBest1RM.toFixed(1)}
      kg

    </div>

  `;

}


/* =========================
   セット追加
========================= */

function addSet(){

  const exercise =
    document.getElementById(
      "exercise"
    ).value;


  const weight =
    document.getElementById(
      "weight"
    ).value;


  const reps =
    document.getElementById(
      "reps"
    ).value;


  if(
    !exercise ||
    weight === "" ||
    reps === ""
  ){

    alert(
      "種目・重量・回数をすべて入力してください"
    );

    return;

  }


  if(
    currentSets.length > 0 &&
    currentSets[0].exercise !== exercise
  ){

    alert(
      "先に「この種目を完了」を押してください"
    );

    return;

  }


  const weightNumber =
    Number(weight);


  const repsNumber =
    Number(reps);


  if(
    !Number.isFinite(
      weightNumber
    ) ||
    !Number.isFinite(
      repsNumber
    ) ||
    weightNumber < 0 ||
    repsNumber <= 0
  ){

    alert(
      "重量と回数を正しく入力してください"
    );

    return;

  }


  currentSets.push({

    exercise: exercise,

    weight: weightNumber,

    reps: repsNumber

  });


  renderCurrentSets();

  updateTodayTotal();


  document.getElementById(
    "weight"
  ).value = "";


  document.getElementById(
    "reps"
  ).value = "";

}


/* =========================
   入力中セット表示
========================= */

function renderCurrentSets(){

  const area =
    document.getElementById(
      "currentSets"
    );


  area.innerHTML = "";


  currentSets.forEach(
    (set,index)=>{

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "set-item";


      item.innerHTML = `

        <span class="set-number">

          セット ${index + 1}

        </span>

        <span>

          ${set.weight} kg ×
          ${set.reps} 回

        </span>

      `;


      area.appendChild(item);

    }
  );


  document.getElementById(
    "exercise"
  ).disabled =
    currentSets.length > 0;

}


/* =========================
   当日の種目取得
========================= */

function getTodayExercises(){

  const date =
    document.getElementById(
      "trainingDate"
    ).value;


  const history =
    getHistory();


  const savedRecord =
    history.find(
      record =>
        record.date === date
    );


  const savedExercises =
    savedRecord
      ? (savedRecord.exercises || [])
      : [];


  return [

    ...savedExercises,

    ...currentExercises

  ];

}


/* =========================
   当日のトレーニング表示
========================= */

function renderTodayExercises(){

  const area =
    document.getElementById(
      "todayExercises"
    );


  const exercises =
    getTodayExercises();


  const selectedDate =
    document.getElementById(
      "trainingDate"
    ).value;


  const isToday =
    selectedDate === getToday();


  document.getElementById(
    "todayTitle"
  ).textContent =
    isToday
      ? "今日のトレーニング"
      : `${formatDate(selectedDate)}のトレーニング`;


  if(
    exercises.length === 0
  ){

    area.innerHTML = `

      <div class="today-empty">

        まだ完了した種目はありません

      </div>

    `;

    return;

  }


  let html = "";


  exercises.forEach(
    exercise=>{

      const sets =
        exercise.sets || [];


      const load =
        calculateExerciseLoad(
          sets
        );


      const comparison =
        getComparison(
          exercise.exercise,
          sets,
          selectedDate
        );


      html += `

        <div class="today-exercise">

          <div class="today-exercise-name">

            ${exercise.exercise}

          </div>

          <div class="today-exercise-summary">

            ${sets.length}セット

          </div>

      `;


      sets.forEach(
        (set,index)=>{

          const estimated1RM =
            calculateEstimated1RM(
              set.weight,
              set.reps
            );


          html += `

            <div class="today-set">

              セット ${index + 1}：
              ${set.weight} kg ×
              ${set.reps} 回

            </div>

            <div class="one-rm">

              推定1RM：
              ${estimated1RM.toFixed(1)}
              kg

            </div>

          `;

        }
      );


      const best1RM =
        getBestEstimated1RM(
          sets
        );


      html += `

          <div class="today-exercise-total">

            種目総負荷：
            ${load.toLocaleString()}
            kg

          </div>

          <div class="one-rm-best">

            今回の推定1RM：
            ${best1RM.toFixed(1)}
            kg

          </div>

          ${comparisonText(
            comparison
          )}

        </div>

      `;

    }
  );


  area.innerHTML =
    html;

}


/* =========================
   種目完了
========================= */

function completeExercise(){

  if(
    currentSets.length === 0
  ){

    alert(
      "まずセットを追加してください"
    );

    return;

  }


  const exercise =
    currentSets[0].exercise;


  const sets =
    currentSets.map(
      set=>({

        weight:
          set.weight,

        reps:
          set.reps

      })
    );


  currentExercises.push({

    exercise:
      exercise,

    sets:
      sets,

    totalLoad:
      calculateExerciseLoad(
        sets
      )

  });


  currentSets = [];


  renderCurrentSets();


  document.getElementById(
    "exercise"
  ).disabled = false;


  document.getElementById(
    "exercise"
  ).value = "";


  renderTodayExercises();

  updateTodayTotal();

}


/* =========================
   今日の総負荷
========================= */

function updateTodayTotal(){

  const exercises =
    getTodayExercises();


  let total = 0;


  exercises.forEach(
    exercise=>{

      total +=
        calculateExerciseLoad(
          exercise.sets || []
        );

    }
  );


  if(
    currentSets.length > 0
  ){

    total +=
      calculateExerciseLoad(
        currentSets
      );

  }


  document.getElementById(
    "todayTotalLoad"
  ).textContent =
    total.toLocaleString();

}


/* =========================
   保存
========================= */

function saveTodayWorkout(){

  const date =
    document.getElementById(
      "trainingDate"
    ).value;


  if(!date){

    alert(
      "トレーニング日を選択してください"
    );

    return;

  }


  if(
    currentSets.length > 0
  ){

    completeExercise();

  }


  if(
    currentExercises.length === 0
  ){

    const history =
      getHistory();


    const savedRecord =
      history.find(
        record =>
          record.date === date
      );


    if(
      !savedRecord ||
      !savedRecord.exercises ||
      savedRecord.exercises.length === 0
    ){

      alert(
        "まずトレーニングを入力してください"
      );

      return;

    }


    renderTodayExercises();

    updateTodayTotal();

    renderHistory();

    return;

  }


  const history =
    getHistory();


  let dayRecord =
    history.find(
      record =>
        record.date === date
    );


  if(dayRecord){

    dayRecord.exercises.push(
      ...currentExercises
    );

  }

  else{

    dayRecord = {

      date:
        date,

      exercises:
        [
          ...currentExercises
        ]

    };


    history.unshift(
      dayRecord
    );

  }


  saveHistory(
    history
  );


  currentExercises = [];

  currentSets = [];


  renderCurrentSets();


  document.getElementById(
    "exercise"
  ).disabled = false;


  document.getElementById(
    "exercise"
  ).value = "";


  renderTodayExercises();

  updateTodayTotal();

  renderHistory();

  updatePreviousRecord();


  alert(
    "トレーニングを保存しました"
  );

}


/* =========================
   履歴表示
========================= */

function renderHistory(){

  const area =
    document.getElementById(
      "history"
    );


  area.innerHTML = "";


  const history =
    getHistory();


  if(
    history.length === 0
  ){

    area.innerHTML = `

      <div class="empty">

        まだ記録がありません

      </div>

    `;

    return;

  }


  history
    .sort(
      (a,b)=>
        b.date.localeCompare(
          a.date
        )
    )
    .forEach(
      record=>{

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "record";


        let exercisesHTML =
          "";


        let dayTotal =
          0;


        (
          record.exercises || []
        ).forEach(
          exercise=>{

            const exerciseLoad =
              calculateExerciseLoad(
                exercise.sets || []
              );


            dayTotal +=
              exerciseLoad;


            let setsHTML =
              "";


            (
              exercise.sets || []
            ).forEach(
              (set,index)=>{

                const estimated1RM =
                  calculateEstimated1RM(
                    set.weight,
                    set.reps
                  );


                setsHTML += `

                  セット ${index + 1}：
                  ${set.weight} kg ×
                  ${set.reps} 回

                  <br>

                  <span class="one-rm">

                    推定1RM：
                    ${estimated1RM.toFixed(1)}
                    kg

                  </span>

                  <br>

                `;

              }
            );


            const best1RM =
              getBestEstimated1RM(
                exercise.sets || []
              );


            exercisesHTML += `

              <div class="exercise">

                ${exercise.exercise}

              </div>

              <div class="details">

                ${setsHTML}

                <div class="exercise-total">

                  種目総負荷：
                  ${exerciseLoad.toLocaleString()}
                  kg

                </div>

                <div class="one-rm-best">

                  推定1RM：
                  ${best1RM.toFixed(1)}
                  kg

                </div>

              </div>

            `;

          }
        );


        item.innerHTML = `

          <div class="date-title">

            ${formatDate(
              record.date
            )}

          </div>

          <div class="workout-title">

            トレーニング

          </div>

          ${exercisesHTML}

          <div class="day-total">

            1日の総負荷：
            ${dayTotal.toLocaleString()}
            kg

          </div>

          <button
            class="delete-button"
            onclick="deleteWorkout('${record.date}')">

            この記録を削除

          </button>

        `;


        area.appendChild(
          item
        );

      }
    );

}


/* =========================
   1日削除
========================= */

function deleteWorkout(date){

  const ok =
    confirm(
      `${formatDate(date)}のトレーニング記録を削除しますか？`
    );


  if(!ok){

    return;

  }


  let history =
    getHistory();


  history =
    history.filter(
      record =>
        record.date !== date
    );


  saveHistory(
    history
  );


  renderHistory();

  renderTodayExercises();

  updateTodayTotal();

  updatePreviousRecord();

}

document
  .getElementById(

  )

/* =========================

========================= */

document.getElementById(

renderHistory();

renderTodayExercises();

updateTodayTotal();
