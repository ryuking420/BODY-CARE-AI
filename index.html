<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BODY CARE AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 30px;
      font-size: 32px;
    }

    h2 {
      font-size: 28px;
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 8px;
      margin-top: 18px;
    }

    label:first-child {
      margin-top: 0;
    }

    select,
    input {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #999;
    }

    .complete-button {
      background: #666;
      margin-top: 25px;
    }

    .save-button {
      background: #111;
      margin-top: 15px;
    }

    .date-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .set-list {
      margin-top: 20px;
    }

    .set-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #ddd;
      padding: 14px 0;
      font-size: 18px;
    }

    .set-number {
      font-weight: bold;
    }

    .previous-record {
      background: #f1f1f1;
      border-radius: 14px;
      padding: 18px;
      margin-top: 18px;
    }

    .previous-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .previous-date {
      color: #777;
      font-size: 17px;
      margin-bottom: 12px;
    }

    .previous-set {
      font-size: 17px;
      margin: 7px 0;
    }

    .previous-total {
      border-top: 1px solid #ccc;
      margin-top: 14px;
      padding-top: 14px;
      font-size: 18px;
      font-weight: bold;
    }

    .comparison {
      background: #f1f1f1;
      border-radius: 14px;
      padding: 18px;
      margin-top: 18px;
    }

    .comparison-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .comparison-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 17px;
    }

    .comparison-difference {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
    }

    .current-total {
      font-size: 19px;
      font-weight: bold;
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #ccc;
    }

    .record {
      border-top: 1px solid #ddd;
      padding: 20px 0;
    }

    .record:first-child {
      border-top: none;
    }

    .record-date {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .record-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .record-exercise {
      font-size: 22px;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    .details {
      color: #555;
      font-size: 17px;
      line-height: 1.7;
    }

    .exercise-total {
      font-weight: bold;
      margin-top: 8px;
    }

    .day-total {
      font-size: 20px;
      font-weight: bold;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #ddd;
    }

    .delete-button {
      background: #d62828;
      margin-top: 18px;
    }

    .total-card {
      background: #111;
      color: white;
      text-align: center;
      border-radius: 16px;
      padding: 25px 20px;
      margin-bottom: 20px;
    }

    .total-label {
      font-size: 18px;
      opacity: 0.8;
    }

    .total-number {
      font-size: 42px;
      font-weight: bold;
      margin-top: 5px;
    }

    .total-unit {
      font-size: 20px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 25px 0;
    }

    .small-note {
      color: #777;
      font-size: 14px;
      margin-top: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>BODY CARE AI</h1>


  <!-- =========================
       入力
  ========================== -->

  <div class="card">

    <div class="date-title">
      トレーニング日
    </div>

    <input
      type="date"
      id="trainingDate"
    >


    <label for="exercise">
      種目
    </label>

    <select id="exercise">
      <option value="">
        種目を選択してください
      </option>

      <option value="ベンチプレス">
        ベンチプレス
      </option>

      <option value="スクワット">
        スクワット
      </option>

      <option value="デッドリフト">
        デッドリフト
      </option>

      <option value="RDL">
        RDL
      </option>

      <option value="ラットプルダウン">
        ラットプルダウン
      </option>

      <option value="懸垂">
        懸垂
      </option>

      <option value="レッグプレス">
        レッグプレス
      </option>

      <option value="ショルダープレス">
        ショルダープレス
      </option>

      <option value="サイドレイズ">
        サイドレイズ
      </option>

      <option value="ペックフライ">
        ペックフライ
      </option>

      <option value="フェイスプル">
        フェイスプル
      </option>
    </select>


    <!-- 前回記録 -->

    <div
      id="previousRecord"
      style="display:none;"
    ></div>


    <label for="weight">
      重量（kg）
    </label>

    <input
      type="number"
      id="weight"
      placeholder="例：70"
      inputmode="decimal"
      step="0.5"
    >


    <label for="reps">
      回数
    </label>

    <input
      type="number"
      id="reps"
      placeholder="例：8"
      inputmode="numeric"
    >


    <button
      type="button"
      onclick="addSet()"
    >
      セットを追加
    </button>


    <!-- 現在のセット -->

    <div
      class="set-list"
      id="currentSets"
    ></div>


    <!-- 今回比較 -->

    <div
      id="comparison"
      style="display:none;"
    ></div>


    <button
      type="button"
      class="complete-button"
      id="completeButton"
      onclick="completeExercise()"
      disabled
    >
      この種目を完了
    </button>


    <button
      type="button"
      class="save-button"
      onclick="saveTodayWorkout()"
    >
      今日のトレーニングを保存
    </button>


    <div class="small-note">
      ①セットを追加<br>
      ②種目を完了<br>
      ③次の種目を選択<br>
      ④最後に「今日のトレーニングを保存」
    </div>

  </div>


  <!-- =========================
       今日の総負荷
  ========================== -->

  <div class="total-card">

    <div class="total-label">
      今日の総負荷
    </div>

    <div class="total-number">
      <span id="todayTotalLoad">0</span>
      <span class="total-unit">kg</span>
    </div>

  </div>


  <!-- =========================
       履歴
  ========================== -->

  <div class="card">

    <h2>
      トレーニング履歴
    </h2>

    <div id="history">

      <div class="empty">
        まだ記録がありません
      </div>

    </div>

  </div>

</div>


<script>

  /* =========================
     データ
  ========================== */

  let currentSets = [];

  let todayExercises = [];

  const STORAGE_KEY = "bodyCareDailyWorkouts";


  /* =========================
     初期化
  ========================== */

  function getToday() {

    const date = new Date();

    const y =
      date.getFullYear();

    const m =
      String(date.getMonth() + 1)
        .padStart(2, "0");

    const d =
      String(date.getDate())
        .padStart(2, "0");

    return `${y}-${m}-${d}`;
  }


  document.getElementById("trainingDate").value =
    getToday();


  /* =========================
     保存データ取得
  ========================== */

  function getWorkouts() {

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if (!saved) {
      return [];
    }

    try {

      return JSON.parse(saved);

    } catch (error) {

      return [];

    }
  }


  /* =========================
     保存データ書き込み
  ========================== */

  function saveWorkouts(workouts) {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(workouts)
    );

  }


  /* =========================
     日付変更
  ========================== */

  document
    .getElementById("trainingDate")
    .addEventListener(
      "change",
      function() {

        currentSets = [];

        todayExercises = [];

        renderCurrentSets();

        updateTodayTotal();

        updatePreviousRecord();

        updateComparison();

      }
    );


  /* =========================
     種目変更
  ========================== */

  document
    .getElementById("exercise")
    .addEventListener(
      "change",
      function() {

        currentSets = [];

        renderCurrentSets();

        updatePreviousRecord();

        updateComparison();

      }
    );


  /* =========================
     セット追加
  ========================== */

  function addSet() {

    const exercise =
      document
        .getElementById("exercise")
        .value;

    const weight =
      document
        .getElementById("weight")
        .value;

    const reps =
      document
        .getElementById("reps")
        .value;


    if (!exercise || !weight || !reps) {

      alert(
        "種目・重量・回数をすべて入力してください"
      );

      return;
    }


    currentSets.push({

      weight:
        Number(weight),

      reps:
        Number(reps)

    });


    renderCurrentSets();

    updateComparison();


    document
      .getElementById("weight")
      .value = "";

    document
      .getElementById("reps")
      .value = "";

  }


  /* =========================
     現在のセット表示
  ========================== */

  function renderCurrentSets() {

    const area =
      document.getElementById(
        "currentSets"
      );

    area.innerHTML = "";


    currentSets.forEach(
      function(set, index) {

        const item =
          document.createElement("div");

        item.className =
          "set-item";


        item.innerHTML = `

          <span class="set-number">
            セット ${index + 1}
          </span>

          <span>
            ${set.weight} kg ×
            ${set.reps} 回
          </span>

        `;


        area.appendChild(item);

      }
    );


    const completeButton =
      document.getElementById(
        "completeButton"
      );


    completeButton.disabled =
      currentSets.length === 0;

  }


  /* =========================
     総負荷計算
  ========================== */

  function calculateLoad(sets) {

    return sets.reduce(
      function(total, set) {

        return total +
          Number(set.weight) *
          Number(set.reps);

      },
      0
    );

  }


  /* =========================
     前回記録を探す
  ========================== */

  function findPreviousExerciseRecord(
    exercise,
    date
  ) {

    const workouts =
      getWorkouts();


    const candidates =
      workouts.filter(
        function(workout) {

          return (
            workout.date < date &&
            workout.exercises &&
            workout.exercises.some(
              function(ex) {

                return ex.exercise === exercise;

              }
            )
          );

        }
      );


    candidates.sort(
      function(a, b) {

        return b.date.localeCompare(
          a.date
        );

      }
    );


    if (
      candidates.length === 0
    ) {

      return null;

    }


    const workout =
      candidates[0];


    const exerciseRecord =
      workout.exercises.find(
        function(ex) {

          return ex.exercise === exercise;

        }
      );


    return {

      date:
        workout.date,

      exercise:
        exerciseRecord

    };

  }


  /* =========================
     前回記録表示
  ========================== */

  function updatePreviousRecord() {

    const area =
      document.getElementById(
        "previousRecord"
      );


    const exercise =
      document
        .getElementById("exercise")
        .value;


    const date =
      document
        .getElementById("trainingDate")
        .value;


    if (!exercise || !date) {

      area.style.display =
        "none";

      area.innerHTML = "";

      return;

    }


    const previous =
      findPreviousExerciseRecord(
        exercise,
        date
      );


    if (!previous) {

      area.style.display =
        "none";

      area.innerHTML = "";

      return;

    }


    let html = `

      <div class="previous-record">

        <div class="previous-title">
          前回の記録
        </div>

        <div class="previous-date">
          ${formatDate(previous.date)}
        </div>

    `;


    previous.exercise.sets.forEach(
      function(set, index) {

        html += `

          <div class="previous-set">
            セット ${index + 1}：
            ${set.weight} kg ×
            ${set.reps} 回
          </div>

        `;

      }
    );


    const previousLoad =
      calculateLoad(
        previous.exercise.sets
      );


    html += `

        <div class="previous-total">
          前回総負荷：
          ${formatNumber(previousLoad)} kg
        </div>

      </div>

    `;


    area.innerHTML =
      html;

    area.style.display =
      "block";

  }


  /* =========================
     前回比較
  ========================== */

  function updateComparison() {

    const area =
      document.getElementById(
        "comparison"
      );


    const exercise =
      document
        .getElementById("exercise")
        .value;


    const date =
      document
        .getElementById("trainingDate")
        .value;


    if (
      !exercise ||
      !date ||
      currentSets.length === 0
    ) {

      area.style.display =
        "none";

      area.innerHTML = "";

      return;

    }


    const previous =
      findPreviousExerciseRecord(
        exercise,
        date
      );


    if (!previous) {

      area.style.display =
        "none";

      area.innerHTML = "";

      return;

    }


    const previousLoad =
      calculateLoad(
        previous.exercise.sets
      );


    const currentLoad =
      calculateLoad(
        currentSets
      );


    const difference =
      currentLoad -
      previousLoad;


    const sign =
      difference > 0
        ? "+"
        : "";


    let html = `

      <div class="comparison">

        <div class="comparison-title">
          前回との比較
        </div>

        <div class="comparison-row">
          <span>前回総負荷</span>
          <strong>
            ${formatNumber(previousLoad)} kg
          </strong>
        </div>

        <div class="comparison-row">
          <span>今回総負荷</span>
          <strong>
            ${formatNumber(currentLoad)} kg
          </strong>
        </div>

        <div class="comparison-difference">
          前回比：
          ${sign}${formatNumber(difference)} kg
        </div>

      </div>

    `;


    area.innerHTML =
      html;

    area.style.display =
      "block";

  }


  /* =========================
     種目を完了
  ========================== */

  function completeExercise() {

    const exercise =
      document
        .getElementById("exercise")
        .value;


    if (
      !exercise ||
      currentSets.length === 0
    ) {

      alert(
        "セットを追加してください"
      );

      return;

    }


    const exerciseLoad =
      calculateLoad(
        currentSets
      );


    todayExercises.push({

      exercise:
        exercise,

      sets:
        [...currentSets],

      totalLoad:
        exerciseLoad

    });


    currentSets = [];


    renderCurrentSets();


    document
      .getElementById("exercise")
      .value = "";


    document
      .getElementById("weight")
      .value = "";


    document
      .getElementById("reps")
      .value = "";


    document
      .getElementById(
        "previousRecord"
      )
      .style.display = "none";


    document
      .getElementById(
        "comparison"
      )
      .style.display = "none";


    updateTodayTotal();


    alert(
      `${exercise}を完了しました`
    );

  }


  /* =========================
     今日の総負荷
  ========================== */

  function updateTodayTotal() {

    const total =
      todayExercises.reduce(
        function(sum, exercise) {

          return sum +
            exercise.totalLoad;

        },
        0
      );


    document
      .getElementById(
        "todayTotalLoad"
      )
      .textContent =
      formatNumber(total);

  }


  /* =========================
     今日のトレーニング保存
  ========================== */

  function saveTodayWorkout() {

    if (
      todayExercises.length === 0
    ) {

      alert(
        "まず種目を完了してください"
      );

      return;

    }


    const date =
      document
        .getElementById(
          "trainingDate"
        )
        .value;


    if (!date) {

      alert(
        "トレーニング日を選択してください"
      );

      return;

    }


    const workouts =
      getWorkouts();


    const newWorkout = {

      date:
        date,

      exercises:
        todayExercises.map(
          function(exercise) {

            return {

              exercise:
                exercise.exercise,

              sets:
                exercise.sets,

              totalLoad:
                exercise.totalLoad

            };

          }
        )

    };


    /*
      同じ日の記録があれば置き換える
    */

    const existingIndex =
      workouts.findIndex(
        function(workout) {

          return workout.date === date;

        }
      );


    if (existingIndex >= 0) {

      workouts[
        existingIndex
      ] =
        newWorkout;

    } else {

      workouts.unshift(
        newWorkout
      );

    }


    workouts.sort(
      function(a, b) {

        return b.date.localeCompare(
          a.date
        );

      }
    );


    saveWorkouts(workouts);


    renderHistory();


    alert(
      `${formatDate(date)}のトレーニングを保存しました`
    );

  }


  /* =========================
     履歴表示
  ========================== */

  function renderHistory() {

    const area =
      document.getElementById(
        "history"
      );


    const workouts =
      getWorkouts();


    area.innerHTML = "";


    if (
      workouts.length === 0
    ) {

      area.innerHTML = `

        <div class="empty">
          まだ記録がありません
        </div>

      `;

      return;

    }


    workouts.forEach(
      function(workout) {

        const record =
          document.createElement(
            "div"
          );


        record.className =
          "record";


        let html = `

          <div class="record-date">
            ${formatDate(workout.date)}
          </div>

          <div class="record-title">
            トレーニング
          </div>

        `;


        workout.exercises.forEach(
          function(exercise) {

            html += `

              <div class="record-exercise">
                ${exercise.exercise}
              </div>

            `;


            exercise.sets.forEach(
              function(set, index) {

                html += `

                  <div class="details">
                    セット ${index + 1}：
                    ${set.weight} kg ×
                    ${set.reps} 回
                  </div>

                `;

              }
            );


            html += `

              <div class="exercise-total">
                種目総負荷：
                ${formatNumber(
                  exercise.totalLoad
                )} kg
              </div>

            `;

          }
        );


        const dayTotal =
          workout.exercises.reduce(
            function(sum, exercise) {

              return sum +
                exercise.totalLoad;

            },
            0
          );


        html += `

          <div class="day-total">
            1日の総負荷：
            ${formatNumber(dayTotal)} kg
          </div>

          <button
            class="delete-button"
            type="button"
            onclick="deleteWorkout('${workout.date}')"
          >
            この記録を削除
          </button>

        `;


        record.innerHTML =
          html;


        area.appendChild(
          record
        );

      }
    );

  }


  /* =========================
     記録削除
  ========================== */

  function deleteWorkout(date) {

    const ok =
      confirm(
        `${formatDate(date)}のトレーニング記録を削除しますか？`
      );


    if (!ok) {

      return;

    }


    let workouts =
      getWorkouts();


    workouts =
      workouts.filter(
        function(workout) {

          return workout.date !== date;

        }
      );


    saveWorkouts(
      workouts
    );


    renderHistory();


    alert(
      "記録を削除しました"
    );

  }


  /* =========================
     日付表示
  ========================== */

  function formatDate(date) {

    const parts =
      date.split("-");


    if (
      parts.length !== 3
    ) {

      return date;

    }


    return `${parts[0]}年${Number(parts[1])}月${Number(parts[2])}日`;

  }


  /* =========================
     数字表示
  ========================== */

  function formatNumber(number) {

    return Number(
      number
    ).toLocaleString(
      "ja-JP"
    );

  }


  /* =========================
     初期表示
  ========================== */

  renderHistory();

  updatePreviousRecord();

  updateTodayTotal();

</script>

</body>
</html>
