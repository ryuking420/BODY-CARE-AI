<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BODY CARE AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 30px;
      font-size: 28px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      margin-top: 16px;
    }

    label:first-child {
      margin-top: 0;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    .gray-button {
      background: #666;
    }

    .save-button {
      margin-top: 25px;
      background: #111;
    }

    .set-list {
      margin-top: 20px;
    }

    .set-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #ddd;
      padding: 14px 0;
      font-size: 18px;
    }

    .set-number {
      font-weight: bold;
    }

    .current-exercise {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 2px solid #222;
    }

    .current-exercise-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .exercise-block {
      border-top: 1px solid #ddd;
      padding: 18px 0;
    }

    .exercise-block:first-child {
      border-top: none;
    }

    .exercise-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .exercise-details {
      color: #555;
      font-size: 16px;
      line-height: 1.8;
    }

    .record {
      border-top: 1px solid #ddd;
      padding: 18px 0;
    }

    .record:first-child {
      border-top: none;
    }

    .record-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .record-details {
      color: #555;
      font-size: 16px;
      line-height: 1.8;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 20px 0;
    }

    .small-note {
      color: #777;
      font-size: 14px;
      margin-top: 10px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>BODY CARE AI</h1>


  <!-- ========================= -->
  <!-- トレーニング入力 -->
  <!-- ========================= -->

  <div class="card">

    <label for="exercise">種目</label>

    <select id="exercise">
      <option value="">種目を選択してください</option>
      <option value="ベンチプレス">ベンチプレス</option>
      <option value="スクワット">スクワット</option>
      <option value="デッドリフト">デッドリフト</option>
      <option value="RDL">RDL</option>
      <option value="ラットプルダウン">ラットプルダウン</option>
      <option value="懸垂">懸垂</option>
      <option value="レッグプレス">レッグプレス</option>
      <option value="ショルダープレス">ショルダープレス</option>
      <option value="サイドレイズ">サイドレイズ</option>
      <option value="ペックフライ">ペックフライ</option>
      <option value="フェイスプル">フェイスプル</option>
    </select>


    <label for="weight">重量（kg）</label>

    <input
      type="number"
      id="weight"
      placeholder="例：70"
      inputmode="decimal"
      step="0.5"
    >


    <label for="reps">回数</label>

    <input
      type="number"
      id="reps"
      placeholder="例：8"
      inputmode="numeric"
    >


    <button
      type="button"
      onclick="addSet()">
      セットを追加
    </button>


    <!-- 現在の種目 -->
    <div
      id="currentExercise"
      class="current-exercise"
      style="display:none;">
    </div>


    <button
      type="button"
      class="gray-button"
      onclick="addExercise()">
      この種目を追加
    </button>


    <!-- 今日追加した種目 -->
    <div
      id="workoutPreview"
      class="set-list">
    </div>


    <button
      type="button"
      class="save-button"
      onclick="saveWorkout()">
      今日のトレーニングを保存
    </button>


    <div class="small-note">
      ①セットを追加 → ②種目を追加 → ③次の種目 → ④最後に保存
    </div>

  </div>


  <!-- ========================= -->
  <!-- 保存済み記録 -->
  <!-- ========================= -->

  <div class="card">

    <h2>トレーニング記録</h2>

    <div id="records">

      <div class="empty">
        まだ記録がありません
      </div>

    </div>

  </div>

</div>


<script>

  // 現在入力している種目のセット
  let currentSets = [];

  // 今日のトレーニングに追加した種目
  let currentWorkout = [];


  // ==============================
  // セットを追加
  // ==============================

  function addSet() {

    const exercise =
      document.getElementById("exercise").value;

    const weight =
      document.getElementById("weight").value;

    const reps =
      document.getElementById("reps").value;


    if (!exercise || !weight || !reps) {

      alert(
        "種目・重量・回数をすべて入力してください"
      );

      return;
    }


    // 同じ種目のセットだけ追加
    if (
      currentSets.length > 0 &&
      currentSets[0].exercise !== exercise
    ) {

      alert(
        "現在の種目のセットを追加してください。\n別の種目にする場合は「この種目を追加」を押してください。"
      );

      return;
    }


    currentSets.push({

      exercise: exercise,

      weight: weight,

      reps: reps

    });


    renderCurrentSets();


    document.getElementById("weight").value = "";
    document.getElementById("reps").value = "";

  }


  // ==============================
  // 現在のセットを表示
  // ==============================

  function renderCurrentSets() {

    const area =
      document.getElementById("currentExercise");


    if (currentSets.length === 0) {

      area.style.display = "none";
      area.innerHTML = "";

      return;
    }


    area.style.display = "block";


    let html = `
      <div class="current-exercise-title">
        ${currentSets[0].exercise}
      </div>
    `;


    currentSets.forEach((set, index) => {

      html += `
        <div class="set-item">
          <span class="set-number">
            セット ${index + 1}
          </span>

          <span>
            ${set.weight} kg × ${set.reps} 回
          </span>
        </div>
      `;

    });


    area.innerHTML = html;

  }


  // ==============================
  // 種目を追加
  // ==============================

  function addExercise() {

    if (currentSets.length === 0) {

      alert(
        "まずセットを追加してください"
      );

      return;
    }


    const exerciseData = {

      exercise:
        currentSets[0].exercise,

      sets:
        currentSets.map(set => ({

          weight: set.weight,

          reps: set.reps

        }))

    };


    currentWorkout.push(exerciseData);


    renderWorkoutPreview();


    // 現在の種目をリセット
    currentSets = [];

    renderCurrentSets();


    document.getElementById("exercise").value = "";

    document.getElementById("weight").value = "";

    document.getElementById("reps").value = "";

  }


  // ==============================
  // 今日のトレーニング表示
  // ==============================

  function renderWorkoutPreview() {

    const area =
      document.getElementById("workoutPreview");


    area.innerHTML = "";


    currentWorkout.forEach((workout, index) => {

      const block =
        document.createElement("div");

      block.className =
        "exercise-block";


      let setsText = "";


      workout.sets.forEach((set, setIndex) => {

        setsText +=
          `セット ${setIndex + 1}：${set.weight} kg × ${set.reps} 回<br>`;

      });


      block.innerHTML = `

        <div class="exercise-title">
          ${workout.exercise}
        </div>

        <div class="exercise-details">
          ${setsText}
        </div>

      `;


      area.appendChild(block);

    });

  }


  // ==============================
  // トレーニング保存
  // ==============================

  function saveWorkout() {

    // 入力中の種目が残っている場合
    if (currentSets.length > 0) {

      const answer =
        confirm(
          "現在入力中の種目があります。\nこの種目も追加して保存しますか？"
        );


      if (answer) {

        addExercise();

      } else {

        return;

      }

    }


    if (currentWorkout.length === 0) {

      alert(
        "まずトレーニングを追加してください"
      );

      return;
    }


    // 既存データを取得
    const savedRecords =
      localStorage.getItem("trainingRecords");


    const records =
      savedRecords
        ? JSON.parse(savedRecords)
        : [];


    // 今日のトレーニング
    const workout = {

      type: "fullWorkout",

      date:
        new Date().toLocaleDateString("ja-JP"),

      exercises:
        currentWorkout

    };


    records.unshift(workout);


    localStorage.setItem(
      "trainingRecords",
      JSON.stringify(records)
    );


    // 画面表示
    displayRecord(workout);


    // リセット
    currentWorkout = [];

    currentSets = [];

    renderWorkoutPreview();

    renderCurrentSets();

    document.getElementById("exercise").value = "";

    document.getElementById("weight").value = "";

    document.getElementById("reps").value = "";


    alert(
      "今日のトレーニングを保存しました！"
    );

  }


  // ==============================
  // 保存記録を表示
  // ==============================

  function displayRecord(record) {

    const recordsArea =
      document.getElementById("records");


    const empty =
      recordsArea.querySelector(".empty");


    if (empty) {
      empty.remove();
    }


    const item =
      document.createElement("div");

    item.className = "record";


    // STEP 3
    if (
      record.type === "fullWorkout" &&
      Array.isArray(record.exercises)
    ) {

      let html = `

        <div class="record-title">
          ${record.date || "トレーニング"}
        </div>

      `;


      record.exercises.forEach(exercise => {

        html += `

          <div class="exercise-block">

            <div class="exercise-title">
              ${exercise.exercise}
            </div>

            <div class="record-details">
        `;


        exercise.sets.forEach((set, index) => {

          html +=
            `セット ${index + 1}：${set.weight} kg × ${set.reps} 回<br>`;

        });


        html += `

            </div>

          </div>

        `;

      });


      item.innerHTML = html;

    }


    // 以前の複数セット形式
    else if (
      record.type === "workout" &&
      Array.isArray(record.sets)
    ) {

      let setsText = "";


      record.sets.forEach((set, index) => {

        setsText +=
          `セット ${index + 1}：${set.weight} kg × ${set.reps} 回<br>`;

      });


      item.innerHTML = `

        <div class="record-title">
          ${record.exercise}
        </div>

        <div class="record-details">
          ${setsText}
        </div>

      `;

    }


    // STEP 0.5以前の形式
    else {

      item.innerHTML = `

        <div class="record-title">
          ${record.exercise}
        </div>

        <div class="record-details">
          ${record.weight} kg × ${record.reps} 回
        </div>

      `;

    }


    recordsArea.prepend(item);

  }


  // ==============================
  // 保存済み記録を読み込む
  // ==============================

  function loadRecords() {

    const savedRecords =
      localStorage.getItem("trainingRecords");


    if (!savedRecords) {
      return;
    }


    const records =
      JSON.parse(savedRecords);


    // 古い順→新しい順ではなく、
    // 保存された順番で表示
    records.forEach(record => {

      displayRecord(record);

    });

  }


  // ==============================
  // 起動
  // ==============================

  loadRecords();

</script>

</body>
</html>
