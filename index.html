
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BODY CARE AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 30px;
      font-size: 28px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      margin-top: 16px;
    }

    label:first-child {
      margin-top: 0;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary-button {
      background: #666;
    }

    .save-button {
      background: #111;
      margin-top: 25px;
    }

    .set-list {
      margin-top: 20px;
    }

    .set-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #ddd;
      padding: 14px 0;
      font-size: 18px;
    }

    .set-number {
      font-weight: bold;
    }

    .record {
      border-top: 1px solid #ddd;
      padding: 15px 0;
    }

    .record:first-child {
      border-top: none;
    }

    .exercise {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .details {
      color: #555;
      font-size: 16px;
      line-height: 1.7;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 20px 0;
    }

    .small-note {
      color: #777;
      font-size: 14px;
      margin-top: 10px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>BODY CARE AI</h1>

    <!-- トレーニング入力 -->
    <div class="card">

      <label for="exercise">種目</label>

      <select id="exercise">
        <option value="">種目を選択してください</option>
        <option value="ベンチプレス">ベンチプレス</option>
        <option value="スクワット">スクワット</option>
        <option value="デッドリフト">デッドリフト</option>
        <option value="RDL">RDL</option>
        <option value="ラットプルダウン">ラットプルダウン</option>
        <option value="懸垂">懸垂</option>
        <option value="レッグプレス">レッグプレス</option>
        <option value="ショルダープレス">ショルダープレス</option>
        <option value="サイドレイズ">サイドレイズ</option>
        <option value="ペックフライ">ペックフライ</option>
        <option value="フェイスプル">フェイスプル</option>
      </select>


      <label for="weight">重量（kg）</label>

      <input
        type="number"
        id="weight"
        placeholder="例：70"
        inputmode="decimal"
        step="0.5"
      >


      <label for="reps">回数</label>

      <input
        type="number"
        id="reps"
        placeholder="例：8"
        inputmode="numeric"
      >


      <button
        type="button"
        onclick="addSet()">
        セットを追加
      </button>


      <!-- 現在のセット -->
      <div class="set-list" id="currentSets"></div>


      <button
        type="button"
        class="save-button"
        onclick="saveWorkout()">
        トレーニングを保存
      </button>


      <div class="small-note">
        セットを追加してから「トレーニングを保存」を押してください。
      </div>

    </div>


    <!-- 保存済み記録 -->
    <div class="card">

      <h2>トレーニング記録</h2>

      <div id="records">

        <div class="empty">
          まだ記録がありません
        </div>

      </div>

    </div>

  </div>


  <script>

    // 現在入力中のセット
    let currentSets = [];


    // --------------------------------
    // 保存されている記録を読み込む
    // --------------------------------

    function loadRecords() {

      const savedRecords =
        localStorage.getItem("trainingRecords");

      if (!savedRecords) {
        return;
      }

      const records =
        JSON.parse(savedRecords);


      records.forEach(record => {

        displayRecord(record);

      });
    }


    // --------------------------------
    // 記録を保存
    // --------------------------------

    function saveRecords(records) {

      localStorage.setItem(
        "trainingRecords",
        JSON.stringify(records)
      );

    }


    // --------------------------------
    // セットを追加
    // --------------------------------

    function addSet() {

      const exercise =
        document.getElementById("exercise").value;

      const weight =
        document.getElementById("weight").value;

      const reps =
        document.getElementById("reps").value;


      if (!exercise || !weight || !reps) {

        alert(
          "種目・重量・回数をすべて入力してください"
        );

        return;
      }


      // 種目が途中で変わるのを防ぐ
      if (
        currentSets.length > 0 &&
        currentSets[0].exercise !== exercise
      ) {

        alert(
          "同じ種目のセットを追加してください"
        );

        return;
      }


      currentSets.push({

        exercise: exercise,

        weight: weight,

        reps: reps

      });


      renderCurrentSets();


      // 重量と回数だけリセット
      document.getElementById("weight").value = "";
      document.getElementById("reps").value = "";

    }


    // --------------------------------
    // 現在のセットを画面表示
    // --------------------------------

    function renderCurrentSets() {

      const area =
        document.getElementById("currentSets");

      area.innerHTML = "";


      currentSets.forEach((set, index) => {

        const item =
          document.createElement("div");

        item.className = "set-item";


        item.innerHTML = `
          <span class="set-number">
            セット ${index + 1}
          </span>

          <span>
            ${set.weight} kg × ${set.reps} 回
          </span>
        `;


        area.appendChild(item);

      });


      // セットがある場合は種目を変更できないようにする
      document.getElementById("exercise").disabled =
        currentSets.length > 0;

    }


    // --------------------------------
    // トレーニングを保存
    // --------------------------------

    function saveWorkout() {

      if (currentSets.length === 0) {

        alert(
          "まずセットを追加してください"
        );

        return;
      }


      const savedRecords =
        localStorage.getItem("trainingRecords");


      const records =
        savedRecords
          ? JSON.parse(savedRecords)
          : [];


      // 新しい形式のトレーニング記録
      const workout = {

        type: "workout",

        exercise:
          currentSets[0].exercise,

        sets:
          currentSets.map(set => ({

            weight: set.weight,

            reps: set.reps

          }))

      };


      records.unshift(workout);


      saveRecords(records);


      // 画面に表示
      displayRecord(workout);


      // 現在のセットをリセット
      currentSets = [];

      renderCurrentSets();

      document.getElementById("exercise").disabled = false;

      document.getElementById("exercise").value = "";

      document.getElementById("weight").value = "";

      document.getElementById("reps").value = "";

    }


    // --------------------------------
    // 保存記録を画面表示
    // --------------------------------

    function displayRecord(record) {

      const recordsArea =
        document.getElementById("records");


      const empty =
        recordsArea.querySelector(".empty");


      if (empty) {
        empty.remove();
      }


      const item =
        document.createElement("div");

      item.className = "record";


      // 新しい複数セット形式
      if (
        record.type === "workout" &&
        Array.isArray(record.sets)
      ) {

        let setsText = "";

        record.sets.forEach((set, index) => {

          setsText +=
            `セット ${index + 1}：${set.weight} kg × ${set.reps} 回<br>`;

        });


        item.innerHTML = `
          <div class="exercise">
            ${record.exercise}
          </div>

          <div class="details">
            ${setsText}
          </div>
        `;

      }

      // STEP 0.5 / STEP 1 の古い形式
      else {

        item.innerHTML = `
          <div class="exercise">
            ${record.exercise}
          </div>

          <div class="details">
            ${record.weight} kg × ${record.reps} 回
          </div>
        `;

      }


      recordsArea.prepend(item);

    }


    // --------------------------------
    // ページ読み込み時
    // --------------------------------

    loadRecords();

  </script>

</body>
</html>
