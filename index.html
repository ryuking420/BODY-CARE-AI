<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BODY CARE AI</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#080b0e;
  --card:#12171c;
  --input:#0c1014;
  --line:#293139;
  --text:#f4f6f8;
  --sub:#929ba5;
  --muted:#626b75;
  --green:#32d47f;
  --green-dark:#20b568;
  --red:#ff5555;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:
    radial-gradient(circle at top,#12191f 0%,#080b0e 45%,#06080a 100%);
  color:var(--text);
  min-height:100vh;
  padding-bottom:90px;
}

.container{
  max-width:620px;
  margin:0 auto;
  padding:20px;
}

.header{
  text-align:center;
  margin:8px 0 28px;
}

.logo{
  color:var(--green);
  font-size:13px;
  font-weight:700;
  letter-spacing:2px;
  margin-bottom:7px;
}

.app-title{
  font-size:30px;
  font-weight:800;
  letter-spacing:1px;
}

.app-subtitle{
  color:var(--sub);
  font-size:13px;
  margin-top:5px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

.section-heading{
  margin-bottom:18px;
}

.section-title{
  font-size:20px;
  font-weight:800;
}

.section-label{
  color:var(--green);
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
  margin-bottom:5px;
}

label{
  display:block;
  color:var(--sub);
  font-size:13px;
  font-weight:700;
  margin:16px 0 8px;
}

label:first-child{
  margin-top:0;
}

select,
input{
  width:100%;
  padding:14px;
  font-size:18px;
  color:var(--text);
  background:var(--input);
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
}

select:focus,
input:focus{
  border-color:var(--green);
}

select:disabled{
  opacity:.55;
}

input::placeholder{
  color:var(--muted);
}

.input-row{
  display:flex;
  gap:10px;
}

.input-unit{
  position:relative;
  flex:1;
}

.input-unit input{
  padding-right:55px;
}

.input-unit span{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:var(--sub);
  font-size:14px;
  pointer-events:none;
}

button{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:none;
  border-radius:12px;
  background:var(--green);
  color:#06100a;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.complete-button{
  background:#263039;
  color:var(--text);
  margin-top:22px;
}

.save-button{
  background:var(--green);
  color:#06100a;
}

.delete-button{
  background:#35181b;
  color:#ff7777;
}

.set-list{
  margin-top:18px;
}

.set-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-top:1px solid var(--line);
  padding:13px 0;
  font-size:16px;
}

.set-number{
  color:var(--green);
  font-weight:800;
}

.set-delete{
  width:auto;
  margin:0;
  padding:6px 10px;
  background:transparent;
  color:var(--red);
  border:1px solid #4a2529;
  font-size:12px;
}

.previous-card{
  background:#0d1318;
  border:1px solid #263139;
  border-radius:14px;
  padding:16px;
  margin-top:18px;
}

.previous-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:8px;
}

.previous-date{
  color:var(--sub);
  font-size:13px;
  margin-bottom:10px;
}

.previous-set{
  font-size:15px;
  line-height:1.8;
}

.previous-total{
  font-weight:800;
  margin-top:8px;
  padding-top:9px;
  border-top:1px solid var(--line);
}

.one-rm{
  color:var(--sub);
  font-size:13px;
  line-height:1.7;
}

.one-rm-best{
  font-weight:800;
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid var(--line);
}

.comparison-box{
  background:#0c1217;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  margin-top:12px;
}

.comparison-title{
  font-weight:800;
  margin-bottom:6px;
}

.comparison-line{
  color:var(--sub);
  font-size:13px;
  line-height:1.7;
}

.comparison-up{
  color:var(--green);
  font-weight:800;
}

.comparison-down{
  color:#ff7777;
  font-weight:800;
}

.comparison-same{
  color:var(--sub);
  font-weight:800;
}

.today-card{
  background:var(--card);
  border:1px solid var(--green-dark);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

.today-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:18px;
}

.today-empty{
  color:var(--muted);
  font-size:15px;
}

.today-exercise{
  border-top:1px solid var(--line);
  padding:18px 0;
}

.today-exercise:first-child{
  border-top:none;
  padding-top:0;
}

.today-exercise-name{
  font-size:20px;
  font-weight:800;
  margin-bottom:7px;
}

.today-exercise-summary{
  color:var(--sub);
  font-size:14px;
  margin-bottom:8px;
}

.today-set{
  color:var(--sub);
  font-size:15px;
  line-height:1.8;
}

.today-exercise-total{
  font-size:16px;
  font-weight:800;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--line);
}

.total-card{
  background:#0e151a;
  border:1px solid var(--green-dark);
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
  text-align:center;
}

.total-label{
  color:var(--sub);
  font-size:14px;
}

.total-number{
  color:var(--green);
  font-size:36px;
  font-weight:800;
  margin-top:5px;
}

.total-unit{
  color:var(--sub);
  font-size:17px;
  font-weight:400;
}

.record{
  border-top:1px solid var(--line);
  padding:20px 0;
}

.record:first-child{
  border-top:none;
}

.date-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:14px;
}

.workout-title{
  color:var(--green);
  font-size:14px;
  font-weight:800;
  margin-bottom:18px;
}

.exercise{
  font-size:18px;
  font-weight:800;
  margin-top:18px;
  margin-bottom:8px;
}

.details{
  color:var(--sub);
  font-size:15px;
  line-height:1.8;
}

.exercise-total{
  color:var(--text);
  font-weight:800;
  margin-top:5px;
}

.day-total{
  color:var(--text);
  font-size:18px;
  font-weight:800;
  margin-top:20px;
  padding-top:15px;
  border-top:1px solid var(--line);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:20px 0;
}

.ai-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
}

.ai-title{
  color:var(--green);
  font-size:20px;
  font-weight:800;
}

.ai-text{
  color:var(--sub);
  line-height:1.8;
  margin-top:10px;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  background:rgba(8,11,14,.96);
  border-top:1px solid var(--line);
  backdrop-filter:blur(12px);
  display:flex;
  justify-content:center;
}

.nav-inner{
  width:100%;
  max-width:620px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.nav-button{
  margin:0;
  padding:13px 5px 12px;
  background:transparent;
  color:var(--muted);
  border-radius:0;
  font-size:12px;
}

.nav-button.active{
  color:var(--green);
  background:transparent;
}

.section-hidden{
  display:none;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">BODY CARE</div>
    <div class="app-title">BODY CARE AI</div>
    <div class="app-subtitle">Training Log</div>
  </div>

  <!-- 記録 -->
  <section id="recordSection">

    <div class="card">

      <div class="section-heading">
        <div class="section-label">RECORD</div>
        <div class="section-title">トレーニングを記録</div>
      </div>

      <label for="trainingDate">トレーニング日</label>
      <input type="date" id="trainingDate">

      <label for="exercise">種目</label>
      <select id="exercise">
        <option value="">種目を選択してください</option>
        <option value="ベンチプレス">ベンチプレス</option>
        <option value="スクワット">スクワット</option>
        <option value="デッドリフト">デッドリフト</option>
        <option value="RDL">RDL</option>
        <option value="ラットプルダウン">ラットプルダウン</option>
        <option value="懸垂">懸垂</option>
        <option value="レッグプレス">レッグプレス</option>
        <option value="ショルダープレス">ショルダープレス</option>
        <option value="サイドレイズ">サイドレイズ</option>
        <option value="ペックフライ">ペックフライ</option>
        <option value="フェイスプル">フェイスプル</option>
      </select>

      <div id="previousRecord" class="previous-card" style="display:none"></div>

      <div class="input-row">

        <div class="input-unit">
          <label for="weight">重量</label>
          <input
            type="number"
            id="weight"
            placeholder="例：70"
            inputmode="decimal"
            step="0.5"
          >
          <span>kg</span>
        </div>

        <div class="input-unit">
          <label for="reps">回数</label>
          <input
            type="number"
            id="reps"
            placeholder="例：8"
            inputmode="numeric"
          >
          <span>回</span>
        </div>

      </div>

      <button type="button" id="addSetButton">セットを追加</button>

      <div class="set-list" id="currentSets"></div>

      <button
        type="button"
        class="complete-button"
        id="completeExerciseButton"
      >
        この種目を完了
      </button>

    </div>

  </section>


  <!-- 今日 -->
  <section id="todaySection">

    <div class="today-card">

      <div class="section-label">TODAY</div>

      <div class="today-title" id="todayTitle">
        今日のトレーニング
      </div>

      <div id="todayExercises">
        <div class="today-empty">
          まだ完了した種目はありません
        </div>
      </div>

      <button
        type="button"
        class="save-button"
        id="saveTodayButton"
      >
        この日のトレーニングを保存
      </button>

    </div>

    <div class="total-card">

      <div class="total-label">
        今日の総負荷
      </div>

      <div class="total-number">
        <span id="todayTotalLoad">0</span>
        <span class="total-unit"> kg</span>
      </div>

    </div>

  </section>


  <!-- 履歴 -->
  <section id="historySection">

    <div class="card">

      <div class="section-heading">
        <div class="section-label">HISTORY</div>
        <div class="section-title">過去のトレーニング履歴</div>
      </div>

      <div id="history">
        <div class="empty">
          まだ記録がありません
        </div>
      </div>

    </div>

  </section>


  <!-- AI -->
  <section id="analysisSection" class="section-hidden">

    <div class="ai-card">

      <div class="section-label">AI</div>

      <div class="ai-title">
        BODY CARE AI
      </div>

      <div class="ai-text">
        ここから、トレーニング・身体・生活データをもとに、
        あなたの身体を長期的に分析していきます。
      </div>

    </div>

  </section>

</div>


<!-- 下部ナビ -->
<div class="bottom-nav">

  <div class="nav-inner">

    <button
      type="button"
      class="nav-button active"
      data-section="recordSection"
    >
      記録
    </button>

    <button
      type="button"
      class="nav-button"
      data-section="todaySection"
    >
      今日
    </button>

    <button
      type="button"
      class="nav-button"
      data-section="historySection"
    >
      履歴
    </button>

    <button
      type="button"
      class="nav-button"
      data-section="analysisSection"
    >
      AI
    </button>

  </div>

</div>


<script>

let currentSets=[];
let currentExercises=[];


/* =========================
   日付
========================= */

function getToday(){

  const now=new Date();

  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;

}


function formatDate(dateString){

  const parts=dateString.split("-");

  if(parts.length!==3)return dateString;

  return `${parts[0]}年${Number(parts[1])}月${Number(parts[2])}日`;

}


/* =========================
   履歴
========================= */

function getHistory(){

  const saved=localStorage.getItem("trainingHistory");

  if(!saved)return[];

  try{

    const data=JSON.parse(saved);

    return Array.isArray(data)?data:[];

  }catch(error){

    return[];

  }

}


function saveHistory(history){

  localStorage.setItem(
    "trainingHistory",
    JSON.stringify(history)
  );

}


/* =========================
   総負荷
========================= */

function calculateExerciseLoad(sets){

  return (sets||[]).reduce(
    (total,set)=>
      total+
      Number(set.weight||0)*
      Number(set.reps||0),
    0
  );

}


/* =========================
   推定1RM
========================= */

function calculateEstimated1RM(weight,reps){

  weight=Number(weight||0);
  reps=Number(reps||0);

  if(weight<=0||reps<=0)return 0;

  return weight*(1+reps/30);

}


function getBestEstimated1RM(sets){

  return Math.max(
    ...(sets||[]).map(
      set=>calculateEstimated1RM(
        set.weight,
        set.reps
      )
    ),
    0
  );

}


/* =========================
   前回記録
========================= */

function findPreviousRecord(exerciseName,selectedDate){

  const history=getHistory();

  const previousDays=history
    .filter(record=>record.date<selectedDate)
    .sort(
      (a,b)=>b.date.localeCompare(a.date)
    );

  for(const day of previousDays){

    const exercise=
      (day.exercises||[]).find(
        item=>item.exercise===exerciseName
      );

    if(exercise){

      return{
        date:day.date,
        exercise:exercise
      };

    }

  }

  return null;

}


function updatePreviousRecord(){

  const exerciseName=
    document.getElementById("exercise").value;

  const selectedDate=
    document.getElementById("trainingDate").value;

  const area=
    document.getElementById("previousRecord");

  area.innerHTML="";

  if(!exerciseName||!selectedDate){

    area.style.display="none";

    return;

  }

  const previous=
    findPreviousRecord(
      exerciseName,
      selectedDate
    );

  area.style.display="block";

  if(!previous){

    area.innerHTML=`
      <div class="previous-title">
        前回の記録
      </div>

      <div class="previous-date">
        ${exerciseName}の前回の記録はありません
      </div>
    `;

    return;

  }

  let setsHTML="";

  (previous.exercise.sets||[]).forEach(
    (set,index)=>{

      setsHTML+=`
        <div class="previous-set">
          セット ${index+1}：
          ${set.weight} kg × ${set.reps} 回
        </div>

        <div class="one-rm">
          推定1RM：約
          ${calculateEstimated1RM(
            set.weight,
            set.reps
          ).toFixed(1)} kg
        </div>
      `;

    }
  );

  const previousLoad=
    calculateExerciseLoad(
      previous.exercise.sets||[]
    );

  area.innerHTML=`

    <div class="previous-title">
      前回の記録
    </div>

    <div class="previous-date">
      ${formatDate(previous.date)}
    </div>

    ${setsHTML}

    <div class="previous-total">
      前回総負荷：
      ${previousLoad.toLocaleString()} kg
    </div>

    <div class="one-rm-best">
      前回の推定1RM：
      ${getBestEstimated1RM(
        previous.exercise.sets||[]
      ).toFixed(1)} kg
    </div>

  `;

}


/* =========================
   現在のセット
========================= */

function addSet(){

  const exercise=
    document.getElementById("exercise").value;

  const weight=
    document.getElementById("weight").value;

  const reps=
    document.getElementById("reps").value;

  if(
    !exercise||
    weight===""||
    reps===""
  ){

    alert(
      "種目・重量・回数をすべて入力してください"
    );

    return;

  }

  if(
    currentSets.length>0 &&
    currentSets[0].exercise!==exercise
  ){

    alert(
      "先に「この種目を完了」を押してください"
    );

    return;

  }

  const weightNumber=Number(weight);
  const repsNumber=Number(reps);

  if(
    !Number.isFinite(weightNumber)||
    !Number.isFinite(repsNumber)||
    weightNumber<0||
    repsNumber<=0
  ){

    alert(
      "重量と回数を正しく入力してください"
    );

    return;

  }

  currentSets.push({
    exercise:exercise,
    weight:weightNumber,
    reps:repsNumber
  });

  renderCurrentSets();

  updateTodayTotal();

  document.getElementById("weight").value="";
  document.getElementById("reps").value="";

  document.getElementById("weight").focus();

}


function deleteCurrentSet(index){

  currentSets.splice(index,1);

  renderCurrentSets();

  updateTodayTotal();

}


function renderCurrentSets(){

  const area=
    document.getElementById("currentSets");

  area.innerHTML="";

  currentSets.forEach(
    (set,index)=>{

      const item=
        document.createElement("div");

      item.className="set-item";

      item.innerHTML=`

        <span>
          <span class="set-number">
            セット ${index+1}
          </span>

          ${set.weight} kg × ${set.reps} 回
        </span>

        <button
          type="button"
          class="set-delete"
          onclick="deleteCurrentSet(${index})"
        >
          削除
        </button>

      `;

      area.appendChild(item);

    }
  );

  document.getElementById("exercise").disabled=
    currentSets.length>0;

}


/* =========================
   今日
========================= */

function getTodayExercises(){

  const date=
    document.getElementById("trainingDate").value;

  const history=getHistory();

  const savedRecord=
    history.find(
      record=>record.date===date
    );

  const savedExercises=
    savedRecord?
    (savedRecord.exercises||[]):
    [];

  return[
    ...savedExercises,
    ...currentExercises
  ];

}


function renderTodayExercises(){

  const area=
    document.getElementById("todayExercises");

  const exercises=
    getTodayExercises();

  const selectedDate=
    document.getElementById("trainingDate").value;

  const isToday=
    selectedDate===getToday();

  document.getElementById("todayTitle")
    .textContent=
      isToday?
      "今日のトレーニング":
      `${formatDate(selectedDate)}のトレーニング`;

  if(exercises.length===0){

    area.innerHTML=`
      <div class="today-empty">
        まだ完了した種目はありません
      </div>
    `;

    return;

  }

  let html="";

  exercises.forEach(
    exercise=>{

      const sets=
        exercise.sets||[];

      const load=
        calculateExerciseLoad(sets);

      html+=`

        <div class="today-exercise">

          <div class="today-exercise-name">
            ${exercise.exercise}
          </div>

          <div class="today-exercise-summary">
            ${sets.length}セット
          </div>

      `;

      sets.forEach(
        (set,index)=>{

          html+=`

            <div class="today-set">
              セット ${index+1}：
              ${set.weight} kg × ${set.reps} 回
            </div>

            <div class="one-rm">
              推定1RM：約
              ${calculateEstimated1RM(
                set.weight,
                set.reps
              ).toFixed(1)} kg
            </div>

          `;

        }
      );

      html+=`

          <div class="today-exercise-total">
            種目総負荷：
            ${load.toLocaleString()} kg
          </div>

          <div class="one-rm-best">
            今回の推定1RM：
            ${getBestEstimated1RM(
              sets
            ).toFixed(1)} kg
          </div>

        </div>

      `;

    }
  );

  area.innerHTML=html;

}


function updateTodayTotal(){

  const exercises=
    getTodayExercises();

  let total=0;

  exercises.forEach(
    exercise=>{

      total+=
        calculateExerciseLoad(
          exercise.sets||[]
        );

    }
  );

  if(currentSets.length>0){

    total+=
      calculateExerciseLoad(
        currentSets
      );

  }

  document.getElementById(
    "todayTotalLoad"
  ).textContent=
    total.toLocaleString();

}


/* =========================
   種目完了
========================= */

function completeExercise(){

  if(currentSets.length===0){

    alert(
      "まずセットを追加してください"
    );

    return;

  }

  const exercise=
    currentSets[0].exercise;

  const sets=
    currentSets.map(
      set=>({
        weight:set.weight,
        reps:set.reps
      })
    );

  currentExercises.push({

    exercise:exercise,

    sets:sets,

    totalLoad:
      calculateExerciseLoad(sets)

  });

  currentSets=[];

  renderCurrentSets();

  document.getElementById(
    "exercise"
  ).disabled=false;

  document.getElementById(
    "exercise"
  ).value="";

  renderTodayExercises();

  updateTodayTotal();

  updatePreviousRecord();

}


/* =========================
   今日の保存
========================= */

function saveTodayWorkout(){

  const date=
    document.getElementById(
      "trainingDate"
    ).value;

  if(!date){

    alert(
      "トレーニング日を選択してください"
    );

    return;

  }

  if(currentSets.length>0){

    completeExercise();

  }

  if(currentExercises.length===0){

    const history=getHistory();

    const savedRecord=
      history.find(
        record=>record.date===date
      );

    if(
      !savedRecord||
      !savedRecord.exercises||
      savedRecord.exercises.length===0
    ){

      alert(
        "まずトレーニングを入力してください"
      );

      return;

    }

    renderTodayExercises();
    updateTodayTotal();
    renderHistory();

    return;

  }

  const history=getHistory();

  let dayRecord=
    history.find(
      record=>record.date===date
    );

  if(dayRecord){

    dayRecord.exercises.push(
      ...currentExercises
    );

  }else{

    dayRecord={
      date:date,
      exercises:[
        ...currentExercises
      ]
    };

    history.unshift(dayRecord);

  }

  saveHistory(history);

  currentExercises=[];
  currentSets=[];

  renderCurrentSets();

  document.getElementById(
    "exercise"
  ).disabled=false;

  document.getElementById(
    "exercise"
  ).value="";

  renderTodayExercises();

  updateTodayTotal();

  renderHistory();

  updatePreviousRecord();

  alert(
    "トレーニングを保存しました"
  );

}


/* =========================
   履歴
========================= */

function renderHistory(){

  const area=
    document.getElementById("history");

  area.innerHTML="";

  const history=
    getHistory();

  if(history.length===0){

    area.innerHTML=`
      <div class="empty">
        まだ記録がありません
      </div>
    `;

    return;

  }

  history
    .sort(
      (a,b)=>
        b.date.localeCompare(a.date)
    )
    .forEach(
      record=>{

        const item=
          document.createElement("div");

        item.className="record";

        let exercisesHTML="";

        let dayTotal=0;

        (record.exercises||[])
          .forEach(
            exercise=>{

              const exerciseLoad=
                calculateExerciseLoad(
                  exercise.sets||[]
                );

              dayTotal+=exerciseLoad;

              let setsHTML="";

              (exercise.sets||[])
                .forEach(
                  (set,index)=>{

                    setsHTML+=`

                      セット ${index+1}：
                      ${set.weight} kg ×
                      ${set.reps} 回

                      <br>

                      <span class="one-rm">
                        推定1RM：約
                        ${calculateEstimated1RM(
                          set.weight,
                          set.reps
                        ).toFixed(1)} kg
                      </span>

                      <br>

                    `;

                  }
                );

              exercisesHTML+=`

                <div class="exercise">
                  ${exercise.exercise}
                </div>

                <div class="details">

                  ${setsHTML}

                  <div class="exercise-total">
                    種目総負荷：
                    ${exerciseLoad.toLocaleString()} kg
                  </div>

                  <div class="one-rm-best">
                    推定1RM：
                    ${getBestEstimated1RM(
                      exercise.sets||[]
                    ).toFixed(1)} kg
                  </div>

                </div>

              `;

            }
          );

        item.innerHTML=`

          <div class="date-title">
            ${formatDate(record.date)}
          </div>

          <div class="workout-title">
            トレーニング
          </div>

          ${exercisesHTML}

          <div class="day-total">
            1日の総負荷：
            ${dayTotal.toLocaleString()} kg
          </div>

          <button
            type="button"
            class="delete-button"
            onclick="deleteWorkout('${record.date}')"
          >
            この記録を削除
          </button>

        `;

        area.appendChild(item);

      }
    );

}


function deleteWorkout(date){

  const ok=
    confirm(
      `${formatDate(date)}のトレーニング記録を削除しますか？`
    );

  if(!ok)return;

  let history=
    getHistory();

  history=
    history.filter(
      record=>record.date!==date
    );

  saveHistory(history);

  renderHistory();

  renderTodayExercises();

  updateTodayTotal();

  updatePreviousRecord();

}


/* =========================
   ナビ
========================= */

document
  .querySelectorAll(".nav-button")
  .forEach(
    button=>{

      button.addEventListener(
        "click",
        function(){

          const target=
            this.dataset.section;

          document
            .querySelectorAll(
              "section"
            )
            .forEach(
              section=>{
                section.classList.toggle(
                  "section-hidden",
                  section.id!==target
                );
              }
            );

          document
            .querySelectorAll(
              ".nav-button"
            )
            .forEach(
              nav=>{
                nav.classList.remove(
                  "active"
                );
              }
            );

          this.classList.add("active");

        }
      );

    }
  );

========================= */

document

      renderTodayExercises();

  .addEventListener(

        event.preventDefault();

          .getElementById("reps")
          .focus();

document
  .getElementById("reps")
  .addEventListener(

  );

document.getElementById(

renderHistory();

renderTodayExercises();

updateTodayTotal();
