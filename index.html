<script>
function updateComparison() {

  const area =
    document.getElementById("comparison");

  const exercise =
    getSelectedExercise();

  const date =
    getSelectedDate();

  if (
    !exercise ||
    !date ||
    currentSets.length === 0
  ) {

    area.style.display = "none";
    area.innerHTML = "";

    return;
  }


  const previous =
    findPreviousExerciseRecord(
      exercise,
      date
    );


  if (!previous) {

    area.style.display = "none";
    area.innerHTML = "";

    return;
  }


  const currentLoad =
    calculateLoad(currentSets);

  const previousLoad =
    calculateLoad(
      previous.exercise.sets
    );


  // 重量差
  const difference =
    currentLoad - previousLoad;


  // 増減率
  let percentage = 0;

  if (previousLoad !== 0) {

    percentage =
      (difference / previousLoad) * 100;

  }


  const differenceSign =
    difference > 0
      ? "+"
      : "";


  const percentageSign =
    percentage > 0
      ? "+"
      : "";


  area.innerHTML = `

    <div class="comparison">

      <div class="comparison-title">
        前回との比較
      </div>


      <div class="comparison-row">

        <span>
          前回
        </span>

        <strong>
          ${formatNumber(previousLoad)} kg
        </strong>

      </div>


      <div class="comparison-row">

        <span>
          今回
        </span>

        <strong>
          ${formatNumber(currentLoad)} kg
        </strong>

      </div>


      <div class="comparison-difference">

        前回比：
        ${differenceSign}${formatNumber(difference)} kg

        <br>

        ${percentageSign}${percentage.toFixed(1)}%

      </div>

    </div>

  `;


  area.style.display = "block";

}
</script>
