<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BODY CARE AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 30px;
      font-size: 28px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      margin-top: 16px;
    }

    label:first-child {
      margin-top: 0;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    .save-button {
      margin-top: 25px;
    }

    .delete-button {
      background: #d32f2f;
      font-size: 15px;
      padding: 11px;
      margin-top: 12px;
    }

    .set-list {
      margin-top: 20px;
    }

    .set-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #ddd;
      padding: 14px 0;
      font-size: 18px;
    }

    .set-number {
      font-weight: bold;
    }

    .record {
      border-top: 1px solid #ddd;
      padding: 18px 0;
    }

    .record:first-child {
      border-top: none;
    }

    .record-date {
      color: #777;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .exercise {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .details {
      color: #555;
      font-size: 16px;
      line-height: 1.8;
    }

    .total {
      margin-top: 10px;
      font-size: 17px;
      font-weight: bold;
      color: #111;
    }

    .summary {
      background: #111;
      color: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      text-align: center;
    }

    .summary-title {
      font-size: 15px;
      opacity: 0.8;
      margin-bottom: 6px;
    }

    .summary-number {
      font-size: 28px;
      font-weight: bold;
    }

    .summary-unit {
      font-size: 15px;
      margin-left: 4px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 20px 0;
    }

    .small-note {
      color: #777;
      font-size: 14px;
      margin-top: 10px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>BODY CARE AI</h1>


    <!-- ========================= -->
    <!-- トレーニング入力 -->
    <!-- ========================= -->

    <div class="card">

      <label for="exercise">種目</label>

      <select id="exercise">

        <option value="">
          種目を選択してください
        </option>

        <option value="ベンチプレス">
          ベンチプレス
        </option>

        <option value="スクワット">
          スクワット
        </option>

        <option value="デッドリフト">
          デッドリフト
        </option>

        <option value="RDL">
          RDL
        </option>

        <option value="ラットプルダウン">
          ラットプルダウン
        </option>

        <option value="懸垂">
          懸垂
        </option>

        <option value="レッグプレス">
          レッグプレス
        </option>

        <option value="ショルダープレス">
          ショルダープレス
        </option>

        <option value="サイドレイズ">
          サイドレイズ
        </option>

        <option value="ペックフライ">
          ペックフライ
        </option>

        <option value="フェイスプル">
          フェイスプル
        </option>

      </select>


      <label for="weight">
        重量（kg）
      </label>

      <input
        type="number"
        id="weight"
        placeholder="例：70"
        inputmode="decimal"
        step="0.5"
      >


      <label for="reps">
        回数
      </label>

      <input
        type="number"
        id="reps"
        placeholder="例：8"
        inputmode="numeric"
        step="1"
      >


      <button
        type="button"
        onclick="addSet()">
        セットを追加
      </button>


      <!-- 現在入力中のセット -->

      <div
        class="set-list"
        id="currentSets">
      </div>


      <button
        type="button"
        class="save-button"
        onclick="saveWorkout()">
        トレーニングを保存
      </button>


      <div class="small-note">
        セットを追加してから
        「トレーニングを保存」を押してください。
      </div>

    </div>


    <!-- ========================= -->
    <!-- 総負荷 -->
    <!-- ========================= -->

    <div class="summary">

      <div class="summary-title">
        全トレーニング総負荷
      </div>

      <span
        class="summary-number"
        id="grandTotal">
        0
      </span>

      <span class="summary-unit">
        kg
      </span>

    </div>


    <!-- ========================= -->
    <!-- トレーニング履歴 -->
    <!-- ========================= -->

    <div class="card">

      <h2>
        トレーニング履歴
      </h2>

      <div id="records">

        <div class="empty">
          まだ記録がありません
        </div>

      </div>

    </div>

  </div>


  <script>

    // ========================================
    // 現在入力中のセット
    // ========================================

    let currentSets = [];


    // ========================================
    // HTML特殊文字対策
    // ========================================

    function escapeHtml(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // ========================================
    // 保存データ取得
    // ========================================

    function getRecords() {

      const saved =
        localStorage.getItem("trainingRecords");

      if (!saved) {
        return [];
      }

      try {

        return JSON.parse(saved);

      } catch (error) {

        return [];

      }

    }


    // ========================================
    // 保存データを書き込む
    // ========================================

    function saveRecords(records) {

      localStorage.setItem(
        "trainingRecords",
        JSON.stringify(records)
      );

    }


    // ========================================
    // セット追加
    // ========================================

    function addSet() {

      const exercise =
        document.getElementById("exercise").value;

      const weight =
        document.getElementById("weight").value;

      const reps =
        document.getElementById("reps").value;


      if (!exercise || !weight || !reps) {

        alert(
          "種目・重量・回数をすべて入力してください"
        );

        return;
      }


      // 同じ種目だけ追加可能

      if (
        currentSets.length > 0 &&
        currentSets[0].exercise !== exercise
      ) {

        alert(
          "同じ種目のセットを追加してください"
        );

        return;
      }


      currentSets.push({

        exercise: exercise,

        weight: Number(weight),

        reps: Number(reps)

      });


      renderCurrentSets();


      // 重量・回数だけクリア

      document.getElementById("weight").value = "";

      document.getElementById("reps").value = "";

    }


    // ========================================
    // 現在入力中セット表示
    // ========================================

    function renderCurrentSets() {

      const area =
        document.getElementById("currentSets");


      area.innerHTML = "";


      currentSets.forEach((set, index) => {

        const item =
          document.createElement("div");


        item.className = "set-item";


        item.innerHTML = `

          <span class="set-number">
            セット ${index + 1}
          </span>

          <span>
            ${set.weight} kg × ${set.reps} 回
          </span>

        `;


        area.appendChild(item);

      });


      // セット入力中は種目変更不可

      document.getElementById("exercise").disabled =
        currentSets.length > 0;

    }


    // ========================================
    // トレーニング保存
    // ========================================

    function saveWorkout() {

      if (currentSets.length === 0) {

        alert(
          "まずセットを追加してください"
        );

        return;
      }


      const records =
        getRecords();


      const workout = {

        type: "workout",

        id:
          Date.now(),

        date:
          new Date().toISOString(),

        exercise:
          currentSets[0].exercise,

        sets:
          currentSets.map(set => ({

            weight: set.weight,

            reps: set.reps

          }))

      };


      records.unshift(workout);


      saveRecords(records);


      // 入力状態をリセット

      currentSets = [];

      renderCurrentSets();


      document.getElementById("exercise").disabled =
        false;

      document.getElementById("exercise").value =
        "";

      document.getElementById("weight").value =
        "";

      document.getElementById("reps").value =
        "";


      // 履歴を再表示

      renderRecords();

    }


    // ========================================
    // 1トレーニングの総負荷計算
    // ========================================

    function calculateWorkoutTotal(record) {

      if (
        record.type === "workout" &&
        Array.isArray(record.sets)
      ) {

        return record.sets.reduce(
          (total, set) => {

            return total +
              Number(set.weight) *
              Number(set.reps);

          },
          0
        );

      }


      // 古い形式にも対応

      if (
        record.weight !== undefined &&
        record.reps !== undefined
      ) {

        return (
          Number(record.weight) *
          Number(record.reps)
        );

      }


      return 0;

    }


    // ========================================
    // 全記録の総負荷
    // ========================================

    function calculateGrandTotal(records) {

      return records.reduce(
        (total, record) => {

          return total +
            calculateWorkoutTotal(record);

        },
        0
      );

    }


    // ========================================
    // 日付表示
    // ========================================

    function formatDate(dateString) {

      if (!dateString) {

        return "";

      }


      const date =
        new Date(dateString);


      if (isNaN(date.getTime())) {

        return "";

      }


      return (
        date.getFullYear() +
        "年" +
        (date.getMonth() + 1) +
        "月" +
        date.getDate() +
        "日"
      );

    }


    // ========================================
    // 履歴表示
    // ========================================

    function renderRecords() {

      const records =
        getRecords();


      const recordsArea =
        document.getElementById("records");


      recordsArea.innerHTML = "";


      // 総負荷更新

      const grandTotal =
        calculateGrandTotal(records);


      document.getElementById("grandTotal").textContent =
        grandTotal.toLocaleString();


      // 記録なし

      if (records.length === 0) {

        recordsArea.innerHTML = `

          <div class="empty">
            まだ記録がありません
          </div>

        `;

        return;

      }


      // 新しい順

      records.forEach(
        (record, index) => {

          const item =
            document.createElement("div");


          item.className =
            "record";


          const total =
            calculateWorkoutTotal(record);


          // 新しい複数セット形式

          if (
            record.type === "workout" &&
            Array.isArray(record.sets)
          ) {

            let setsText = "";


            record.sets.forEach(
              (set, setIndex) => {

                setsText += `

                  セット ${setIndex + 1}：
                  ${set.weight} kg ×
                  ${set.reps} 回
                  <br>

                `;

              }
            );


            item.innerHTML = `

              <div class="record-date">
                ${formatDate(record.date)}
              </div>

              <div class="exercise">
                ${escapeHtml(record.exercise)}
              </div>

              <div class="details">
                ${setsText}
              </div>

              <div class="total">
                総負荷：
                ${total.toLocaleString()} kg
              </div>

              <button
                type="button"
                class="delete-button"
                onclick="deleteRecord(${index})">
                この記録を削除
              </button>

            `;

          }

          // 古い形式

          else {

            item.innerHTML = `

              <div class="record-date">
                ${formatDate(record.date)}
              </div>

              <div class="exercise">
                ${escapeHtml(record.exercise)}
              </div>

              <div class="details">
                ${record.weight} kg ×
                ${record.reps} 回
              </div>

              <div class="total">
                総負荷：
                ${total.toLocaleString()} kg
              </div>

              <button
                type="button"
                class="delete-button"
                onclick="deleteRecord(${index})">
                この記録を削除
              </button>

            `;

          }


          recordsArea.appendChild(item);

        }
      );

    }


    // ========================================
    // 記録削除
    // ========================================

    function deleteRecord(index) {

      const records =
        getRecords();


      const record =
        records[index];


      if (!record) {

        return;

      }


      const exercise =
        record.exercise || "この記録";


      const answer =
        confirm(
          exercise +
          "\n\nこのトレーニング記録を削除しますか？"
        );


      if (!answer) {

        return;

      }


      records.splice(index, 1);


      saveRecords(records);


      renderRecords();

    }


    // ========================================
    // ページ読み込み時
    // ========================================

    renderRecords();

  </script>

</body>
</html>
