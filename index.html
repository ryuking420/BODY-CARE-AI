<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BODY CARE AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 30px;
      font-size: 28px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      margin-top: 16px;
    }

    label:first-child {
      margin-top: 0;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    .record {
      border-top: 1px solid #ddd;
      padding: 15px 0;
    }

    .record:first-child {
      border-top: none;
    }

    .exercise {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .details {
      color: #555;
      font-size: 16px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 20px 0;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>BODY CARE AI</h1>

    <div class="card">

      <label for="exercise">種目</label>

      <select id="exercise">
        <option value="">種目を選択してください</option>
        <option value="ベンチプレス">ベンチプレス</option>
        <option value="スクワット">スクワット</option>
        <option value="デッドリフト">デッドリフト</option>
        <option value="RDL">RDL</option>
        <option value="ラットプルダウン">ラットプルダウン</option>
        <option value="懸垂">懸垂</option>
        <option value="レッグプレス">レッグプレス</option>
        <option value="ショルダープレス">ショルダープレス</option>
        <option value="サイドレイズ">サイドレイズ</option>
        <option value="ペックフライ">ペックフライ</option>
        <option value="フェイスプル">フェイスプル</option>
      </select>


      <label for="weight">重量（kg）</label>

      <input
        type="number"
        id="weight"
        placeholder="例：70"
        inputmode="decimal"
      >


      <label for="reps">回数</label>

      <input
        type="number"
        id="reps"
        placeholder="例：8"
        inputmode="numeric"
      >


      <button onclick="addRecord()">
        記録する
      </button>

    </div>


    <div class="card">

      <h2>トレーニング記録</h2>

      <div id="records">

        <div class="empty">
          まだ記録がありません
        </div>

      </div>

    </div>

  </div>


  <script>

    // 保存されている記録を読み込む
    function loadRecords() {

      const savedRecords =
        localStorage.getItem("trainingRecords");

      if (!savedRecords) {
        return;
      }

      const records =
        JSON.parse(savedRecords);

      // 古い記録から順番に表示
      records.forEach(record => {

        displayRecord(
          record.exercise,
          record.weight,
          record.reps
        );

      });
    }


    // 記録を保存する
    function saveRecords(records) {

      localStorage.setItem(
        "trainingRecords",
        JSON.stringify(records)
      );
    }


    // 画面に記録を表示する
    function displayRecord(
      exercise,
      weight,
      reps
    ) {

      const recordsArea =
        document.getElementById("records");

      const empty =
        recordsArea.querySelector(".empty");

      if (empty) {
        empty.remove();
      }


      const record =
        document.createElement("div");

      record.className = "record";


      record.innerHTML = `
        <div class="exercise">
          ${exercise}
        </div>

        <div class="details">
          ${weight} kg × ${reps} 回
        </div>
      `;


      recordsArea.prepend(record);
    }


    // 新しい記録を追加する
    function addRecord() {

      const exercise =
        document.getElementById("exercise").value;

      const weight =
        document.getElementById("weight").value;

      const reps =
        document.getElementById("reps").value;


      // 入力チェック
      if (!exercise || !weight || !reps) {

        alert(
          "種目・重量・回数をすべて入力してください"
        );

        return;
      }


      // 現在の保存データを取得
      const savedRecords =
        localStorage.getItem("trainingRecords");

      const records =
        savedRecords
          ? JSON.parse(savedRecords)
          : [];


      // 新しい記録を追加
      records.unshift({

        exercise: exercise,

        weight: weight,

        reps: reps

      });


      // 保存
      saveRecords(records);


      // 画面に表示
      displayRecord(
        exercise,
        weight,
        reps
      );


      // 入力欄をリセット
      document.getElementById("exercise").value = "";

      document.getElementById("weight").value = "";

      document.getElementById("reps").value = "";
    }


    // ページを開いたときに保存データを読み込む
    loadRecords();

  </script>

</body>
</html>
