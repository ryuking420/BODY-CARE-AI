<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BODY CARE AI</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;
  background: #f5f5f5;
  color: #222;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin: 10px 0 30px;
  font-size: 30px;
}

h2 {
  margin-top: 0;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

label {
  display: block;
  font-weight: bold;
  margin-top: 16px;
  margin-bottom: 8px;
}

label:first-child {
  margin-top: 0;
}

select,
input {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  border: 1px solid #ccc;
  border-radius: 10px;
  background: white;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

button:active {
  transform: scale(0.98);
}

.secondary {
  background: #666;
}

.save {
  margin-top: 25px;
}

.date-box {
  background: #f8f8f8;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 20px;
}

.previous {
  margin-top: 20px;
  padding: 15px;
  background: #f5f5f5;
  border-radius: 12px;
  display: none;
}

.previous-title {
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 8px;
}

.previous-details {
  color: #555;
  line-height: 1.8;
}

.current {
  margin-top: 20px;
}

.current-title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 10px;
}

.set-item {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid #ddd;
  padding: 14px 0;
  font-size: 18px;
}

.set-number {
  font-weight: bold;
}

.exercise-preview {
  border-top: 1px solid #ddd;
  padding: 18px 0;
}

.exercise-preview:first-child {
  border-top: none;
}

.exercise-name {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 8px;
}

.details {
  color: #555;
  line-height: 1.8;
}

.record {
  border-top: 1px solid #ddd;
  padding: 20px 0;
}

.record:first-child {
  border-top: none;
}

.record-date {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 12px;
}

.record-exercise {
  margin-top: 15px;
}

.record-exercise-name {
  font-size: 19px;
  font-weight: bold;
}

.record-sets {
  color: #555;
  line-height: 1.8;
  margin-top: 5px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 20px 0;
}

.note {
  color: #777;
  font-size: 14px;
  line-height: 1.5;
  margin-top: 10px;
}

.compare {
  margin-top: 8px;
  font-size: 14px;
  color: #555;
}

</style>
</head>

<body>

<div class="container">

<h1>BODY CARE AI</h1>


<!-- ======================== -->
<!-- トレーニング入力 -->
<!-- ======================== -->

<div class="card">

  <div class="date-box">

    <label for="trainingDate">
      トレーニング日
    </label>

    <input
      type="date"
      id="trainingDate"
    >

  </div>


  <label for="exercise">
    種目
  </label>

  <select id="exercise">
    <option value="">
      種目を選択してください
    </option>

    <option value="ベンチプレス">
      ベンチプレス
    </option>

    <option value="スクワット">
      スクワット
    </option>

    <option value="デッドリフト">
      デッドリフト
    </option>

    <option value="RDL">
      RDL
    </option>

    <option value="ラットプルダウン">
      ラットプルダウン
    </option>

    <option value="懸垂">
      懸垂
    </option>

    <option value="レッグプレス">
      レッグプレス
    </option>

    <option value="ショルダープレス">
      ショルダープレス
    </option>

    <option value="サイドレイズ">
      サイドレイズ
    </option>

    <option value="ペックフライ">
      ペックフライ
    </option>

    <option value="フェイスプル">
      フェイスプル
    </option>

  </select>


  <!-- ======================== -->
  <!-- 前回記録 -->
  <!-- ======================== -->

  <div
    id="previousRecord"
    class="previous">

    <div class="previous-title">
      前回の記録
    </div>

    <div
      id="previousDetails"
      class="previous-details">
    </div>

  </div>


  <label for="weight">
    重量（kg）
  </label>

  <input
    type="number"
    id="weight"
    placeholder="例：70"
    inputmode="decimal"
    step="0.5"
  >


  <label for="reps">
    回数
  </label>

  <input
    type="number"
    id="reps"
    placeholder="例：8"
    inputmode="numeric"
  >


  <button
    type="button"
    onclick="addSet()">

    セットを追加

  </button>


  <!-- 現在の種目 -->

  <div
    id="currentExercise"
    class="current">
  </div>


  <button
    type="button"
    class="secondary"
    onclick="addExercise()">

    この種目を追加

  </button>


  <!-- 今日作成中のトレーニング -->

  <div
    id="workoutPreview">
  </div>


  <button
    type="button"
    class="save"
    onclick="saveWorkout()">

    トレーニングを保存

  </button>


  <div class="note">

    セットを追加
    ↓
    この種目を追加
    ↓
    次の種目
    ↓
    最後に保存

  </div>

</div>



<!-- ======================== -->
<!-- 保存済み履歴 -->
<!-- ======================== -->

<div class="card">

  <h2>
    トレーニング履歴
  </h2>

  <div id="records">

    <div class="empty">
      まだ記録がありません
    </div>

  </div>

</div>

</div>


<script>


// ========================================
// データ
// ========================================

let currentSets = [];

let currentWorkout = [];

let records = [];


// ========================================
// 今日の日付
// ========================================

function getToday() {

  const today =
    new Date();

  const year =
    today.getFullYear();

  const month =
    String(
      today.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      today.getDate()
    ).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


// ========================================
// 日付を日本語表示
// ========================================

function formatDate(dateString) {

  if (!dateString) {
    return "";
  }

  const parts =
    dateString.split("-");

  if (parts.length !== 3) {
    return dateString;
  }

  return (
    parts[0]
    + "年"
    + Number(parts[1])
    + "月"
    + Number(parts[2])
    + "日"
  );
}


// ========================================
// データ読み込み
// ========================================

function loadData() {

  const saved =
    localStorage.getItem(
      "trainingRecords"
    );

  if (!saved) {

    records = [];

    return;
  }

  try {

    records =
      JSON.parse(saved);

  } catch {

    records = [];

  }

}


// ========================================
// データ保存
// ========================================

function saveData() {

  localStorage.setItem(
    "trainingRecords",
    JSON.stringify(records)
  );

}


// ========================================
// 前回記録を取得
// ========================================

function getPreviousRecord(exercise) {

  if (!exercise) {
    return null;
  }

  const sorted =
    [...records].sort(
      (a, b) => {

        return (
          String(b.date || "")
          .localeCompare(
            String(a.date || "")
          )
        );

      }
    );


  for (
    const workout of sorted
  ) {

    if (
      workout.type !== "fullWorkout"
    ) {
      continue;
    }


    if (!Array.isArray(
      workout.exercises
    )) {
      continue;
    }


    const found =
      workout.exercises.find(
        item =>
          item.exercise === exercise
      );


    if (found) {

      return {

        date:
          workout.date,

        exercise:
          found.exercise,

        sets:
          found.sets

      };

    }

  }


  return null;

}


// ========================================
// 前回記録を表示
// ========================================

function showPreviousRecord() {

  const exercise =
    document.getElementById(
      "exercise"
    ).value;


  const box =
    document.getElementById(
      "previousRecord"
    );


  const details =
    document.getElementById(
      "previousDetails"
    );


  if (!exercise) {

    box.style.display =
      "none";

    return;

  }


  const previous =
    getPreviousRecord(
      exercise
    );


  if (!previous) {

    box.style.display =
      "block";

    details.innerHTML =
      "この種目の前回記録はありません。";

    return;

  }


  let html =
    `<strong>${formatDate(previous.date)}</strong><br>`;


  previous.sets.forEach(
    (set, index) => {

      html +=
        `セット ${index + 1}：
        ${set.weight} kg ×
        ${set.reps} 回<br>`;

    }
  );


  details.innerHTML =
    html;

  box.style.display =
    "block";

}


// ========================================
// 種目変更
// ========================================

document
  .getElementById("exercise")
  .addEventListener(
    "change",
    function() {

      showPreviousRecord();

    }
  );


// ========================================
// セット追加
// ========================================

function addSet() {

  const exercise =
    document.getElementById(
      "exercise"
    ).value;


  const weight =
    document.getElementById(
      "weight"
    ).value;


  const reps =
    document.getElementById(
      "reps"
    ).value;


  if (
    !exercise ||
    !weight ||
    !reps
  ) {

    alert(
      "種目・重量・回数をすべて入力してください"
    );

    return;

  }


  if (
    currentSets.length > 0 &&
    currentSets[0].exercise !== exercise
  ) {

    alert(
      "現在の種目のセットを追加してください。\n別の種目にする場合は「この種目を追加」を押してください。"
    );

    return;

  }


  currentSets.push({

    exercise:
      exercise,

    weight:
      weight,

    reps:
      reps

  });


  renderCurrentSets();


  document.getElementById(
    "weight"
  ).value = "";


  document.getElementById(
    "reps"
  ).value = "";

}


// ========================================
// 現在のセット表示
// ========================================

function renderCurrentSets() {

  const area =
    document.getElementById(
      "currentExercise"
    );


  if (
    currentSets.length === 0
  ) {

    area.innerHTML = "";

    return;

  }


  let html = `

    <div class="current-title">
      ${currentSets[0].exercise}
    </div>

  `;


  currentSets.forEach(
    (set, index) => {

      html += `

        <div class="set-item">

          <span class="set-number">
            セット ${index + 1}
          </span>

          <span>
            ${set.weight} kg ×
            ${set.reps} 回
          </span>

        </div>

      `;

    }
  );


  area.innerHTML =
    html;

}


// ========================================
// 種目を追加
// ========================================

function addExercise() {

  if (
    currentSets.length === 0
  ) {

    alert(
      "まずセットを追加してください"
    );

    return;

  }


  currentWorkout.push({

    exercise:
      currentSets[0].exercise,

    sets:
      currentSets.map(
        set => ({

          weight:
            set.weight,

          reps:
            set.reps

        })
      )

  });


  renderWorkoutPreview();


  currentSets = [];


  renderCurrentSets();


  document.getElementById(
    "exercise"
  ).value = "";


  document.getElementById(
    "weight"
  ).value = "";


  document.getElementById(
    "reps"
  ).value = "";


  document.getElementById(
    "previousRecord"
  ).style.display =
    "none";

}


// ========================================
// 作成中のトレーニング表示
// ========================================

function renderWorkoutPreview() {

  const area =
    document.getElementById(
      "workoutPreview"
    );


  area.innerHTML = "";


  currentWorkout.forEach(
    workout => {

      let html = `

        <div class="exercise-preview">

          <div class="exercise-name">
            ${workout.exercise}
          </div>

          <div class="details">

      `;


      workout.sets.forEach(
        (set, index) => {

          html +=
            `セット ${index + 1}：
            ${set.weight} kg ×
            ${set.reps} 回<br>`;

        }
      );


      html += `

          </div>

        </div>

      `;


      area.innerHTML +=
        html;

    }
  );

}


// ========================================
// トレーニング保存
// ========================================

function saveWorkout() {


  // 入力途中の種目がある場合
  if (
    currentSets.length > 0
  ) {

    const answer =
      confirm(
        "現在入力中の種目があります。\nこの種目も追加して保存しますか？"
      );


    if (!answer) {

      return;

    }


    addExercise();

  }


  if (
    currentWorkout.length === 0
  ) {

    alert(
      "まずトレーニングを追加してください"
    );

    return;

  }


  const date =
    document.getElementById(
      "trainingDate"
    ).value;


  if (!date) {

    alert(
      "トレーニング日を選択してください"
    );

    return;

  }


  const workout = {

    type:
      "fullWorkout",

    date:
      date,

    exercises:
      currentWorkout

  };


  records.unshift(
    workout
  );


  saveData();


  renderRecords();


  currentWorkout = [];

  currentSets = [];


  renderWorkoutPreview();

  renderCurrentSets();


  document.getElementById(
    "exercise"
  ).value = "";


  document.getElementById(
    "weight"
  ).value = "";


  document.getElementById(
    "reps"
  ).value = "";


  document.getElementById(
    "previousRecord"
  ).style.display =
    "none";


  alert(
    "トレーニングを保存しました！"
  );

}


// ========================================
// 履歴表示
// ========================================

function renderRecords() {

  const area =
    document.getElementById(
      "records"
    );


  area.innerHTML = "";


  if (
    records.length === 0
  ) {

    area.innerHTML = `

      <div class="empty">
        まだ記録がありません
      </div>

    `;

    return;

  }


  const sorted =
    [...records].sort(
      (a, b) => {

        return String(b.date || "")
          .localeCompare(
            String(a.date || "")
          );

      }
    );


  sorted.forEach(
    workout => {

      // 新しい形式
      if (
        workout.type === "fullWorkout"
      ) {

        let html = `

          <div class="record">

            <div class="record-date">
              ${formatDate(workout.date)}
            </div>

        `;


        if (
          Array.isArray(
            workout.exercises
          )
        ) {

          workout.exercises.forEach(
            exercise => {

              html += `

                <div class="record-exercise">

                  <div class="record-exercise-name">
                    ${exercise.exercise}
                  </div>

                  <div class="record-sets">

              `;


              exercise.sets.forEach(
                (set, index) => {

                  html +=
                    `セット ${index + 1}：
                    ${set.weight} kg ×
                    ${set.reps} 回<br>`;

                }
              );


              html += `

                  </div>

                </div>

              `;

            }
          );

        }


        html += `
          </div>
        `;


        area.innerHTML +=
          html;

      }


      // 以前の複数セット形式
      else if (
        workout.type === "workout"
      ) {

        let html = `

          <div class="record">

            <div class="record-date">
              ${formatDate(workout.date)}
            </div>

            <div class="record-exercise-name">
              ${workout.exercise}
            </div>

            <div class="record-sets">

        `;


        if (
          Array.isArray(
            workout.sets
          )
        ) {

          workout.sets.forEach(
            (set, index) => {

              html +=
                `セット ${index + 1}：
                ${set.weight} kg ×
                ${set.reps} 回<br>`;

            }
          );

        }


        html += `

            </div>

          </div>

        `;


        area.innerHTML +=
          html;

      }


      // STEP 0形式
      else {

        let html = `

          <div class="record">

            <div class="record-date">
              ${formatDate(workout.date)}
            </div>

            <div class="record-exercise-name">
              ${workout.exercise}
            </div>

            <div class="record-sets">
              ${workout.weight}
              kg ×
              ${workout.reps}
              回
            </div>

          </div>

        `;


        area.innerHTML +=
          html;

      }

    }
  );

}


// ========================================
// 初期化
// ========================================

document.getElementById(
  "trainingDate"
).value =
  getToday();


loadData();

renderRecords();

</script>

</body>
</html>
