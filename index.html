<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BODY CARE AI</title>

<style>
:root{
  --bg:#080b0e;
  --card:#12171c;
  --input:#0c1014;
  --line:#293139;
  --text:#f4f6f8;
  --sub:#929ba5;
  --muted:#626b75;
  --green:#32d47f;
  --green-dark:#20b568;
  --red:#ff5555;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top,#111820 0%,#080b0e 42%);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
  min-height:100vh;
}

button,
input,
select{
  font-family:inherit;
}

.container{
  max-width:680px;
  margin:0 auto;
  padding:22px 16px 110px;
}

/* =========================
   HEADER
========================= */

.header{
  text-align:center;
  padding:10px 0 22px;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:1.5px;
}

.header-title{
  margin-top:5px;
  font-size:14px;
  color:var(--sub);
  letter-spacing:.5px;
}

/* =========================
   CARD
========================= */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.22);
}

.card-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:16px;
}

label{
  display:block;
  color:var(--sub);
  font-size:13px;
  font-weight:700;
  margin:16px 0 8px;
}

label:first-child{
  margin-top:0;
}

input,
select{
  width:100%;
  padding:14px;
  font-size:17px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--input);
  color:var(--text);
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--green);
  box-shadow:0 0 0 2px rgba(50,212,127,.12);
}

input::placeholder{
  color:var(--muted);
}

select option{
  background:#11161b;
  color:#fff;
}

/* =========================
   INPUT ROW
========================= */

.input-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.input-group label{
  margin-top:0;
}

/* =========================
   BUTTON
========================= */

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:12px;
  background:var(--green);
  color:#06120b;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

button:hover{
  background:var(--green-dark);
}

.complete-button{
  background:#20282e;
  color:var(--text);
  border:1px solid var(--line);
  margin-top:18px;
}

.complete-button:hover{
  background:#293239;
}

.save-button{
  margin-top:18px;
}

.delete-button{
  background:var(--red);
  color:#fff;
}

.delete-button:hover{
  background:#e84444;
}

/* =========================
   CURRENT SETS
========================= */

.set-list{
  margin-top:16px;
}

.set-item{
  display:grid;
  grid-template-columns:60px 1fr 60px;
  align-items:center;
  gap:8px;
  border-top:1px solid var(--line);
  padding:12px 0;
  font-size:15px;
}

.set-number{
  color:var(--green);
  font-weight:900;
}

.set-value{
  color:var(--text);
}

.set-delete{
  width:60px !important;
  min-width:60px !important;
  margin:0 !important;
  padding:8px 5px !important;
  background:rgba(255,85,85,.14) !important;
  border:1px solid rgba(255,85,85,.35) !important;
  color:var(--red) !important;
  font-size:12px !important;
}

.set-delete:hover{
  background:rgba(255,85,85,.25) !important;
}

/* =========================
   PREVIOUS
========================= */

.previous-card{
  background:#0d1318;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin-top:16px;
}

.previous-title{
  font-size:16px;
  font-weight:900;
  color:var(--green);
  margin-bottom:7px;
}

.previous-date{
  color:var(--sub);
  font-size:13px;
  margin-bottom:9px;
}

.previous-set{
  color:var(--text);
  font-size:14px;
  line-height:1.8;
}

.previous-total{
  font-weight:800;
  margin-top:8px;
  padding-top:9px;
  border-top:1px solid var(--line);
}

.one-rm{
  color:var(--sub);
  font-size:13px;
  line-height:1.7;
}

.one-rm-best{
  color:var(--green);
  font-weight:800;
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid var(--line);
}

/* =========================
   TODAY
========================= */

.today-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
}

.today-title{
  font-size:20px;
  font-weight:900;
  margin-bottom:16px;
}

.today-empty{
  color:var(--muted);
  text-align:center;
  padding:20px 0;
}

.today-exercise{
  border-top:1px solid var(--line);
  padding:16px 0;
}

.today-exercise:first-child{
  border-top:0;
  padding-top:0;
}

.today-exercise-name{
  font-size:19px;
  font-weight:900;
  margin-bottom:5px;
}

.today-exercise-summary{
  color:var(--sub);
  font-size:13px;
  margin-bottom:8px;
}

.today-set{
  color:#d9dee3;
  font-size:14px;
  line-height:1.8;
}

.today-exercise-total{
  font-size:14px;
  font-weight:800;
  margin-top:9px;
  padding-top:9px;
  border-top:1px solid var(--line);
}

.comparison-box{
  background:#0b1115;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  margin-top:12px;
}

.comparison-title{
  color:var(--green);
  font-weight:900;
  margin-bottom:6px;
}

.comparison-line{
  color:var(--sub);
  font-size:13px;
  line-height:1.8;
}

.comparison-up{
  color:var(--green);
  font-weight:900;
}

.comparison-down{
  color:var(--red);
  font-weight:900;
}

.comparison-same{
  color:var(--sub);
  font-weight:900;
}

/* =========================
   TOTAL
========================= */

.total-card{
  background:
    linear-gradient(145deg,#17231d,#101713);
  border:1px solid rgba(50,212,127,.25);
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  text-align:center;
}

.total-label{
  color:var(--sub);
  font-size:13px;
}

.total-number{
  color:var(--green);
  font-size:38px;
  font-weight:900;
  margin-top:3px;
}

.total-unit{
  color:var(--sub);
  font-size:16px;
  font-weight:700;
}

/* =========================
   HISTORY
========================= */

.record{
  border-top:1px solid var(--line);
  padding:18px 0;
}

.record:first-child{
  border-top:0;
  padding-top:0;
}

.date-title{
  font-size:19px;
  font-weight:900;
  margin-bottom:8px;
}

.workout-title{
  color:var(--green);
  font-size:13px;
  font-weight:900;
  margin-bottom:10px;
}

.exercise{
  font-size:17px;
  font-weight:900;
  margin-top:16px;
  margin-bottom:7px;
}

.details{
  color:var(--sub);
  font-size:14px;
  line-height:1.8;
}

.exercise-total{
  color:var(--text);
  font-weight:800;
  margin-top:4px;
}

.day-total{
  color:var(--green);
  font-size:17px;
  font-weight:900;
  margin-top:17px;
  padding-top:13px;
  border-top:1px solid var(--line);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:22px 0;
}

/* =========================
   ROADMAP
========================= */

.roadmap{
  background:#0d1318;
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
  margin-top:16px;
}

.roadmap-title{
  font-size:14px;
  font-weight:900;
  color:var(--green);
  margin-bottom:8px;
}

.roadmap-item{
  color:var(--sub);
  font-size:12px;
  line-height:1.8;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:min(650px,calc(100% - 24px));
  background:rgba(18,23,28,.94);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);
  border-radius:18px;
  padding:7px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  z-index:100;
  box-shadow:0 12px 35px rgba(0,0,0,.45);
}

.nav-button{
  margin:0;
  padding:9px 5px;
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

.nav-button.active{
  background:rgba(50,212,127,.12);
  color:var(--green);
}

.section{
  scroll-margin-top:15px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:430px){

  .container{
    padding-left:12px;
    padding-right:12px;
  }

  .card,
  .today-card{
    padding:15px;
  }

  .input-row{
    gap:8px;
  }

  input,
  select{
    padding:13px 11px;
    font-size:16px;
  }

  .set-item{
    grid-template-columns:52px 1fr 58px;
  }

  .total-number{
    font-size:34px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">
    <div class="logo">BODY CARE AI</div>
    <div class="header-title">
      Training Log
    </div>
    <div class="header-title">
      今日の身体を、未来の能力へ。
    </div>
  </header>


  <!-- =========================
       記録
  ========================== -->

  <section id="recordSection" class="section">

    <div class="card">

      <div class="card-title">
        トレーニングを記録
      </div>

      <label for="trainingDate">
        トレーニング日
      </label>

      <input
        type="date"
        id="trainingDate"
      >


      <label for="exercise">
        種目
      </label>

      <select id="exercise">

        <option value="">
          種目を選択してください
        </option>

        <option value="ベンチプレス">
          ベンチプレス
        </option>

        <option value="スクワット">
          スクワット
        </option>

        <option value="デッドリフト">
          デッドリフト
        </option>

        <option value="RDL">
          RDL
        </option>

        <option value="ラットプルダウン">
          ラットプルダウン
        </option>

        <option value="懸垂">
          懸垂
        </option>

        <option value="レッグプレス">
          レッグプレス
        </option>

        <option value="ショルダープレス">
          ショルダープレス
        </option>

        <option value="サイドレイズ">
          サイドレイズ
        </option>

        <option value="ペックフライ">
          ペックフライ
        </option>

        <option value="フェイスプル">
          フェイスプル
        </option>

      </select>


      <!-- 前回記録 -->

      <div
        id="previousRecord"
        class="previous-card"
        style="display:none"
      ></div>


      <!-- 重量・回数 -->

      <div class="input-row">

        <div class="input-group">

          <label for="weight">
            重量（kg）
          </label>

          <input
            type="number"
            id="weight"
            placeholder="70"
            inputmode="decimal"
            step="0.5"
            autocomplete="off"
          >

        </div>


        <div class="input-group">

          <label for="reps">
            回数
          </label>

          <input
            type="number"
            id="reps"
            placeholder="8"
            inputmode="numeric"
            autocomplete="off"
          >

        </div>

      </div>


      <button
        type="button"
        onclick="addSet()"
      >
        セットを追加
      </button>


      <!-- 現在入力中 -->

      <div
        class="set-list"
        id="currentSets"
      ></div>


      <button
        type="button"
        class="complete-button"
        onclick="completeExercise()"
      >
        この種目を完了
      </button>


      <div class="roadmap">

        <div class="roadmap-title">
          BODY CARE AI
        </div>

        <div class="roadmap-item">
          現在：トレーニング記録
        </div>

        <div class="roadmap-item">
          次：今日の状態 → 過去比較 → 自己ベスト → 分析
        </div>

        <div class="roadmap-item">
          最終：身体・食事・睡眠・活動量を統合したAI判断
        </div>

      </div>

    </div>

  </section>


  <!-- =========================
       今日
  ========================== -->

  <section id="todaySection" class="section">

    <div class="today-card">

      <div
        class="today-title"
        id="todayTitle"
      >
        今日のトレーニング
      </div>

      <div id="todayExercises">

        <div class="today-empty">
          まだ完了した種目はありません
        </div>

      </div>

      <button
        type="button"
        class="save-button"
        onclick="saveTodayWorkout()"
      >
        この日のトレーニングを保存
      </button>

    </div>


    <div class="total-card">

      <div class="total-label">
        今日の総負荷
      </div>

      <div class="total-number">

        <span id="todayTotalLoad">
          0
        </span>

        <span class="total-unit">
          kg
        </span>

      </div>

    </div>

  </section>


  <!-- =========================
       履歴
  ========================== -->

  <section id="historySection" class="section">

    <div class="card">

      <div class="card-title">
        トレーニング履歴
      </div>

      <div id="history">

        <div class="empty">
          まだ記録がありません
        </div>

      </div>

    </div>

  </section>

</div>


<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">

  <button
    type="button"
    class="nav-button active"
    data-target="recordSection"
  >
    記録
  </button>

  <button
    type="button"
    class="nav-button"
    data-target="todaySection"
  >
    今日
  </button>

  <button
    type="button"
    class="nav-button"
    data-target="historySection"
  >
    履歴
  </button>

  <button
    type="button"
    class="nav-button"
    data-target="analysisSection"
  >
    分析
  </button>

</nav>


<script>

/* ==================================================
   BODY CARE AI
   STEP 5
   入力速度改善版

   ・トレーニング日
   ・複数種目
   ・複数セット
   ・セット削除
   ・前回記録
   ・推定1RM
   ・今日の総負荷
   ・履歴
   ・入力速度改善
================================================== */


/* =========================
   状態
========================= */

let currentSets = [];

let currentExercises = [];


/* =========================
   保存先
========================= */

const STORAGE_KEY =
  "trainingHistory";


/* =========================
   今日の日付
========================= */

function getToday(){

  const now = new Date();

  return (
    now.getFullYear() +
    "-" +
    String(now.getMonth()+1).padStart(2,"0") +
    "-" +
    String(now.getDate()).padStart(2,"0")
  );

}


/* =========================
   日付表示
========================= */

function formatDate(dateString){

  const parts =
    dateString.split("-");

  if(parts.length !== 3){
    return dateString;
  }

  return (
    parts[0] +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* =========================
   履歴取得
========================= */

function getHistory(){

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );

  if(!saved){
    return [];
  }

  try{

    const data =
      JSON.parse(saved);

    return Array.isArray(data)
      ? data
      : [];

  }catch(error){

    return [];

  }

}


/* =========================
   履歴保存
========================= */

function saveHistory(history){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(history)
  );

}


/* =========================
   総負荷
========================= */

function calculateExerciseLoad(sets){

  return (sets || []).reduce(
    (total,set)=>{

      return (
        total +
        Number(set.weight || 0) *
        Number(set.reps || 0)
      );

    },
    0
  );

}


/* =========================
   推定1RM
   Epley式
========================= */

function calculateEstimated1RM(
  weight,
  reps
){

  weight =
    Number(weight || 0);

  reps =
    Number(reps || 0);

  if(
    weight <= 0 ||
    reps <= 0
  ){

    return 0;

  }

  return (
    weight *
    (1 + reps / 30)
  );

}


/* =========================
   種目内の最高推定1RM
========================= */

function getBestEstimated1RM(
  sets
){

  if(
    !sets ||
    sets.length === 0
  ){

    return 0;

  }

  return Math.max(
    ...sets.map(
      set =>
        calculateEstimated1RM(
          set.weight,
          set.reps
        )
    )
  );

}


/* =========================
   前回記録検索
========================= */

function findPreviousRecord(
  exerciseName,
  selectedDate
){

  const history =
    getHistory();

  const previousDays =
    history
      .filter(
        record =>
          record.date <
          selectedDate
      )
      .sort(
        (a,b)=>
          b.date.localeCompare(
            a.date
          )
      );

  for(
    const day
    of previousDays
  ){

    const exercise =
      (day.exercises || [])
        .find(
          item =>
            item.exercise ===
            exerciseName
        );

    if(exercise){

      return {
        date:day.date,
        exercise:exercise
      };

    }

  }

  return null;

}


/* =========================
   前回記録表示
========================= */

function updatePreviousRecord(){

  const exerciseName =
    document
      .getElementById("exercise")
      .value;

  const selectedDate =
    document
      .getElementById("trainingDate")
      .value;

  const area =
    document
      .getElementById(
        "previousRecord"
      );


  if(
    !exerciseName ||
    !selectedDate
  ){

    area.style.display =
      "none";

    area.innerHTML =
      "";

    return;

  }


  const previous =
    findPreviousRecord(
      exerciseName,
      selectedDate
    );


  area.style.display =
    "block";


  if(!previous){

    area.innerHTML = `
      <div class="previous-title">
        前回の記録
      </div>

      <div class="previous-date">
        ${exerciseName}の前回記録はありません
      </div>
    `;

    return;

  }


  let setsHTML = "";


  (previous.exercise.sets || [])
    .forEach(
      (set,index)=>{

        setsHTML += `
          <div class="previous-set">
            セット ${index+1}：
            ${set.weight} kg ×
            ${set.reps} 回
          </div>

          <div class="one-rm">
            推定1RM：約
            ${calculateEstimated1RM(
              set.weight,
              set.reps
            ).toFixed(1)}
            kg
          </div>
        `;

      }
    );


  const previousLoad =
    calculateExerciseLoad(
      previous.exercise.sets || []
    );


  const previous1RM =
    getBestEstimated1RM(
      previous.exercise.sets || []
    );


  area.innerHTML = `

    <div class="previous-title">
      前回の記録
    </div>

    <div class="previous-date">
      ${formatDate(previous.date)}
    </div>

    ${setsHTML}

    <div class="previous-total">
      前回総負荷：
      ${previousLoad.toLocaleString()}
      kg
    </div>

    <div class="one-rm-best">
      前回の推定1RM：
      ${previous1RM.toFixed(1)}
      kg
    </div>

  `;

}


/* =========================
   今日の種目取得
========================= */

function getTodayExercises(){

  const date =
    document
      .getElementById(
        "trainingDate"
      )
      .value;

  const history =
    getHistory();

  const savedRecord =
    history.find(
      record =>
        record.date === date
    );

  const savedExercises =
    savedRecord
      ? (
        savedRecord.exercises ||
        []
      )
      : [];

  return [
    ...savedExercises,
    ...currentExercises
  ];

}


/* =========================
   セット追加
========================= */

function addSet(){

  const exercise =
    document
      .getElementById(
        "exercise"
      )
      .value;

  const weight =
    document
      .getElementById(
        "weight"
      )
      .value;

  const reps =
    document
      .getElementById(
        "reps"
      )
      .value;


  if(
    !exercise ||
    weight === "" ||
    reps === ""
  ){

    alert(
      "種目・重量・回数をすべて入力してください"
    );

    return;

  }


  if(
    currentSets.length > 0 &&
    currentSets[0].exercise !==
      exercise
  ){

    alert(
      "先に「この種目を完了」を押してください"
    );

    return;

  }


  const weightNumber =
    Number(weight);

  const repsNumber =
    Number(reps);


  if(
    !Number.isFinite(
      weightNumber
    ) ||
    !Number.isFinite(
      repsNumber
    ) ||
    weightNumber < 0 ||
    repsNumber <= 0
  ){

    alert(
      "重量と回数を正しく入力してください"
    );

    return;

  }


  currentSets.push({

    exercise:
      exercise,

    weight:
      weightNumber,

    reps:
      repsNumber

  });


  renderCurrentSets();

  updateTodayTotal();


  document
    .getElementById("weight")
    .value = "";

  document
    .getElementById("reps")
    .value = "";


  /* STEP 5
     次のセットをすぐ入力できる */

  document
    .getElementById("weight")
    .focus();

}


/* =========================
   セット削除
========================= */

function deleteCurrentSet(index){

  if(
    index < 0 ||
    index >= currentSets.length
  ){

    return;

  }


  currentSets.splice(
    index,
    1
  );


  renderCurrentSets();

  updateTodayTotal();

}


/* =========================
   入力中セット表示
========================= */

function renderCurrentSets(){

  const area =
    document
      .getElementById(
        "currentSets"
      );

  area.innerHTML = "";


  currentSets.forEach(
    (set,index)=>{

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "set-item";


      item.innerHTML = `

        <span class="set-number">
          SET ${index+1}
        </span>

        <span class="set-value">
          ${set.weight} kg ×
          ${set.reps} 回
          <div class="one-rm">
            推定1RM：
            ${calculateEstimated1RM(
              set.weight,
              set.reps
            ).toFixed(1)}
            kg
          </div>
        </span>

        <button
          type="button"
          class="set-delete"
          onclick="deleteCurrentSet(${index})"
        >
          削除
        </button>

      `;


      area.appendChild(item);

    }
  );

}


/* =========================
   種目完了
========================= */

function completeExercise(){

  if(
    currentSets.length === 0
  ){

    alert(
      "まずセットを追加してください"
    );

    return;

  }


  const exercise =
    currentSets[0].exercise;


  const sets =
    currentSets.map(
      set=>({

        weight:
          set.weight,

        reps:
          set.reps

      })
    );


  currentExercises.push({

    exercise:
      exercise,

    sets:
      sets,

    totalLoad:
      calculateExerciseLoad(
        sets
      )

  });


  currentSets = [];


  renderCurrentSets();

  renderTodayExercises();

  updateTodayTotal();


  document
    .getElementById(
      "exercise"
    )
    .value = "";


  document
    .getElementById(
      "weight"
    )
    .value = "";


  document
    .getElementById(
      "reps"
    )
    .value = "";


  updatePreviousRecord();


  /* 次の種目をすぐ選択 */

  document
    .getElementById(
      "exercise"
    )
    .focus();

}


/* =========================
   今日の表示
========================= */

function renderTodayExercises(){

  const area =
    document
      .getElementById(
        "todayExercises"
      );


  const selectedDate =
    document
      .getElementById(
        "trainingDate"
      )
      .value;


  const exercises =
    getTodayExercises();


  const isToday =
    selectedDate ===
    getToday();


  document
    .getElementById(
      "todayTitle"
    )
    .textContent =
      isToday
        ? "今日のトレーニング"
        : `${formatDate(selectedDate)}のトレーニング`;


  if(
    exercises.length === 0
  ){

    area.innerHTML = `
      <div class="today-empty">
        まだ完了した種目はありません
      </div>
    `;

    return;

  }


  let html = "";


  exercises.forEach(
    exercise=>{

      const sets =
        exercise.sets || [];

      const load =
        calculateExerciseLoad(
          sets
        );


      const previous =
        findPreviousRecord(
          exercise.exercise,
          selectedDate
        );


      html += `

        <div class="today-exercise">

          <div class="today-exercise-name">
            ${exercise.exercise}
          </div>

          <div class="today-exercise-summary">
            ${sets.length}セット
          </div>

      `;


      sets.forEach(
        (set,index)=>{

          html += `

            <div class="today-set">
              SET ${index+1}：
              ${set.weight} kg ×
              ${set.reps} 回
            </div>

            <div class="one-rm">
              推定1RM：
              ${calculateEstimated1RM(
                set.weight,
                set.reps
              ).toFixed(1)}
              kg
            </div>

          `;

        }
      );


      html += `

          <div class="today-exercise-total">
            種目総負荷：
            ${load.toLocaleString()}
            kg
          </div>

          <div class="one-rm-best">
            今回の推定1RM：
            ${getBestEstimated1RM(
              sets
            ).toFixed(1)}
            kg
          </div>

      `;


      /* =========================
         前回比較
      ========================= */

      if(previous){

        const previousLoad =
          calculateExerciseLoad(
            previous.exercise.sets || []
          );


        const current1RM =
          getBestEstimated1RM(
            sets
          );

        const previous1RM =
          getBestEstimated1RM(
            previous.exercise.sets || []
          );


        const difference =
          load - previousLoad;


        const percent =
          previousLoad > 0
            ? (
              difference /
              previousLoad
            ) * 100
            : 0;


        const rmDifference =
          current1RM -
          previous1RM;


        let comparisonClass =
          "comparison-same";


        if(difference > 0){
          comparisonClass =
            "comparison-up";
        }

        if(difference < 0){
          comparisonClass =
            "comparison-down";
        }


        const sign =
          difference > 0
            ? "+"
            : "";


        const rmSign =
          rmDifference >= 0
            ? "+"
            : "";


        html += `

          <div class="comparison-box">

            <div class="comparison-title">
              前回との比較
            </div>

            <div class="comparison-line">
              前回：
              ${formatDate(previous.date)}
            </div>

            <div class="comparison-line">
              前回総負荷：
              ${previousLoad.toLocaleString()}
              kg
            </div>

            <div class="comparison-line">
              今回総負荷：
              ${load.toLocaleString()}
              kg
            </div>

            <div class="comparison-line ${comparisonClass}">
              前回比：
              ${sign}${difference.toLocaleString()}
              kg
              （${sign}${percent.toFixed(1)}%）
            </div>

            <div class="comparison-line">
              推定1RM：
              前回
              ${previous1RM.toFixed(1)}
              kg →
              今回
              ${current1RM.toFixed(1)}
              kg
              （${rmSign}${rmDifference.toFixed(1)} kg）
            </div>

          </div>

        `;

      }


      html += `

        </div>

      `;

    }
  );


  area.innerHTML =
    html;

}


/* =========================
   今日の総負荷
========================= */

function updateTodayTotal(){

  const exercises =
    getTodayExercises();


  let total = 0;


  exercises.forEach(
    exercise=>{

      total +=
        calculateExerciseLoad(
          exercise.sets || []
        );

    }
  );


  /* 現在入力中のセット */

  if(
    currentSets.length > 0
  ){

    total +=
      calculateExerciseLoad(
        currentSets
      );

  }


  document
    .getElementById(
      "todayTotalLoad"
    )
    .textContent =
      total.toLocaleString();

}


/* =========================
   保存
========================= */

function saveTodayWorkout(){

  const date =
    document
      .getElementById(
        "trainingDate"
      )
      .value;


  if(!date){

    alert(
      "トレーニング日を選択してください"
    );

    return;

  }


  if(
    currentSets.length > 0
  ){

    completeExercise();

  }


  if(
    currentExercises.length === 0
  ){

    const history =
      getHistory();

    const existing =
      history.find(
        record =>
          record.date === date
      );


    if(
      !existing ||
      !existing.exercises ||
      existing.exercises.length === 0
    ){

      alert(
        "まずトレーニングを入力してください"
      );

      return;

    }


    renderTodayExercises();

    updateTodayTotal();

    renderHistory();

    return;

  }


  const history =
    getHistory();


  let dayRecord =
    history.find(
      record =>
        record.date === date
    );


  if(dayRecord){

    dayRecord.exercises.push(
      ...currentExercises
    );

  }else{

    dayRecord = {

      date:
        date,

      exercises:
        [...currentExercises]

    };

    history.unshift(
      dayRecord
    );

  }


  saveHistory(history);


  currentExercises = [];

  currentSets = [];


  renderCurrentSets();

  renderTodayExercises();

  updateTodayTotal();

  renderHistory();


  document
    .getElementById(
      "exercise"
    )
    .value = "";


  document
    .getElementById(
      "weight"
    )
    .value = "";


  document
    .getElementById(
      "reps"
    )
    .value = "";


  updatePreviousRecord();


  alert(
    "トレーニングを保存しました"
  );

}


/* =========================
   履歴表示
========================= */

function renderHistory(){

  const area =
    document
      .getElementById(
        "history"
      );


  const history =
    getHistory();


  area.innerHTML = "";


  if(
    history.length === 0
  ){

    area.innerHTML = `
      <div class="empty">
        まだ記録がありません
      </div>
    `;

    return;

  }


  history
    .sort(
      (a,b)=>
        b.date.localeCompare(
          a.date
        )
    )
    .forEach(
      record=>{

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "record";


        let exercisesHTML =
          "";

        let dayTotal = 0;


        (record.exercises || [])
          .forEach(
            exercise=>{

              const sets =
                exercise.sets || [];


              const exerciseLoad =
                calculateExerciseLoad(
                  sets
                );


              dayTotal +=
                exerciseLoad;


              let setsHTML =
                "";


              sets.forEach(
                (set,index)=>{

                  setsHTML += `

                    SET ${index+1}：
                    ${set.weight} kg ×
                    ${set.reps} 回

                    <br>

                    <span class="one-rm">
                      推定1RM：
                      ${calculateEstimated1RM(
                        set.weight,
                        set.reps
                      ).toFixed(1)}
                      kg
                    </span>

                    <br>

                  `;

                }
              );


              exercisesHTML += `

                <div class="exercise">
                  ${exercise.exercise}
                </div>

                <div class="details">

                  ${setsHTML}

                  <div class="exercise-total">
                    種目総負荷：
                    ${exerciseLoad.toLocaleString()}
                    kg
                  </div>

                  <div class="one-rm-best">
                    推定1RM：
                    ${getBestEstimated1RM(
                      sets
                    ).toFixed(1)}
                    kg
                  </div>

                </div>

              `;

            }
          );


        item.innerHTML = `

          <div class="date-title">
            ${formatDate(record.date)}
          </div>

          <div class="workout-title">
            TRAINING
          </div>

          ${exercisesHTML}

          <div class="day-total">
            1日の総負荷：
            ${dayTotal.toLocaleString()}
            kg
          </div>

          <button
            type="button"
            class="delete-button"
            onclick="deleteWorkout('${record.date}')"
          >
            この記録を削除
          </button>

        `;


        area.appendChild(
          item
        );

      }
    );

}


/* =========================
   日単位削除
========================= */

function deleteWorkout(date){

  const ok =
    confirm(
      `${formatDate(date)}のトレーニング記録を削除しますか？`
    );


  if(!ok){
    return;
  }


  let history =
    getHistory();


  history =
    history.filter(
      record =>
        record.date !== date
    );


  saveHistory(history);


  renderHistory();

  renderTodayExercises();

  updateTodayTotal();

  updatePreviousRecord();

}

   STEP 5

================================================== */

   重量 Enter
   ↓
   回数へ
========================= */

  .getElementById("weight")
  .addEventListener(
    "keydown",

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        document
          .getElementById(
            "reps"
          )
          .focus();

      }

    }
  );


/* =========================
   回数 Enter
   ↓
   セット追加
========================= */

document
  .getElementById("reps")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        addSet();

      }

    }
  );

   種目変更
========================= */

document
  .getElementById("exercise")
  .addEventListener(
    "change",
    function(){

      currentSets = [];

      renderCurrentSets();

      updatePreviousRecord();

      updateTodayTotal();

    }
  );


/* =========================
   日付変更
========================= */

document
  .getElementById("trainingDate")
  .addEventListener(
    "change",

      currentSets = [];

      currentExercises = [];

      renderCurrentSets();

      renderTodayExercises();

      updateTodayTotal();

      updatePreviousRecord();

    }
  );


/* =========================
   ナビゲーション
========================= */

document
  .querySelectorAll(
    ".nav-button"
  )
  .forEach(
    button=>{

      button.addEventListener(
        "click",
        function(){

          const target =
            document.getElementById(
              button.dataset.target
            );


          if(!target){
            return;
          }


          target.scrollIntoView({
            behavior:"smooth",
            block:"start"
          });


          document
            .querySelectorAll(
              ".nav-button"
            )
            .forEach(
              nav =>
                nav.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );

        }
      );

    }
  );

document
