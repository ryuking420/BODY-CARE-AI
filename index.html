<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>BODY CARE AI</title>

<style>

/* =========================================================
   BODY CARE AI
   VISUAL V1
========================================================= */

:root{
  --bg:#0b0d10;
  --bg2:#11151a;
  --card:#15191f;
  --card2:#1b2027;
  --line:#2a3038;

  --text:#f5f7fa;
  --sub:#9ba3ad;
  --muted:#6f7781;

  --accent:#35d07f;
  --accent2:#20b968;

  --danger:#ff4545;

  --radius:18px;
  --radius-small:12px;
}


/* =========================================================
   BASE
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  padding:0;
  background:
    radial-gradient(
      circle at top,
      #182029 0%,
      var(--bg) 42%
    );
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  min-height:100vh;
}


/* =========================================================
   CONTAINER
========================================================= */

.container{
  width:100%;
  max-width:620px;

  margin:0 auto;

  padding:
    calc(20px + env(safe-area-inset-top))
    16px
    calc(40px + env(safe-area-inset-bottom));
}


/* =========================================================
   HEADER
========================================================= */

.header{
  padding:12px 4px 26px;
}

.logo{
  font-size:13px;
  font-weight:800;
  letter-spacing:3px;
  color:var(--accent);
  margin-bottom:8px;
}

.app-title{
  margin:0;
  font-size:32px;
  line-height:1.1;
  font-weight:900;
  letter-spacing:-1px;
}

.app-subtitle{
  margin-top:8px;
  color:var(--sub);
  font-size:14px;
}


/* =========================================================
   CARD
========================================================= */

.card{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  border:1px solid rgba(255,255,255,.07);

  border-radius:var(--radius);

  padding:20px;

  margin-bottom:16px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.28);

  backdrop-filter:blur(12px);
}


/* =========================================================
   SECTION TITLE
========================================================= */

.section-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:18px;
}

.section-title{
  margin:0;

  font-size:18px;
  font-weight:800;

  letter-spacing:-.3px;
}

.section-label{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}


/* =========================================================
   LABEL
========================================================= */

label{
  display:block;

  margin:
    18px 0
    8px;

  color:var(--sub);

  font-size:13px;
  font-weight:700;

  letter-spacing:.3px;
}

label:first-child{
  margin-top:0;
}


/* =========================================================
   INPUT
========================================================= */

select,
input{
  width:100%;

  height:56px;

  padding:
    0 15px;

  border:
    1px solid var(--line);

  border-radius:13px;

  background:#0e1216;

  color:var(--text);

  font-size:17px;
  font-weight:600;

  outline:none;

  transition:
    border-color .2s,
    box-shadow .2s;
}

input::placeholder{
  color:#555d66;
}

select:focus,
input:focus{
  border-color:var(--accent);

  box-shadow:
    0 0 0 3px
    rgba(53,208,127,.12);
}


/* =========================================================
   BUTTON
========================================================= */

button{
  width:100%;

  min-height:54px;

  margin-top:14px;

  padding:0 18px;

  border:none;
  border-radius:13px;

  background:#242a31;

  color:#fff;

  font-size:16px;
  font-weight:800;

  cursor:pointer;

  transition:
    transform .12s,
    opacity .12s,
    background .2s;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.4;
}


/* =========================================================
   PRIMARY BUTTON
========================================================= */

#addSetButton{
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  color:#06130b;

  box-shadow:
    0 7px 20px
    rgba(53,208,127,.16);
}


/* =========================================================
   COMPLETE
========================================================= */

.complete-button{
  margin-top:18px;

  background:#252b32;

  color:#fff;
}

.complete-button:not(:disabled){
  border:1px solid #3b444d;
}


/* =========================================================
   SAVE
========================================================= */

.save-button{
  background:
    linear-gradient(
      135deg,
      #252c34,
      #1b2026
    );

  border:1px solid #343b44;
}


/* =========================================================
   PREVIOUS RECORD
========================================================= */

.previous-card{
  margin-top:18px;

  padding:17px;

  border-radius:14px;

  background:#101419;

  border:1px solid #252c34;
}

.previous-title{
  color:var(--accent);

  font-size:14px;
  font-weight:800;

  margin-bottom:6px;
}

.previous-date{
  color:var(--sub);

  font-size:13px;

  margin-bottom:12px;
}

.previous-set{
  font-size:15px;
  line-height:1.7;

  color:#dce1e6;
}

.previous-total{
  margin-top:12px;
  padding-top:12px;

  border-top:1px solid var(--line);

  font-weight:800;
}

.one-rm{
  color:var(--muted);

  font-size:13px;

  line-height:1.6;
}

.one-rm-best{
  margin-top:10px;
  padding-top:10px;

  border-top:1px solid var(--line);

  color:var(--accent);

  font-size:14px;
  font-weight:800;
}


/* =========================================================
   CURRENT SETS
========================================================= */

.set-list{
  margin-top:20px;
}

.set-list-title{
  color:var(--sub);

  font-size:12px;
  font-weight:700;

  letter-spacing:.4px;

  margin-bottom:8px;
}

.set-item{
  display:grid;

  grid-template-columns:
    70px
    1fr
    76px;

  align-items:center;

  gap:8px;

  min-height:58px;

  padding:9px 0;

  border-top:
    1px solid var(--line);
}

.set-number{
  color:var(--accent);

  font-size:14px;
  font-weight:900;
}

.set-value{
  color:var(--text);

  font-size:16px;
  font-weight:700;
}

.set-delete{
  width:76px !important;
  min-width:76px !important;

  height:40px !important;
  min-height:40px !important;

  margin:0 !important;

  padding:0 !important;

  border-radius:9px !important;

  background:
    rgba(255,69,69,.13) !important;

  border:
    1px solid rgba(255,69,69,.35) !important;

  color:#ff6666 !important;

  font-size:13px !important;
  font-weight:800 !important;
}

.set-delete:active{
  background:
    rgba(255,69,69,.25) !important;
}

.empty-sets{
  padding:10px 0;

  color:var(--muted);

  font-size:14px;
}


/* =========================================================
   TODAY
========================================================= */

.today-card{
  position:relative;

  background:
    linear-gradient(
      145deg,
      #171d23,
      #11151a
    );

  border:
    1px solid #303842;

  border-radius:22px;

  padding:21px;

  margin-bottom:16px;

  box-shadow:
    0 15px 40px rgba(0,0,0,.35);
}

.today-card::before{
  content:"";

  position:absolute;

  left:0;
  top:20px;

  width:3px;
  height:42px;

  background:var(--accent);

  border-radius:
    0 4px 4px 0;
}

.today-title{
  font-size:21px;
  font-weight:900;

  letter-spacing:-.5px;

  margin-bottom:20px;
}

.today-empty{
  color:var(--muted);

  font-size:14px;

  padding:10px 0;
}

.today-exercise{
  padding:18px 0;

  border-top:
    1px solid var(--line);
}

.today-exercise:first-child{
  border-top:none;
  padding-top:0;
}

.today-exercise-name{
  font-size:20px;
  font-weight:900;

  margin-bottom:4px;
}

.today-exercise-summary{
  color:var(--accent);

  font-size:13px;
  font-weight:800;

  margin-bottom:12px;
}

.today-set{
  color:#cbd1d7;

  font-size:14px;
  line-height:1.8;
}

.today-exercise-total{
  margin-top:12px;
  padding-top:12px;

  border-top:
    1px solid var(--line);

  color:#fff;

  font-size:14px;
  font-weight:800;
}


/* =========================================================
   COMPARISON
========================================================= */

.comparison-box{
  margin-top:14px;

  padding:14px;

  border-radius:12px;

  background:#0e1216;

  border:1px solid #252c34;
}

.comparison-title{
  color:#fff;

  font-size:13px;
  font-weight:900;

  margin-bottom:7px;
}

.comparison-line{
  color:var(--sub);

  font-size:13px;

  line-height:1.75;
}

.comparison-up{
  color:var(--accent) !important;

  font-weight:900;
}

.comparison-down{
  color:#ff6666 !important;

  font-weight:900;
}

.comparison-same{
  color:#d5d9dd !important;

  font-weight:800;
}


/* =========================================================
   TOTAL LOAD
========================================================= */

.total-card{
  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #18221d,
      #101612
    );

  border:
    1px solid
    rgba(53,208,127,.25);

  border-radius:20px;

  padding:22px;

  margin-bottom:16px;

  text-align:center;

  box-shadow:
    0 15px 40px rgba(0,0,0,.3);
}

.total-card::after{
  content:"";

  position:absolute;

  width:160px;
  height:160px;

  right:-80px;
  top:-80px;

  border-radius:50%;

  background:
    rgba(53,208,127,.08);
}

.total-label{
  position:relative;
  z-index:1;

  color:#91a097;

  font-size:12px;
  font-weight:700;

  letter-spacing:1px;
}

.total-number{
  position:relative;
  z-index:1;

  margin-top:5px;

  color:#fff;

  font-size:38px;
  font-weight:900;

  letter-spacing:-1px;
}

.total-unit{
  font-size:16px;

  font-weight:700;

  color:#91a097;
}


/* =========================================================
   HISTORY
========================================================= */

.record{
  padding:22px 0;

  border-top:
    1px solid var(--line);
}

.record:first-child{
  border-top:none;
}

.date-title{
  color:#fff;

  font-size:20px;
  font-weight:900;

  letter-spacing:-.4px;

  margin-bottom:5px;
}

.workout-title{
  color:var(--muted);

  font-size:12px;
  font-weight:700;

  margin-bottom:16px;
}

.exercise{
  margin-top:20px;
  margin-bottom:7px;

  color:#fff;

  font-size:18px;
  font-weight:900;
}

.details{
  color:#aeb6bf;

  font-size:14px;

  line-height:1.8;
}

.exercise-total{
  color:#fff;

  font-weight:800;

  margin-top:5px;
}

.day-total{
  margin-top:20px;
  padding-top:16px;

  border-top:
    1px solid var(--line);

  color:var(--accent);

  font-size:16px;
  font-weight:900;
}

.delete-button{
  background:
    rgba(255,69,69,.1);

  border:
    1px solid rgba(255,69,69,.3);

  color:#ff6666;

  font-size:14px;
}

.empty{
  padding:25px 0;

  text-align:center;

  color:var(--muted);

  font-size:14px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:420px){

  .container{
    padding-left:12px;
    padding-right:12px;
  }

  .card,
  .today-card{
    padding:17px;
  }

  .app-title{
    font-size:29px;
  }

  .set-item{
    grid-template-columns:
      62px
      1fr
      72px;
  }

  .set-delete{
    width:72px !important;
    min-width:72px !important;
  }

}


/* =========================================================
   SELECT ARROW
========================================================= */

select{
  appearance:none;

  background-image:
    linear-gradient(45deg,transparent 50%,#8b949e 50%),
    linear-gradient(135deg,#8b949e 50%,transparent 50%);

  background-position:
    calc(100% - 20px) 24px,
    calc(100% - 14px) 24px;

  background-size:
    6px 6px,
    6px 6px;

  background-repeat:no-repeat;
}

</style>
</head>


<body>

<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

  <div class="logo">
    BODY CARE AI
  </div>

  <h1 class="app-title">
    Training Log
  </h1>

  <div class="app-subtitle">
    今日の身体を、未来の能力へ。
  </div>

</div>


<!-- =====================================================
     INPUT
===================================================== -->

<div class="card">

  <div class="section-heading">

    <h2 class="section-title">
      トレーニング記録
    </h2>

    <div class="section-label">
      WORKOUT
    </div>

  </div>


  <label for="trainingDate">
    トレーニング日
  </label>

  <input
    type="date"
    id="trainingDate"
  >


  <label for="exercise">
    種目
  </label>

  <select id="exercise">

    <option value="">
      種目を選択してください
    </option>

    <option value="ベンチプレス">
      ベンチプレス
    </option>

    <option value="スクワット">
      スクワット
    </option>

    <option value="デッドリフト">
      デッドリフト
    </option>

    <option value="RDL">
      RDL
    </option>

    <option value="ラットプルダウン">
      ラットプルダウン
    </option>

    <option value="懸垂">
      懸垂
    </option>

    <option value="レッグプレス">
      レッグプレス
    </option>

    <option value="ショルダープレス">
      ショルダープレス
    </option>

    <option value="サイドレイズ">
      サイドレイズ
    </option>

    <option value="ペックフライ">
      ペックフライ
    </option>

    <option value="フェイスプル">
      フェイスプル
    </option>

  </select>


  <div
    id="previousRecord"
    class="previous-card"
    style="display:none"
  ></div>


  <label for="weight">
    重量（kg）
  </label>

  <input
    type="number"
    id="weight"
    placeholder="例：70"
    inputmode="decimal"
    step="0.5"
  >


  <label for="reps">
    回数
  </label>

  <input
    type="number"
    id="reps"
    placeholder="例：8"
    inputmode="numeric"
  >


  <button
    type="button"
    id="addSetButton"
  >
    ＋ セットを追加
  </button>


  <div
    class="set-list"
    id="currentSets"
  ></div>


  <button
    type="button"
    class="complete-button"
    id="completeExerciseButton"
  >
    この種目を完了
  </button>

</div>


<!-- =====================================================
     TODAY
===================================================== -->

<div class="today-card">

  <div
    class="today-title"
    id="todayTitle"
  >
    今日のトレーニング
  </div>


  <div id="todayExercises">

    <div class="today-empty">
      まだ完了した種目はありません
    </div>

  </div>


  <button
    type="button"
    class="save-button"
    id="saveTodayButton"
  >
    この日のトレーニングを保存
  </button>

</div>


<!-- =====================================================
     TOTAL
===================================================== -->

<div class="total-card">

  <div class="total-label">
    TODAY'S TOTAL LOAD
  </div>

  <div class="total-number">

    <span id="todayTotalLoad">
      0
    </span>

    <span class="total-unit">
      kg
    </span>

  </div>

</div>


<!-- =====================================================
     HISTORY
===================================================== -->

<div class="card">

  <div class="section-heading">

    <h2 class="section-title">
      トレーニング履歴
    </h2>

    <div class="section-label">
      HISTORY
    </div>

  </div>


  <div id="history">

    <div class="empty">
      まだ記録がありません
    </div>

  </div>

</div>


</div>


<script>

/* =========================================================
   DATA
========================================================= */

let currentSets = [];
let currentExercises = [];


/* =========================================================
   DATE
========================================================= */

function getToday(){

  const now = new Date();

  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;

}


function formatDate(dateString){

  const parts = dateString.split("-");

  if(parts.length !== 3){
    return dateString;
  }

  return `${parts[0]}年${Number(parts[1])}月${Number(parts[2])}日`;

}


/* =========================================================
   STORAGE
========================================================= */

function getHistory(){

  const saved =
    localStorage.getItem("trainingHistory");

  if(!saved){
    return [];
  }

  try{

    const data =
      JSON.parse(saved);

    return Array.isArray(data)
      ? data
      : [];

  }catch(error){

    return [];

  }

}


function saveHistory(history){

  localStorage.setItem(
    "trainingHistory",
    JSON.stringify(history)
  );

}


/* =========================================================
   LOAD
========================================================= */

function calculateExerciseLoad(sets){

  return (sets || []).reduce(

    (total,set) => {

      return total +
        Number(set.weight || 0) *
        Number(set.reps || 0);

    },

    0

  );

}


/* =========================================================
   1RM
========================================================= */

function calculateEstimated1RM(weight,reps){

  weight = Number(weight || 0);
  reps = Number(reps || 0);

  if(weight <= 0 || reps <= 0){
    return 0;
  }

  return weight * (1 + reps / 30);

}


function getBestEstimated1RM(sets){

  if(!sets || sets.length === 0){
    return 0;
  }

  return Math.max(

    ...sets.map(

      set =>
        calculateEstimated1RM(
          set.weight,
          set.reps
        )

    )

  );

}


/* =========================================================
   PREVIOUS
========================================================= */

function findPreviousRecord(
  exerciseName,
  selectedDate
){

  const history =
    getHistory();


  const previousDays =
    history

      .filter(
        record =>
          record.date < selectedDate
      )

      .sort(
        (a,b) =>
          b.date.localeCompare(a.date)
      );


  for(const day of previousDays){

    const exercise =
      (day.exercises || [])
        .find(
          item =>
            item.exercise === exerciseName
        );


    if(exercise){

      return {
        date:day.date,
        exercise:exercise
      };

    }

  }

  return null;

}


/* =========================================================
   COMPARISON
========================================================= */

function getComparison(
  exerciseName,
  currentSetsForExercise,
  selectedDate
){

  const previous =
    findPreviousRecord(
      exerciseName,
      selectedDate
    );


  if(!previous){
    return null;
  }


  const currentLoad =
    calculateExerciseLoad(
      currentSetsForExercise
    );


  const previousLoad =
    calculateExerciseLoad(
      previous.exercise.sets || []
    );


  const difference =
    currentLoad - previousLoad;


  const percent =
    previousLoad > 0
      ? difference / previousLoad * 100
      : 0;


  const currentMax =
    Math.max(
      ...(currentSetsForExercise || [])
        .map(
          set =>
            Number(set.weight || 0)
        ),
      0
    );


  const previousMax =
    Math.max(
      ...(previous.exercise.sets || [])
        .map(
          set =>
            Number(set.weight || 0)
        ),
      0
    );


  const maxDifference =
    currentMax - previousMax;


  const current1RM =
    getBestEstimated1RM(
      currentSetsForExercise
    );


  const previous1RM =
    getBestEstimated1RM(
      previous.exercise.sets || []
    );


  const oneRMDifference =
    current1RM - previous1RM;


  return {

    previous,
    currentLoad,
    previousLoad,
    difference,
    percent,
    currentMax,
    previousMax,
    maxDifference,
    current1RM,
    previous1RM,
    oneRMDifference

  };

}


/* =========================================================
   COMPARISON UI
========================================================= */

function comparisonText(comparison){

  if(!comparison){
    return "";
  }


  let resultClass =
    "comparison-same";


  let resultText =
    "前回と同じ総負荷";


  if(comparison.difference > 0){

    resultClass =
      "comparison-up";


    resultText =
      `前回比：+${comparison.difference.toLocaleString()} kg（+${comparison.percent.toFixed(1)}%）`;

  }


  else if(comparison.difference < 0){

    resultClass =
      "comparison-down";


    resultText =
      `前回比：${comparison.difference.toLocaleString()} kg（${comparison.percent.toFixed(1)}%）`;

  }


  return `

    <div class="comparison-box">

      <div class="comparison-title">
        前回との比較
      </div>

      <div class="comparison-line">
        前回：${formatDate(comparison.previous.date)}
      </div>

      <div class="comparison-line">
        前回総負荷：
        ${comparison.previousLoad.toLocaleString()} kg
      </div>

      <div class="comparison-line">
        今回総負荷：
        ${comparison.currentLoad.toLocaleString()} kg
      </div>

      <div class="comparison-line ${resultClass}">
        ${resultText}
      </div>

      <div class="comparison-line">
        最大重量：
        前回 ${comparison.previousMax} kg
        →
        今回 ${comparison.currentMax} kg
        （${comparison.maxDifference >= 0 ? "+" : ""}${comparison.maxDifference} kg）
      </div>

      <div class="comparison-line">
        推定1RM：
        前回 ${comparison.previous1RM.toFixed(1)} kg
        →
        今回 ${comparison.current1RM.toFixed(1)} kg
        （${comparison.oneRMDifference >= 0 ? "+" : ""}${comparison.oneRMDifference.toFixed(1)} kg）
      </div>

    </div>

  `;

}


/* =========================================================
   PREVIOUS UI
========================================================= */

function updatePreviousRecord(){

  const exerciseName =
    document.getElementById("exercise").value;


  const selectedDate =
    document.getElementById("trainingDate").value;


  const area =
    document.getElementById("previousRecord");


  area.innerHTML = "";


  if(!exerciseName || !selectedDate){

    area.style.display =
      "none";

    return;

  }


  const previous =
    findPreviousRecord(
      exerciseName,
      selectedDate
    );


  area.style.display =
    "block";


  if(!previous){

    area.innerHTML = `

      <div class="previous-title">
        前回の記録
      </div>

      <div class="previous-date">
        ${exerciseName}の前回の記録はありません
      </div>

    `;

    return;

  }


  let setsHTML = "";


  (previous.exercise.sets || [])
    .forEach(
      (set,index) => {

        setsHTML += `

          <div class="previous-set">
            セット ${index + 1}：
            ${set.weight} kg ×
            ${set.reps} 回
          </div>

          <div class="one-rm">
            推定1RM：約
            ${calculateEstimated1RM(
              set.weight,
              set.reps
            ).toFixed(1)}
            kg
          </div>

        `;

      }
    );


  const previousLoad =
    calculateExerciseLoad(
      previous.exercise.sets || []
    );


  area.innerHTML = `

    <div class="previous-title">
      前回の記録
    </div>

    <div class="previous-date">
      ${formatDate(previous.date)}
    </div>

    ${setsHTML}

    <div class="previous-total">
      前回総負荷：
      ${previousLoad.toLocaleString()} kg
    </div>

    <div class="one-rm-best">
      前回の推定1RM：
      ${getBestEstimated1RM(
        previous.exercise.sets || []
      ).toFixed(1)}
      kg
    </div>

  `;

}


/* =========================================================
   ADD SET
========================================================= */

function addSet(){

  const exercise =
    document.getElementById("exercise").value;


  const weight =
    document.getElementById("weight").value;


  const reps =
    document.getElementById("reps").value;


  if(
    !exercise ||
    weight === "" ||
    reps === ""
  ){

    alert(
      "種目・重量・回数をすべて入力してください"
    );

    return;

  }


  if(
    currentSets.length > 0 &&
    currentSets[0].exercise !== exercise
  ){

    alert(
      "先に「この種目を完了」を押してください"
    );

    return;

  }


  const weightNumber =
    Number(weight);


  const repsNumber =
    Number(reps);


  if(
    !Number.isFinite(weightNumber) ||
    !Number.isFinite(repsNumber) ||
    weightNumber < 0 ||
    repsNumber <= 0
  ){

    alert(
      "重量と回数を正しく入力してください"
    );

    return;

  }


  currentSets.push({

    exercise:exercise,

    weight:weightNumber,

    reps:repsNumber

  });


  renderCurrentSets();

  updateTodayTotal();


  document.getElementById(
    "weight"
  ).value = "";


  document.getElementById(
    "reps"
  ).value = "";

}


/* =========================================================
   DELETE CURRENT SET
========================================================= */

function deleteCurrentSet(index){

  if(
    index < 0 ||
    index >= currentSets.length
  ){

    return;

  }


  currentSets.splice(
    index,
    1
  );


  renderCurrentSets();

  updateTodayTotal();

}


/* =========================================================
   CURRENT SET UI
========================================================= */

function renderCurrentSets(){

  const area =
    document.getElementById(
      "currentSets"
    );


  area.innerHTML = "";


  if(currentSets.length === 0){

    area.innerHTML = `

      <div class="empty-sets">
        まだセットがありません
      </div>

    `;

  }

  else{

    const title =
      document.createElement(
        "div"
      );


    title.className =
      "set-list-title";


    title.textContent =
      "入力中のセット";


    area.appendChild(title);


    currentSets.forEach(
      (set,index) => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "set-item";


        const number =
          document.createElement(
            "span"
          );


        number.className =
          "set-number";


        number.textContent =
          `セット ${index + 1}`;


        const value =
          document.createElement(
            "span"
          );


        value.className =
          "set-value";


        value.textContent =
          `${set.weight} kg × ${set.reps} 回`;


        const deleteButton =
          document.createElement(
            "button"
          );


        deleteButton.type =
          "button";


        deleteButton.className =
          "set-delete";


        deleteButton.textContent =
          "削除";


        deleteButton.addEventListener(
          "click",
          function(){

            deleteCurrentSet(index);

          }
        );


        item.appendChild(
          number
        );


        item.appendChild(
          value
        );


        item.appendChild(
          deleteButton
        );


        area.appendChild(
          item
        );

      }
    );

  }


  document.getElementById(
    "exercise"
  ).disabled =
    currentSets.length > 0;

}


/* =========================================================
   TODAY EXERCISES
========================================================= */

function getTodayExercises(){

  const date =
    document.getElementById(
      "trainingDate"
    ).value;


  const history =
    getHistory();


  const savedRecord =
    history.find(
      record =>
        record.date === date
    );


  const savedExercises =
    savedRecord
      ? savedRecord.exercises || []
      : [];


  return [

    ...savedExercises,

    ...currentExercises

  ];

}


/* =========================================================
   TODAY UI
========================================================= */

function renderTodayExercises(){

  const area =
    document.getElementById(
      "todayExercises"
    );


  const exercises =
    getTodayExercises();


  const selectedDate =
    document.getElementById(
      "trainingDate"
    ).value;


  const isToday =
    selectedDate === getToday();


  document.getElementById(
    "todayTitle"
  ).textContent =

    isToday
      ? "今日のトレーニング"
      : `${formatDate(selectedDate)}のトレーニング`;


  if(exercises.length === 0){

    area.innerHTML = `

      <div class="today-empty">
        まだ完了した種目はありません
      </div>

    `;

    return;

  }


  let html = "";


  exercises.forEach(
    exercise => {

      const sets =
        exercise.sets || [];


      const load =
        calculateExerciseLoad(
          sets
        );


      const comparison =
        getComparison(
          exercise.exercise,
          sets,
          selectedDate
        );


      html += `

        <div class="today-exercise">

          <div class="today-exercise-name">
            ${exercise.exercise}
          </div>

          <div class="today-exercise-summary">
            ${sets.length}セット
          </div>

      `;


      sets.forEach(
        (set,index) => {

          html += `

            <div class="today-set">
              セット ${index + 1}：
              ${set.weight} kg ×
              ${set.reps} 回
            </div>

            <div class="one-rm">
              推定1RM：約
              ${calculateEstimated1RM(
                set.weight,
                set.reps
              ).toFixed(1)}
              kg
            </div>

          `;

        }
      );


      html += `

          <div class="today-exercise-total">
            種目総負荷：
            ${load.toLocaleString()} kg
          </div>

          <div class="one-rm-best">
            今回の推定1RM：
            ${getBestEstimated1RM(
              sets
            ).toFixed(1)}
            kg
          </div>

          ${comparisonText(
            comparison
          )}

        </div>

      `;

    }
  );


  area.innerHTML =
    html;

}


/* =========================================================
   COMPLETE EXERCISE
========================================================= */

function completeExercise(){

  if(currentSets.length === 0){

    alert(
      "まずセットを追加してください"
    );

    return;

  }


  const exercise =
    currentSets[0].exercise;


  const sets =
    currentSets.map(
      set => ({

        weight:set.weight,

        reps:set.reps

      })
    );


  currentExercises.push({

    exercise:exercise,

    sets:sets,

    totalLoad:
      calculateExerciseLoad(
        sets
      )

  });


  currentSets = [];


  renderCurrentSets();


  document.getElementById(
    "exercise"
  ).disabled = false;


  document.getElementById(
    "exercise"
  ).value = "";


  renderTodayExercises();

  updateTodayTotal();

}


/* =========================================================
   TOTAL
========================================================= */

function updateTodayTotal(){

  const exercises =
    getTodayExercises();


  let total = 0;


  exercises.forEach(
    exercise => {

      total +=
        calculateExerciseLoad(
          exercise.sets || []
        );

    }
  );


  if(currentSets.length > 0){

    total +=
      calculateExerciseLoad(
        currentSets
      );

  }


  document.getElementById(
    "todayTotalLoad"
  ).textContent =
    total.toLocaleString();

}


/* =========================================================
   SAVE
========================================================= */

function saveTodayWorkout(){

  const date =
    document.getElementById(
      "trainingDate"
    ).value;


  if(!date){

    alert(
      "トレーニング日を選択してください"
    );

    return;

  }


  if(currentSets.length > 0){

    completeExercise();

  }


  if(currentExercises.length === 0){

    const history =
      getHistory();


    const savedRecord =
      history.find(
        record =>
          record.date === date
      );


    if(
      !savedRecord ||
      !savedRecord.exercises ||
      savedRecord.exercises.length === 0
    ){

      alert(
        "まずトレーニングを入力してください"
      );

      return;

    }


    renderTodayExercises();

    updateTodayTotal();

    renderHistory();

    return;

  }


  const history =
    getHistory();


  let dayRecord =
    history.find(
      record =>
        record.date === date
    );


  if(dayRecord){

    dayRecord.exercises.push(
      ...currentExercises
    );

  }

  else{

    dayRecord = {

      date:date,

      exercises:[
        ...currentExercises
      ]

    };


    history.unshift(
      dayRecord
    );

  }


  saveHistory(
    history
  );


  currentExercises = [];

  currentSets = [];


  renderCurrentSets();


  document.getElementById(
    "exercise"
  ).disabled = false;


  document.getElementById(
    "exercise"
  ).value = "";


  renderTodayExercises();

  updateTodayTotal();

  renderHistory();

  updatePreviousRecord();


  alert(
    "トレーニングを保存しました"
  );

}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){

  const area =
    document.getElementById(
      "history"
    );


  area.innerHTML = "";


  const history =
    getHistory();


  if(history.length === 0){

    area.innerHTML = `

      <div class="empty">
        まだ記録がありません
      </div>

    `;

    return;

  }


  history
    .sort(
      (a,b) =>
        b.date.localeCompare(
          a.date
        )
    )
    .forEach(
      record => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "record";


        let exercisesHTML = "";

        let dayTotal = 0;


        (record.exercises || [])
          .forEach(
            exercise => {

              const exerciseLoad =
                calculateExerciseLoad(
                  exercise.sets || []
                );


              dayTotal +=
                exerciseLoad;


              let setsHTML = "";


              (exercise.sets || [])
                .forEach(
                  (set,index) => {

                    setsHTML += `

                      セット ${index + 1}：
                      ${set.weight} kg ×
                      ${set.reps} 回
                      <br>

                      <span class="one-rm">
                        推定1RM：約
                        ${calculateEstimated1RM(
                          set.weight,
                          set.reps
                        ).toFixed(1)}
                        kg
                      </span>

                      <br>

                    `;

                  }
                );


              exercisesHTML += `

                <div class="exercise">
                  ${exercise.exercise}
                </div>

                <div class="details">

                  ${setsHTML}

                  <div class="exercise-total">
                    種目総負荷：
                    ${exerciseLoad.toLocaleString()}
                    kg
                  </div>

                  <div class="one-rm-best">
                    推定1RM：
                    ${getBestEstimated1RM(
                      exercise.sets || []
                    ).toFixed(1)}
                    kg
                  </div>

                </div>

              `;

            }
          );


        item.innerHTML = `

          <div class="date-title">
            ${formatDate(record.date)}
          </div>

          <div class="workout-title">
            TRAINING SESSION
          </div>

          ${exercisesHTML}

          <div class="day-total">
            1日の総負荷：
            ${dayTotal.toLocaleString()} kg
          </div>

          <button
            type="button"
            class="delete-button"
          >
            この記録を削除
          </button>

        `;


        const deleteButton =
          item.querySelector(
            ".delete-button"
          );


        deleteButton.addEventListener(
          "click",
          function(){

            deleteWorkout(
              record.date
            );

          }
        );


        area.appendChild(
          item
        );

      }
    );

}


/* =========================================================
   DELETE HISTORY
========================================================= */

function deleteWorkout(date){

  const ok =
    confirm(
      `${formatDate(date)}のトレーニング記録を削除しますか？`
    );


  if(!ok){
    return;
  }


  let history =
    getHistory();


  history =
    history.filter(
      record =>
        record.date !== date
    );


  saveHistory(
    history
  );


  renderHistory();

  renderTodayExercises();

  updateTodayTotal();

  updatePreviousRecord();

}


/* =========================================================
   EVENTS
========================================================= */

document
  .getElementById(
    "addSetButton"
  )
  .addEventListener(
    "click",
    addSet
  );


document
  .getElementById(
    "completeExerciseButton"
  )
  .addEventListener(
    "click",
    completeExercise
  );


document
  .getElementById(
    "saveTodayButton"
  )
  .addEventListener(
    "click",
    saveTodayWorkout
  );


document
  .getElementById(
    "exercise"
  )
  .addEventListener(
    "change",
    function(){

      updatePreviousRecord();

      renderTodayExercises();

    }
  );


document
  .getElementById(
    "trainingDate"
  )
  .addEventListener(
    "change",
    function(){

      currentSets = [];

      currentExercises = [];


      renderCurrentSets();


      document.getElementById(
        "exercise"
      ).disabled = false;


      document.getElementById(
        "exercise"
      ).value = "";


      renderTodayExercises();

      updateTodayTotal();

      updatePreviousRecord();

    }
  );


/* =========================================================
   INIT
========================================================= */

document.getElementById(
  "trainingDate"
).value =
  getToday();


renderHistory();

renderTodayExercises();

updateTodayTotal();

renderCurrentSets();

</script>
